,321:{1:`侵入住宅竊盜罪`,2:`毀越〔門窗／牆垣／安全設備〕竊盜罪`,3:`攜帶兇器竊盜罪`,4:`結夥三人以上竊盜罪`,5:`乘〔災害〕之際竊盜罪`,6:`在〔車站／公眾運輸之舟車〕內竊盜罪`,many:function(e){return`刑法第321條第1項第`+e.slice().sort(function(e,t){return t-e}).join(`、`)+`款之竊盜罪`},none:`加重竊盜罪`},"185-3-1":{1:`吐氣所含酒精濃度達每公升零點二五毫克以上而駕駛動力交通工具罪`,2:`服用酒類致不能安全駕駛動力交通工具罪`,3:`尿液所含毒品代謝物達行政院公告之品項及濃度值以上而駕駛動力交通工具罪`,4:`施用毒品致不能安全駕駛動力交通工具罪`,none:`不能安全駕駛致交通危險罪`}},N=function(e,t,n){return`按行為後法律有變更者，適用行為時之法律；但行為後之法律有利於行為人者，適用最有利於行為人之法律，刑法第2條第1項定有明文。查被告行為後，`+e+`於`+t+`修正公布，並自`+n+`施行。`},P=function(e,t){return`新舊法比較：被告行為後，`+e+`雖經修正，惟`+t+`，非屬刑法第2條第1項所指之法律變更，不生新舊法比較問題，應依一般法律適用原則，逕適用裁判時法（最高法院107年度台上字第4438號判決意旨參照）。`},te=[{id:`gun`,n:`槍砲彈藥刀械管制條例`,m:function(e){return(e.e.law||e.s.law)===`槍砲彈藥刀械管制條例`},mm:function(e){return!!(e.gun18||e.gun18b)},t:`新舊法比較：被告行為後，槍砲彈藥刀械管制條例第7條、第8條於109年6月10日修正公布，並自同年月12日施行，於構成要件增列「制式或非制式」。被告非法`+k(`持有／寄藏`)+`槍枝之行為，其持有之繼續為行為之繼續，犯罪完結須繼續至持有行為終了時為止，其間法律縱有變更，既繼續實施至新法施行以後，即與犯罪後法律有變更之情形不同，不生新舊法比較之問題（最高法院95年度台上字第3461號、102年度台上字第1305號判決意旨參照）。被告持有行為終了於`+k(`終了日`)+`，已在修正施行之後，應逕適用修正後之規定。`,h:[`【槍砲§7、§8（109.6.12施行）】持有、寄藏為繼續犯，以行為終了時之法律為行為時法；終了日在修正施行後者，無新舊法比較，逕適用修正後（臺北地院112訴1607、113訴226；士林地院112訴445；新北地院111訴緝68）。繼續日數自被告取得至查獲、交付他人或自首止，事實欄須載明終了日。`,`【即成犯（製造、販賣、運輸）】持有制式手槍者修法前後均依§7Ⅳ，法定刑度無不同，非法律變更，適用裁判時法（新北地院113訴緝23，引最高法院107台上4438）。`,`【§18Ⅰ、Ⅳ自首、自白供述來源減免】由「減輕或免除其刑」改為「得減輕或免除其刑」（109.6.12；113.1.5再修正），減免由必然改為裁量，修正後較不利，應適用修正前（新北地院113訴緝23、111訴1534）。`,`【§4Ⅲ主要組成零件公告（113.1.5）】僅授權主管機關公告零件「材質」，補充構成要件之事實內容，屬空白刑法補充規範，無涉刑罰法律構成要件或法律效果之變更，無新舊法比較問題（臺北地院112訴1149）。`,`【§9-1（113.1.5增訂）】公共場所開槍射擊為新增獨立罪名，行為在施行前者不得溯及適用；與本案無涉者毋庸比較，逕適用現行規定（臺北地院112訴1217）。`]},{id:`span`,n:`實質上一罪跨越修法（集合犯、繼續犯、接續犯）`,m:function(e){return(e.e.law||e.s.law)===`銀行法`},mm:function(e,t){return t.some(function(e){return e.law===`證券交易法`})},t:`新舊法比較：被告就事實欄所示`+k(`辦理地下通匯／證券詐偽`)+`之`+k(`集合犯／繼續犯／接續犯`)+`，犯罪時間自`+k(`起日`)+`持續至`+k(`終了日`)+`，橫跨`+k(`法律名稱及條號`)+`於`+k(`公布日`)+`修正公布、`+k(`施行日`)+`施行之前後。按實質上一罪僅給予一行為一罪之刑罰評價，其行為時間自著手之初，持續至行為終了，並延伸至結果發生為止，部分作為或結果已在新法施行之後者，應即適用新規定，不生依刑法第2條比較新舊法而為有利適用之問題（最高法院103年度台上字第1904號、112年度台上字第3860號判決意旨參照）。`,h:[`【跨越修法之實質上一罪】接續犯、繼續犯、集合犯、吸收犯、結合犯均屬實質上一罪，行為時間跨越新舊法者，逕適用新法（銀行法§125修正107.2.2，臺北地院112金訴3；證交法§171Ⅱ、§179，臺北地院109金重訴29）。連續犯已於95.7.1廢止，不在此列。`,`【非法律變更】修正內容僅屬司法實務見解之明文化或於本案適用無變動者，亦無比較問題。`]},{id:`theft`,n:`竊盜（刑法§320、§321）`,m:function(e){return e.e.k===`320`||e.e.k===`321`},t:`新舊法比較：`+N(`刑法第`+k(`320／321`)+`條`,`108年5月29日`,`同年月31日`)+`修正前規定：「`+k(`修正前條文`)+`」；修正後規定：「`+k(`修正後條文`)+`」。經比較新舊法之結果，修正後`+k(`提高罰金刑法定刑（§320罰金由500元以下提高為50萬元以下；§321得併科之罰金提高為50萬元以下）`)+`，並未較有利於被告，依刑法第2條第1項前段規定，應適用被告行為時即108年5月29日修正前之規定。`,h:[`【§320Ⅰ、§321Ⅰ（108.5.31）】罰金刑提高，新法未較有利，適用行為時法；論罪欄冠「108年5月29日修正前」（臺北地院113審易968、113審簡1175）。`,`【§321Ⅰ（100.1.28）】100年修正刪除第1款「於夜間」、第6款擴及航空站及公眾運輸之舟車航空機內、增訂得併科罰金；加108年再修正，二次修正均未較有利，適用100.1.28修正施行前之規定（新北地院113審簡349）。`,`【罪名用語】修正前第2款為「毀越門扇、牆垣或其他安全設備」，起訴書所引條項款相同者，毋庸變更起訴法條（臺北地院113審易968）。`]},{id:`f3394`,n:`加重詐欺（刑法§339-4第1項第4款）`,m:function(e){return e.e.k===`339-4`},t:P(`刑法第339條之4`,`該條於112年5月31日修正公布（自112年6月2日生效），僅增訂第1項第4款「以電腦合成或其他科技方法製作關於他人不實影像、聲音或電磁紀錄之方法犯之」，法定刑度及其餘款次均未變動，與被告所涉第1項第`+k(`2`)+`款無關`),h:[`【§339-4Ⅰ④（112.6.2）】增訂第4款，與被告所涉其他款無關者，無比較問題，逕適用新法（臺北地院113審簡1472、113審訴緝13；士林地院111矚重訴1）。生效日期：上開判決有載「6月3日」與「6月2日」二說，請以總統令公布日起算（中央法規標準法§13）核對後記載。`,`詐欺條例§43、§44、§47之比較，見「詐洗＋沒收」頁。`]},{id:`ml`,n:`洗錢防制法（一般洗錢罪）`,m:function(e){return/^洗/.test(e.e.k)},t:`新舊法比較：`+N(`洗錢防制法第14條第1項、第16條第2項`,`113年7月31日`,`同年8月2日`)+`修正前第14條第1項規定「`+k(`7年以下有期徒刑，併科新臺幣500萬元以下罰金`)+`」，修正後移列第19條第1項後段，洗錢之財物或財產上利益未達新臺幣1億元者，處「`+k(`6月以上5年以下有期徒刑，併科5,000萬元以下罰金`)+`」；修正前第16條第2項「偵查及歷次審判中均自白者，減輕其刑」，修正後移列第23條第3項，增加「如有所得並自動繳交全部所得財物者」之要件。又比較新舊法時，應就罪刑有關之共犯、未遂犯、想像競合犯、累犯加重、自首減輕暨其他法定加減原因與加減例等一切情形，綜其全部罪刑之結果而為比較，不得割裂適用（最高法院113年度台上字第2303號判決意旨參照）。經整體比較，`+k(`修正後最高法定刑由7年降為5年，雖最低法定刑及罰金上限提高並限縮自白減刑範圍，仍以修正後規定較有利於被告／修正後規定並未較有利於被告`)+`，依刑法第2條第1項`+k(`但書／前段`)+`規定，應整體適用`+k(`修正後／修正前`)+`之規定。`,h:[`【洗錢防制法112.6.16修正（§16Ⅱ）】「偵查或審判中自白」改為「偵查及歷次審判中均自白」，限縮減刑，核屬法律變更，修正後未較有利，適用修正前§16Ⅱ（臺北地院112訴649；新北地院113金訴381）；惟洗錢罪為想像競合之輕罪、重罪（加重詐欺）無法定減刑事由者，無從減刑，僅於刑法§57量刑時一併審酌（新北地院113金訴381）。`,`【洗錢防制法113.8.2修正】舊§14→§19、舊§16Ⅱ→§23Ⅲ；洗錢財物未達1億元者最高刑由7年降為5年，最低刑及罰金上限提高，並增訂「有所得並自動繳交」之減刑要件。結論須整體比較個案：士林地院113審訴775採新法較有利；個案如被告有自白減刑適用而新法不符要件，則可能以舊法較有利（舊法併有§14Ⅲ不得科以超過特定犯罪最重本刑之宣告刑限制，亦須併予比較）。不得割裂適用（最高法院113台上2303）。`,`【洗錢罪沒收】沒收依裁判時法（刑法§2Ⅱ），洗錢防制法§25Ⅰ逕行適用，不生新舊法比較。`,`想像競合時，洗錢輕罪之自白減刑事由無從直接減刑者，於量刑時依刑法§57一併審酌（新北地院113金訴381）。`]},{id:`org`,n:`組織犯罪防制條例`,m:function(e){return/^組/.test(e.e.k)},mm:function(e){return!!(e.org8||e.org8a)},t:`新舊法比較：`+N(`組織犯罪防制條例第3條、第4條、第8條`,`112年5月24日`,`同年月26日`)+`修正後之第3條未修正法定刑度，僅刪除強制工作之規定（該部分業經司法院釋字第812號解釋宣告違憲失效，修法僅明文刪除，無新舊法比較問題），並將加重處罰規定移列第6條之1；修正前第8條第1項規定「偵查及審判中均自白者，減輕其刑」，修正後則規定「偵查及歷次審判中均自白者，減輕其刑」，限縮減刑之適用範圍；又修正後第4條增列第2項，就`+k(`招募他人加入犯罪組織而意圖使他人出中華民國領域外實行犯罪`)+`者設較重處罰規定。經綜合比較，修正後之規定並未較有利於被告，依刑法第2條第1項前段規定，應整體適用修正前之規定。`,h:[`【112.5.26修正】§3法定刑未變、刪強制工作並移列§6-1；§8Ⅰ「審判中」改為「歷次審判中」，新法較不利者整體適用修正前（臺北地院112審訴2389；士林地院111矚重訴1）。`,`修正與被告所犯§3、§4無涉者（如未涉§4Ⅱ、無§8自白減刑適用），無比較問題，逕適用裁判時法（士林地院112金訴794）。`,`【配套增訂】刑法§302-1（112.6.2）加重剝奪行動自由罪，增訂加重要件並提高法定刑，行為在施行前者新法未較有利，適用修正前§302（士林地院111矚重訴1）。`]},{id:`dv`,n:`家庭暴力防治法§61`,m:function(e){return e.e.k===`家暴61`},t:P(`家庭暴力防治法第61條`,`修正後（112年12月6日修正公布，同年月8日施行）僅增列第6款至第8款與被害人性影像相關之違反保護令態樣，並將現有或曾有親密關係之未同居伴侶納入，其法定刑度及第1款至第5款規定均未修正，被告所涉第`+k(`1`)+`款之情形與上開修正無涉`),h:[`【家暴§61（112.12.8）】增列第6至8款（性影像）及未同居伴侶；被告所犯為第1至5款者，無比較問題，逕適用現行法（新北地院113簡1949、113審訴166）。若被告行為屬新增態樣（第6至8款），行為在施行前者不得溯及。`]},{id:`dui`,n:`不能安全駕駛（刑法§185-3）`,m:function(e){return/^185-3/.test(e.e.k)},t:P(`刑法第185條之3第1項`,`該條項於112年12月27日修正公布（同年月29日施行），修正內容為增訂第3款「尿液或血液所含毒品、麻醉藥品或其他相類之物或其代謝物達行政院公告之品項及濃度值以上」，並將原第3款「服用毒品、麻醉藥品或其他相類之物，致不能安全駕駛」移列為第4款、酌作文字修正（「服用」改為「施用」），構成要件及法定刑均無擴張、限縮或變更`),h:[`【§185-3Ⅰ（112.12.29）】地院多認第3款移列第4款僅條次移列及文字修正，無比較問題，逕適用裁判時法（士林地院113審簡385、113審交簡155、112交簡上86：第1款未修正亦同）。`,`【對照：高等法院】臺灣高院114交上易23就毒駕款曾為新舊法比較並適用舊法（本處依先前檢索摘要，引用前請調閱原判決核對）；行為在112.12.29前而論新增第3款（濃度值）者，不得溯及，應論行為時第3款（服用致不能安全駕駛）之事實。`,`【空白刑法】新第3款所稱「行政院公告之品項及濃度值」屬補充規範，嗣後公告變動僅為事實變更，依行為時公告認定（此為依最高法院113台非168見解之推演，未查得直接適用本款之判決，請個案核對）。`]},{id:`dj86`,n:`道路交通管理處罰條例§86Ⅰ`,m:function(){return!1},mm:function(e){return!!e.sp86},t:`新舊法比較：被告行為後，道路交通管理處罰條例第86條第1項於112年5月3日修正公布，於同年6月30日施行。修正前規定汽車駕駛人`+k(`無駕駛執照駕車`)+`，因而致人受傷或死亡，依法應負刑事責任者，「加重其刑至二分之一」；修正後則將「無駕駛執照駕車」之構成要件明確化為「未領有駕駛執照駕車」及「駕駛執照經吊銷、註銷或吊扣期間駕車」，分列第1款、第2款，並由「應」加重改為「得」加重其刑至二分之一。經比較新舊法之結果，修正後之規定較有利於被告，依刑法第2條第1項但書規定，應適用修正後之規定。`,h:[`【道交§86Ⅰ（112.6.30）】「應加重」改為「得加重」，新法有利，適用新法；明確化構成要件不屬構成要件變更（臺北地院113審交訴12）。適用新法後須於理由說明是否加重及其理由（得加重屬裁量）。`]},{id:`cse`,n:`兒童及少年性剝削防制條例`,m:function(e){return/兒童及少年性剝削防制條例/.test(e.e.law||e.s.law||``)},mm:function(e,t){return t.some(function(e){return/兒童及少年性剝削防制條例/.test(e.law)})},t:`新舊法比較：被告行為後，兒童及少年性剝削防制條例第2條第1項第3款、第36條於112年2月15日修正公布，同年月17日生效。`+k(`§36Ⅰ：`)+`第36條第1項係配合同條例第2條第1項第3款及刑法第10條第8項「性影像」之定義為文字修正，未實質擴大構成犯罪之行為，亦未提高或降低法定刑度，不生有利或不利被告之問題，無刑法第2條第1項之適用，應依現行規定論處。`+k(`§36Ⅱ：`)+`第36條第2項之法定刑由「3年以上7年以下有期徒刑」修正為「3年以上10年以下有期徒刑」，經比較新舊法，以修正前之規定較有利於被告，應適用行為時即修正前之規定。`,h:[`【兒少性剝削§36（112.2.17）】Ⅰ項僅文字修正，無比較（橋頭地院113審訴92，引最高法院111台上3365）；Ⅱ項法定刑上限提高，適用修正前（臺灣高院113上訴2204）。`,`【大法庭114台上大1405】偷拍不該當§36Ⅲ，應論§36Ⅰ（引用前請調閱原裁定核對）。`]},{id:`minor18`,n:`成年年齡（民法§12）與兒少權益法§112Ⅰ`,m:function(){return!1},mm:function(e){return!!e.k112},t:`新舊法比較：被告行為後，民法第12條於110年1月13日修正公布，自112年1月1日施行，成年年齡由「滿20歲」修正為「滿18歲」。被告於行為時（`+k(`行為日期`)+`）為`+k(`18歲以上未滿20歲`)+`，依修正後民法第12條規定已屬成年，而須依兒童及少年福利與權益保障法第112條第1項前段加重其刑，並未較有利於被告，依刑法第2條第1項前段規定，應適用行為時即修正前民法第12條規定認定被告未成年，無兒童及少年福利與權益保障法第112條第1項前段加重規定之適用。`,h:[`【民法§12（112.1.1）】行為在112.1.1前、行為人18歲以上未滿20歲者，成年年齡新法使其須負§112Ⅰ前段加重，不利，適用行為時法（士林地院111矚重訴1）。行為在施行後者無此問題。`]},{id:`sva`,n:`性侵害犯罪防治法§21Ⅱ→§50Ⅲ`,m:function(){return!1},mm:function(e,t){return t.some(function(e){return/性侵害犯罪防治法/.test(e.law)})},t:`新舊法比較：被告行為後，性侵害犯罪防治法於112年2月15日修正公布全文56條，修正前第21條第2項規定「前項加害人屆期仍不履行者，處1年以下有期徒刑、拘役或科或併科新臺幣5萬元以下罰金」，修正後移列第50條第3項，罰金上限提高為新臺幣10萬元以下。經比較新舊法，修正後未較有利於被告，依刑法第2條第1項前段規定，應適用被告行為時即修正前第21條第2項之規定。`,h:[`【性侵害防治法§21Ⅱ→§50Ⅲ（112.2.15）】罰金上限5萬提高為10萬，新法不利，適用修正前（士林地院112易571）。先前檢索有高院適用舊法、地院見解不一之情形，引用前請核對。`]},{id:`guard`,n:`監護處分（刑法§87）`,m:function(){return!1},mm:function(e){return!!(e.r19||e.r20)},t:`新舊法比較：監護處分兼具治療保護及監禁以防衛社會安全之雙重意義，屬拘束人身自由之保安處分，遇有法律變更，仍有刑法第2條第1項新舊法比較之適用。刑法第87條於111年2月18日修正公布、同年月20日施行，修正前、後之監護期間均為5年以下，惟修正後第3項增加檢察官得聲請法院許可延長之規定（第1次延長3年以下，第2次以後每次1年以下），且無次數限制，並增訂令入相當處所「或以適當方式」及每年評估等規定。經合併保安處分執行法第46條至第46條之3之修正綜合比較，修正後之規定並未較有利於被告，依刑法第2條第1項前段規定，應適用行為時即修正前刑法第87條之規定。`,h:[`【監護處分（111.2.20）】監護處分屬拘束人身自由之保安處分，適用新舊法比較（刑法§2Ⅰ），非§2Ⅱ之裁判時法；新法得延長且無次數限制，較不利，適用修正前§87（臺北地院111易479）。注意與「非拘束人身自由之保安處分」及沒收（§2Ⅱ）區別。`]},{id:`fine`,n:`罰金換算（刑法施行法§1-1Ⅱ，108.12.27）`,m:function(e){return/^(214|215|335|336-1|336-2|201-1|201-2)$/.test(e.e.k)},t:P(`刑法`+k(`第214條／第215條／第335條第1項／第336條第2項／第201條`)+`（108年12月25日修正公布，同年月27日施行）`,`本次修正僅依刑法施行法第1條之1第2項前段規定，將原按銀元計算之罰金數額調整換算為新臺幣數額（原條文自72年6月26日後均未修正，罰金數額已依該規定提高為30倍），修正前後之構成要件及法定刑實質內容並無不同`),h:[`【罰金換算（108.12.27）】§201、§214、§215、§335、§336Ⅱ等修正僅為罰金數額換算，無涉刑罰權內容變更，無比較問題，逕適用裁判時法（臺北地院112簡1643、112審訴緝86；新北地院112審簡1094、112訴314；證交案臺北地院109金重訴29）。`,`【§201罰金最低額】94.2.2修正之刑法§33⑤罰金最低額較修正前提高，行為在94.2.2前者，以修正前§33⑤較有利（臺北地院112審訴緝86）。`,`【牽連犯】牽連犯（§55後段）已於94.2.2修正刪除、95.7.1施行，行為在95.7.1前者，依行為時規定從一重處斷較有利於被告（臺北地院112審訴緝86）；新法則應分論併罰。`]},{id:`pub`,n:`妨害公務（刑法§135Ⅰ、§140Ⅰ）`,m:function(e){return/^(135-1|135-3|140)$/.test(e.e.k)},t:`新舊法比較：被告行為後，刑法`+k(`第135條第1項／第140條第1項`)+`先於108年12月27日修正施行（依刑法施行法第1條之1第2項前段將罰金數額提高為30倍，構成要件及法定刑實質內容無變更，不生新舊法比較問題），嗣`+k(`第135條第1項於110年1月20日修正公布、同年月22日施行，罰金刑由9,000元以下提高為30萬元以下／第140條第1項於111年1月12日修正公布、同年月14日施行，法定刑由6個月以下有期徒刑、拘役或3,000元以下罰金提高為1年以下有期徒刑、拘役或10萬元以下罰金`)+`，經比較新舊法結果，以修正前之規定對被告較為有利，依刑法第2條第1項前段規定，應適用行為時即修正前之規定。`,h:[`【§135Ⅰ（110.1.22）、§140Ⅰ（111.1.14）】罰金或刑度提高，適用行為時法（臺灣高院113上易575）；108.12.27罰金倍數換算則無比較問題。`]},{id:`hurt`,n:`傷害（刑法§277Ⅰ）`,m:function(e){return e.e.k===`277-1`},t:`新舊法比較：被告行為後，刑法第277條第1項於108年5月29日修正公布，並自同年月31日施行。修正前規定「傷害人之身體或健康者，處3年以下有期徒刑、拘役或1,000元以下罰金」；修正後規定「處5年以下有期徒刑、拘役或50萬元以下罰金」，有期徒刑刑度及罰金刑均提高，經比較新舊法之結果，修正後之規定並未較有利於被告，依刑法第2條第1項前段規定，應適用行為時即修正前之規定。`,h:[`【§277Ⅰ（108.5.31）】3年→5年、罰金提高，新法不利，適用修正前（臺灣高院113上易575）。行為在108.5.31後者逕適用現行法，勿誤冠「修正前」。`]},{id:`forest`,n:`森林法§50、§52`,m:function(e){return(e.e.law||e.s.law)===`森林法`},mm:function(e){return!!e.spForest},t:`新舊法比較：`+N(`森林法第50條第1項、第52條第1項、第3項`,`110年5月5日`,`同年月7日`)+`修正前第50條「竊取森林主、副產物，收受、搬運、寄藏、故買或媒介贓物者，處六月以上五年以下有期徒刑，併科新臺幣三十萬元以上三百萬元以下罰金」，修正後分列第1項（罰金提高為三十萬元以上六百萬元以下）、第2項（贓物罪）、第3項（貴重木加重）、第4項（未遂犯罰之）；修正後第52條第1項併科罰金改為新臺幣一百萬元以上二千萬元以下，並增列第9款。經比較新舊法結果，以修正前規定較有利於被告，依刑法第2條第1項前段規定，應適用行為時即修正前之規定。`,h:[`【森林法§50、§52（110.5.7）】罰金上限、下限提高並擴張加重事由，以修正前較有利，適用行為時法（新北地院112訴783）。修正後§50Ⅲ貴重木加重、§50Ⅳ未遂犯罰之，行為在施行前者不得溯及。`]},{id:`drug`,n:`毒品危害防制條例（109.7.15修正）`,m:function(e){return/^毒/.test(e.e.k)},t:`新舊法比較：`+N(`毒品危害防制條例第4條第2項至第4項、第9條第3項、第17條第2項`,`109年1月15日`,`同年7月15日`)+k(`（一）修正前第4條第1項罰金上限2,000萬元，修正後3,000萬元；第2項由「無期徒刑或7年以上有期徒刑，得併科1,000萬元以下罰金」修正為「無期徒刑或10年以上有期徒刑，得併科1,500萬元以下罰金」；第3項罰金700萬元修正為1,000萬元；第4項罰金300萬元修正為500萬元，修正後均提高法定刑，並未較有利於被告。（二）第17條第2項由「偵查及審判中均自白」修正為「偵查及歷次審判中均自白」，限縮減刑適用，並未較有利。（三）增訂第9條第3項：混合二種以上之毒品者，適用其中最高級別毒品之法定刑，並加重其刑至二分之一；修法前實務依想像競合從一重處斷，修正後之加重規定顯較不利。`)+`綜合全部罪刑比較，修正後之規定非有利於被告，依刑法第2條第1項前段規定，應一體適用修正前之毒品危害防制條例。`,h:[`【毒品條例109.7.15修正】§4Ⅰ至Ⅳ罰金提高、§9Ⅲ增訂混合毒品加重、§17Ⅱ「歷次審判」，新法均較不利，行為在109.7.15前者整體適用修正前（新北地院112訴430、111訴20）。`,`【毒品列級（空白刑法）】毒品分級及品項由行政院依毒品條例§2Ⅲ公告，屬補充規範，列級變更僅為事實變更，不生§2Ⅰ比較；論罪依行為時列級，沒收銷燬依裁判時法（§2Ⅱ）。詳「毒品競合」頁新舊法／空白刑法模組。`,`【依托咪酯時間軸】113.8.6公布列第三級→113.11.27列第二級→115.6.27（院臺法字第1155013102B號，115.6.25公告）列第一級；列管前之行為僅論藥事法（偽藥、禁藥）。部分地院判決有載6月25日生效，請以公告核對。`]},{id:`gen`,n:`新舊法比較通則`,m:function(){return!1},mm:function(e,t,n){return!!(e.oldnew||n&&n.oldnew)},t:``,h:[`【通則①：何謂法律變更】包括構成要件擴張、限縮，法定刑度種類及範圍變更，及累犯加重、自首減輕暨其他法定加減原因與加減例之變更；僅文字文義修正、條次移列、罰金數額換算、將實務見解明文化者，非法律變更，逕適用裁判時法（最高法院107台上4438；100台上1616；111台上3365）。`,`【通則②：整體適用、不得割裂】就罪刑有關之共犯、未遂、想像競合、牽連犯、連續犯、結合犯、累犯、自首及其他法定加減原因，綜合全部罪刑之結果比較，不得一部割裂適用（最高法院113台上2303，經大法庭徵詢程序）；惟詐欺條例§47是否與其他規定分別比較，高院間尚有分歧，見「詐洗＋沒收」頁。`,`【通則③：繼續犯、集合犯等實質上一罪】行為跨越修法者，逕適用新法；持有類繼續犯以行為終了時之法律為行為時法。`,`【通則④：沒收、非拘束人身自由之保安處分】依刑法§2Ⅱ適用裁判時法，不生比較問題；拘束人身自由之保安處分（監護、強制治療等）則適用§2Ⅰ。`,`【通則⑤：新增獨立罪名】不得溯及（罪刑法定）；行為在施行前，不論新罪。`,`【通則⑥：空白刑法】刑罰法規授權行政機關以補充規範（如毒品列級、槍砲零件公告、毒駕濃度值）填補構成要件時，補充規範變動為事實變更，不適用§2Ⅰ（最高法院113台非168）；論罪依行為時之補充規範，沒收銷燬依裁判時法；行為人不知列級變更者，另依刑法§16審酌違法性認識錯誤。法律變更（藥事法→菸害防制法）亦非「犯罪後之法律已廢止其刑罰」，不為免訴（刑訴§302④）。`,`【通則⑦：主文與論罪欄標示】適用舊法者，罪名前冠「修正前」並標明修正日期（如「108年5月29日修正前刑法第320條第1項」）；適用現行法者毋庸冠「修正後」；比較無結論差異者記載結論即可，不贅述各項條文。`,`【通則⑧：起訴書引新法而適用舊法】僅屬適用法條之更正，不生變更起訴法條問題，惟宜告知（刑訴§300）。`]}];function F(e,t,n,r){var i=[];return te.forEach(function(a){(e.some(function(e){return a.m(e)})||a.mm&&a.mm(t,n||[],r))&& ，以〔詐術內容〕之方式，致〔被害人〕陷於錯誤，而交付新臺幣（下同）〔金額〕元〔或財物〕予{N}。`,"洗19-1b":`{N}基於一般洗錢之犯意，於民國〔　〕年〔　〕月〔　〕日，將〔特定犯罪所得〕以〔提領／轉匯／轉交〕之方式，掩飾、隱匿該特定犯罪所得之去向（洗錢之財物或財產上利益未達新臺幣1億元）。`,"洗22-3":`{N}無正當理由，基於交付帳戶予他人使用之犯意，〔期約或收受對價〕〔／交付合計3個以上帳戶〕，於民國〔　〕年〔　〕月〔　〕日，在〔地點〕，將其申設之〔帳戶〕之提款卡及密碼〔、網路銀行帳號密碼〕交付〔對象〕使用。`,"組3-1b":`{N}基於參與犯罪組織之犯意，於民國〔　〕年〔　〕月間，加入〔成員〕所組成三人以上，以實施詐術為手段，具有持續性、牟利性之有結構性組織，擔任〔角色〕。`,320:`{N}意圖為自己不法之所有，基於竊盜之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，〔徒手／以〔工具〕〕竊取〔被害人〕所有之〔財物〕（價值新臺幣〔　〕元），得手後離去。`,321:`{N}意圖為自己不法之所有，基於{KUANI}竊盜之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，{KUANT}在〔地點〕竊取〔被害人〕所有之〔財物〕（價值新臺幣〔　〕元），得手後離去。`,"277-1":`{N}基於傷害之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以〔手段〕〔毆打／攻擊〕〔被害人〕，致〔被害人〕受有〔傷勢〕之傷害。`,"277-2d":`{N}基於傷害之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以〔手段〕攻擊〔被害人〕〔部位〕，致〔被害人〕受有〔傷勢〕，〔被害人〕因而於〔時間〕因〔死因〕死亡。{N}對於〔被害人〕之死亡結果，客觀上能預見而主觀上未預見。`,284:`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，駕駛〔車號〕〔車種〕，沿〔路段〕往〔方向〕行駛，行經〔地點〕時，本應注意〔注意義務內容〕，而依當時〔天候、路況、視距等〕情形，並無不能注意之情事，竟疏未注意〔違反義務之具體行為〕，適〔被害人〕〔行進狀況〕，致兩車發生碰撞，〔被害人〕因而受有〔傷勢〕之傷害。`,276:`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，〔從事之行為〕，本應注意〔注意義務內容〕，而依當時情形並無不能注意之情事，竟疏未注意〔違反義務之具體行為〕，致〔被害人〕〔受傷經過〕，因而於〔時間〕因〔死因〕死亡。`,"185-3-1":`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許起至〔　〕時許止，在〔地點〕飲用〔酒類〕後，吐氣所含酒精濃度已達每公升0.25毫克以上，仍基於不能安全駕駛動力交通工具之犯意，自該處駕駛〔車號〕〔車種〕上路。嗣於同日〔　〕時許，行經〔地點〕時為警攔查，並於同日〔　〕時許測得其吐氣所含酒精濃度達每公升〔　〕毫克。`,"185-4a":`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，駕駛〔車號〕〔車種〕行經〔地點〕時，與〔被害人〕發生交通事故，致〔被害人〕受有〔傷勢〕之傷害（過失傷害部分〔另經／未據〕告訴）。詎{N}明知已肇事致人受傷，竟基於肇事逃逸之犯意，未停留現場採取救護或其他必要措施，亦未報警或留下聯絡資料，即逕行駕車離去。`,"135-1":`{N}明知〔公務員姓名〕係〔機關〕員警，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕依法執行〔職務內容〕，竟基於妨害公務執行之犯意，以〔強暴／脅迫之具體手段〕，對依法執行職務之公務員施強暴。`,140:`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，於〔公務員〕依法執行〔職務〕時，基於侮辱公務員之犯意，當場以「〔言詞〕」辱罵〔公務員〕。`,"150-1b":`{N}因〔糾紛緣由〕，與〔共犯（含真實姓名年籍不詳之成年人）〕於民國〔　〕年〔　〕月〔　〕日〔　〕時許，{兇器}在〔地點〕之〔公共場所／公眾得出入之場所〕聚集三人以上，〔由{N}首謀糾集，〕共同基於下手實施強暴之犯意聯絡，由{N}〔持〔兇器〕毆打〔對象〕／砸毀〔財物〕〕，以此方式施強暴{危險}，致在場及往來之公眾心生恐懼不安，妨害社會安寧秩序。`,"150-1a":`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，受〔邀集者〕邀集前往〔地點〕之〔公共場所／公眾得出入之場所〕，{兇器認識}明知〔共犯〕等人聚集三人以上將對〔對象〕施強暴，仍基於在場助勢之犯意，在現場以〔吶喊叫囂／圍繞包圍／以人數優勢助長聲勢〕之方式在場助勢，〔共犯〕等人則以〔手段〕施強暴{危險}，致在場及往來之公眾心生恐懼不安，妨害社會安寧秩序。`,305:`{N}基於恐嚇危害安全之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以「〔恐嚇內容〕」等語，以加害〔生命／身體／自由／名譽／財產〕之事恫嚇〔被害人〕，致〔被害人〕心生畏懼，致生危害於安全。`,304:`{N}基於強制之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以〔強暴／脅迫手段〕，使〔被害人〕〔行無義務之事／妨害其行使權利之內容〕。`,302:`{N}基於剝奪他人行動自由之犯意，自民國〔　〕年〔　〕月〔　〕日〔　〕時許起，在〔地點〕，以〔手段〕剝奪〔被害人〕之行動自由，至同日〔　〕時許〔被害人〕始〔離去／經救出〕止。`,306:`{N}基於侵入住宅之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，無故〔進入方式〕進入〔被害人〕位於〔地址〕之住宅。`,"309-1":`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔不特定多數人得以共見共聞之地點〕，基於公然侮辱之犯意，以「〔言詞〕」等語辱罵〔被害人〕，足以貶損〔被害人〕之名譽〔及社會評價〕。`,"310-2":`{N}意圖散布於眾，基於加重誹謗之犯意，於民國〔　〕年〔　〕月〔　〕日，在〔平臺／地點〕，以文字發表「〔內容〕」等不實言論，指摘足以毀損〔被害人〕名譽之事。`,335:`{N}受〔被害人〕委託〔保管／持有〕〔財物〕，竟意圖為自己不法之所有，基於侵占之犯意，於民國〔　〕年〔　〕月〔　〕日，將上開〔財物〕〔易持有為所有之具體行為〕而侵占入己。`,"336-2":`{N}自民國〔　〕年起任職〔公司〕，擔任〔職務〕，負責〔業務〕，為從事業務之人，竟意圖為自己不法之所有，基於業務侵占之犯意，於〔時間〕，將其業務上所持有之〔財物〕〔侵占方式〕侵占入己。`,337:`{N}於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕拾獲〔被害人〕所遺失之〔財物〕，竟意圖為自己不法之所有，基於侵占離本人所持有之物之犯意，將之侵占入己。`,342:`{N}受〔本人〕委任，為其處理〔事務內容〕，竟意圖為自己不法之利益，基於背信之犯意，於〔時間〕，〔違背任務之行為〕，致生損害於〔本人〕之財產〔新臺幣〔　〕元〕。`,346:`{N}意圖為自己不法之所有，基於恐嚇取財之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以「〔恐嚇內容〕」等語恫嚇〔被害人〕，致其心生畏懼，而交付新臺幣〔　〕元予{N}。`,349:`{N}明知〔物品〕係來源不明之贓物，仍基於〔收受／寄藏／故買〕贓物之犯意，於民國〔　〕年〔　〕月〔　〕日，在〔地點〕，以〔價格〕向〔對象〕〔收受／買受〕該物。`,354:`{N}基於毀損他人物品之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以〔手段〕損壞〔被害人〕所有之〔物品〕，致令〔損壞情形〕而不堪用，足以生損害於〔被害人〕。`,210:`{N}基於行使偽造私文書之犯意，未經〔名義人〕之同意或授權，於民國〔　〕年〔　〕月〔　〕日，在〔地點〕，於〔文書名稱〕上偽簽〔名義人〕之署名〔　〕枚〔、偽蓋印文〕，而偽造表示〔意思內容〕之私文書，並持以交付〔對象〕而行使之，足以生損害於〔名義人及對象〕。`,211:`{N}基於行使偽造公文書之犯意，於民國〔　〕年〔　〕月〔　〕日，以〔方法〕偽造〔公文書名稱〕，並持以〔行使方式〕，足以生損害於〔機關〕〔之公信力〕及〔對象〕。`,212:`{N}基於行使偽造特種文書之犯意，於民國〔　〕年〔　〕月〔　〕日，以〔方法〕偽造〔證書名稱〕，並持以〔行使方式〕，足以生損害於〔　〕。`,214:`{N}明知〔不實事項〕，仍基於使公務員登載不實之犯意，於民國〔　〕年〔　〕月〔　〕日，向〔機關〕申報〔事項〕，使不知情之承辦公務員將該不實事項登載於職務上所掌之〔公文書〕，足以生損害於〔　〕。`,168:`{N}於民國〔　〕年〔　〕月〔　〕日，在〔法院／檢察署〕審理〔案號〕案件〔審判／偵查〕時，以證人身分供前具結後，就〔案情有重要關係之事項〕，虛偽證稱「〔內容〕」。`,169:`{N}明知〔被誣告人〕並無〔被指犯行〕，竟意圖使〔被誣告人〕受刑事處分，基於誣告之犯意，於民國〔　〕年〔　〕月〔　〕日，向〔機關〕〔具狀／言詞〕申告〔虛構內容〕，誣指〔被誣告人〕涉犯〔罪名〕。`,221:`{N}與〔代號A女（真實姓名年籍詳卷）〕為〔關係〕，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點（避免足資識別被害人身分之資訊）〕，基於強制性交之犯意，以〔強暴、脅迫或其他違反意願之具體方法〕，違反A女之意願，以〔性交方式〕對A女為性交1次得逞。`,224:`{N}基於強制猥褻之犯意，於民國〔　〕年〔　〕月〔　〕日〔　〕時許，在〔地點〕，以〔強暴、脅迫或其他違反意願之具體方法〕，違反〔代號A女（真實姓名年籍詳卷）〕之意願，〔猥褻行為內容〕，對A女為猥褻行為1次得逞。`,"227-1":`{N}明知〔代號A女（民國〔　〕年生，真實姓名年籍詳卷）〕係未滿14歲之女子，竟 或傷害罪。`],[/^332-2$/,`強盜而強制性交為結合犯，係刑法第222條之特別規定，應優先適用。`],[/^藥83/,`被告轉讓〔甲基安非他命〕之行為，同時該當毒品危害防制條例第8條第2項之轉讓第二級毒品罪及藥事法第83條第1項之轉讓禁藥罪，屬法條競合，依重法優於輕法原則，優先適用藥事法第83條第1項（轉讓淨重10公克以上或成年人對未成年人轉讓，而依毒品條例加重後較重者除外）。`],[/^24[01]-1$/,`略（和）誘罪為繼續犯，至被誘人回復自由時止，應論以單純一罪。`],[/^305$/,`被告〔於密切接近之時間、地點接續口出恫嚇言詞〕，侵害同一法益，應視為數個舉動之接續施行，論以接續犯一罪；以一恐嚇行為致〔2〕名被害人心生畏懼者，為同種想像競合犯。`],[/^(309|310)/,`被告以一〔公然侮辱／誹謗〕行為，同時侵害〔2〕名告訴人之名譽，為一行為觸犯數罪名之同種想像競合犯，應從一重處斷。`]],oe={jiexu:`被告先後〔數行為〕，係於密切接近之時間、在同一地點，基於單一犯意為之，侵害同一法益，各行為之獨立性極為薄弱，依一般社會健全觀念，在時間差距上難以強行分開，在刑法評價上以視為數個舉動之接續施行，合為包括之一行為予以評價較為合理，為接續犯，應論以一罪。`,jixu:`被告〔行為〕自民國〔　〕年〔　〕月〔　〕日起至〔　〕日止，其行為並未間斷，具有行為繼續之性質，為繼續犯，應論以單純一罪。`,jihe:`被告自民國〔　〕年〔　〕月〔　〕日起至〔　〕日止，多次〔行為〕，係基於同一犯意，於密接時間反覆實行，本質上具反覆、延續實行之特徵，為集合犯，應論以一罪。`,same:`被告以一〔提供帳戶〕行為，幫助〔詐欺集團成員〕詐騙〔數名被害人〕，侵害數個財產法益，為同種想像競合犯，應依刑法第55條規定從一重處斷。`},B={e1591:`證人〔姓名〕於偵查中向檢察官所為之陳述，係依法具結後所為（〔卷頁〕），被告及辯護人未釋明有何顯不可信之情況，自形式上亦查無違法取供之情事，且證人已於本院審理時到庭接受交互詰問，依刑事訴訟法第159條之1第2項規定，有證據能力。`,e1592y:`證人〔姓名〕於警詢之陳述，與其於本院審理時之證述，就〔不符之處〕有所不符。本院審酌其警詢陳述距案發時間較近，記憶較為清晰，係以一問一答方式製作，查無遭不正取供或與被告串證之情形，所受外界干擾較少，外部附隨環境足認具有較可信之特別情況，且為證明犯罪事實存否所必要，依刑事訴訟法第159條之2規定，有證據能力。`,e1592n:`證人〔姓名〕於警詢之陳述，係被告以外之人於審判外之陳述，其內容與審理中經具結之證述大致相符，無刑事訴訟法第159條之2至第159條之4所定得為證據之例外情形，被告及辯護人復爭執其證據能力，依同法第159條第1項規定，不得作為證據。`,e1593:`證人〔姓名〕於審判中〔已死亡／滯留國外或所在不明而無法傳喚（經查無在監在押紀錄並經拘提無著）〕，其於警詢之陳述係以一問一答、全程錄音方式製作（〔卷頁〕），經本院審酌製作之原因、過程及功能，客觀上具有可信之特別情況，且為證明犯罪事實所必要，依刑事訴訟法第159條之3第〔1／3〕款規定，有證據能力。`,e1594:`卷附〔帳戶交易明細／診斷證明書〕，係〔金融機構／醫師〕於通常業務過程依例行程序製作之紀錄文書、證明文書，並無預見日後將供作證據之虛偽動機，亦無顯不可信之情況，依刑事訴訟法第159條之4第2款規定，得為證據。`,eWire:`本案通訊監察係依本院〔　〕年度聲監字第〔　〕號通訊監察書實施（〔卷頁〕），合法取得之監聽錄音以機械方式錄存，其譯文為錄音內容之顯示；被告及辯護人對譯文之真實性並不爭執，本院並已於審理時提示譯文並告以要旨，自得為證據。（被告爭執譯文真實性者，應當庭勘驗錄音，並記載勘驗結果。）`,eExpert:`〔鑑定機關〕出具之〔鑑定書〕，係檢察官依刑事訴訟法第208條第1項〔囑託／概括囑託〕鑑定機關所為之書面報告，屬同法第206條第1項之鑑定報告，符合同法第159條第1項所稱「法律有規定」之傳聞例外，得為證據。`,eConf:`被告雖辯稱其〔警詢／偵查〕中之自白係出於〔不正方法〕，惟本院審酌〔訊問之時間、場所、在場之人、辯護人陪同情形及勘驗錄音錄影之結果〕，其自白與所指不正方法間並無因果關係，係出於自由意志，依刑事訴訟法第156條第1項規定，得為證據。`,eRec:`〔姓名〕於與被告交談時自行錄音，係通訊之一方所為，且非出於不法目的，依通訊保障及監察法第29條第3款規定不罰，非屬違法取得之證據；經本院勘驗錄音內容與譯文相符（〔卷頁〕），得為證據。`,eConvert:`〔員警職務報告／道路交通事故現場圖〕雖屬傳聞證據，惟製作之員警〔姓名〕業於本院審理時以證人身分具結作證，並經被告及辯護人行使詰問權，已轉換為證人之當庭陳述，得為證據。`,eNon:`卷附〔現場照片、監視器錄影擷取畫面、通聯紀錄〕，係以機械方式留存之影像或紀錄，非屬供述證據，無傳聞法則之適用，復無證據證明係公務員違背法定程序所取得，得為證據。`},se={flip:`被告雖辯稱〔辯解〕，惟其於〔警詢及偵查〕中自陳〔內容〕（〔卷頁〕），核與證人〔姓名〕證述〔內容〕相符（〔卷頁〕），並有〔物證〕可佐，足見被告嗣後翻異前詞，所辯不足採信。`,witness:`證人即告訴人〔姓名〕於警詢、偵查及本院審理時均證稱〔內容〕（〔卷頁〕），前後一致，核與證人〔姓名〕所證〔內容〕相符，並有〔書證〕可稽（〔卷頁〕），足認其證述非虛。`,minor:`證人〔姓名〕、〔姓名〕就〔細節〕之證述固略有出入，惟關於〔基本情節〕均相一致；衡以〔案發迄今時隔已久、二人對事件之關注程度不同〕，尚難以細節之些微差異，即遽認其證述全部不可採。`,accomplice:`證人即共犯〔姓名〕固證稱〔有利被告之內容〕，惟核與〔已認定之事實及其他證據〕不符，且其所述涉及自身罪責，不無避重就輕之可能，尚難執為有利被告之認定。`,recant:`證人〔姓名〕雖於本院審理時改稱〔內容〕，惟依〔書證〕所示〔已認定之事實〕，參以其於偵查中具結證稱〔內容〕（〔卷頁〕），足認其審理中改稱之詞係事後迴護被告，難以採信。`,video:`本院當庭勘驗〔地點〕監視器錄影畫面，結果略為：〔勘驗結果〕（〔卷頁〕），核與證人〔姓名〕證述相符，被告所辯〔　〕，與客觀事證不符。`,wire:`被告持用門號〔　〕於〔日期時間〕與證人〔姓名〕之通訊監察譯文，內容為「〔　〕」（〔卷頁〕），被告亦坦承為雙方通話，對照證人〔姓名〕證述〔　〕，足認〔待證事實〕。`,expert:`扣案〔物證〕經送〔機關〕鑑定，結果為〔　〕，有〔鑑定書〕在卷可稽（〔卷頁〕）；被告所辯〔　〕，與鑑定結果不符，不足採信。`,lie:`至卷附測謊鑑定報告，僅得作為判斷供述證據證明力之參酌，本院係依上開證據認定被告犯行，並非以測謊結果為據，附此敘明。`},ce={Ⅰ:1,Ⅱ:2,Ⅲ:3,Ⅳ:4,Ⅴ:5,Ⅵ:6,Ⅶ:7,Ⅷ:8},le={"①":1,"②":2,"③":3,"④":4,"⑤":5,"⑥":6,"⑦":7,"⑧":8,"⑨":9},V=`[0-9０-９一二三四五六七八九十百零〇]+`;function ue(e){for(var t=0;t<L.length;t++)if(L[t][0].test(e))return L[t][1];return null}function de(e){var t=a(String(e||``)).replace(/[§]/g,`第`).replace(/\s+/g,``);t=t.replace(/(第(\d+)條(?:之(\d+))?(?:(?!第\d+條)[^，,；;])*?)((?:、第\d+項[^、，,；;]*)+)/g,function(e,t,n,r,i){return t+i.replace(/、第(\d+)項/g,`、第`+n+`條`+(r?`之`+r:``)+`第$1項`)});for(var n=RegExp(`((?:中華民國)?刑法|刑(?=第|\\d)|[\\u4e00-\\u9fff]{2,14}?(?:法|條例))?(?:同法|同條例)?第?(`+V+`)條?(?:(?:之|-)(`+V+`))?條?(?:第(`+V+`)項|([ⅠⅡⅢⅣⅤⅥⅦⅧ]))?((?:第`+V+`款(?:、第`+V+`款)+|第`+V+`(?:、`+V+`)*款|[①②③④⑤⑥⑦⑧⑨]+))?(前段|中段|後段|但書)?`,`g`),r=[],i=`刑法`,s;s=n.exec(t);)if(!s[0]||!s[2])n.lastIndex++;else{if(s[1]){var c=ue(s[1]);if(c)i=c;else if(!/同/.test(s[1]))continue}var l=String(o(s[2])),u=s[3]?String(o(s[3])):``,d=s[4]?String(o(s[4])):s[5]?String(ce[s[5]]):``,f=[];s[6]&&(f=/^[①-⑨]/.test(s[6])?s[6].split(``).map(function(e){return le[e]}):(s[6].match(new RegExp(V,`g`))||[]).map(o)),r.push({law:i,art:l,sub:u,item:d,kuan:f,seg:s[7]||``,raw:s[0]})}return r}var fe={"刑法 i>沒收：未扣案物應諭知追徵、違禁物不追徵、第一二級毒品沒收銷燬而第三四級毒品沒收、法人不得易服勞役</li><li>事實欄「明知」與理由不確定故意矛盾；退併辦不得為不另為無罪；變更起訴法條與犯罪事實減縮混淆；簡易判決不另為無罪；主文不得記載「不另為無罪」</li><li>易刑條件不同時，得僅就易刑條件相同部分定應執行刑（「前開有期徒刑得易科罰金部分，應執行…」）；「共同幫助」「共同教唆」；刑期口語化（「○個月」「拘役○天」）</li></ul><h4>事實欄記載（最高法院指摘／高等法院寫法，2026-09）</h4><ul><li>僅於有罪判決且能辨識「事實」段時執行；以「係犯」句所引法條判斷罪名，檢查事實欄（含所引附表）是否載明各罪構成要件事實</li><li>主觀要件：財產犯罪之不法所有意圖、偽造有價證券「意圖供行使之用」、販毒「營利」／「意圖販賣」、殺人犯意、幫助故意（含不確定故意）與正犯陷於錯誤</li><li>共同正犯：犯意聯絡（及行為分擔）；「共謀」而無行為分擔之說明</li><li>詐欺：詐術內容、被害人陷於錯誤、交付財物；加重詐欺「三人以上」；參與犯罪組織（加入時間、組織性質、角色）；洗錢之掩飾隱匿／金流斷點</li><li>偽造文書「足生損害」、強盜致使不能抗拒、恐嚇心生畏懼、§321兇器之客觀危險性、侵占之持有關係、背信之為他人處理事務</li><li>過失：應注意、能注意而不注意（無不能注意情事）；加重結果犯之能預見；§185-3濃度（毫克）、§185-4駕駛動力交通工具發生事故致人傷亡而逃逸；§227明知年齡、兒少法§112成年人</li><li>通則：犯罪時間（無法確定時至少記載期間）、數罪應分別記載各次事實或以附表逐項載明、事實認定不確定故意而理由稱直接故意之矛盾、未遂原因</li><li>撰稿綱要：提供帳戶幫助詐欺洗錢專用事實句型；車手涉偽造工作證／收據時併列行使偽造私文書、特種文書及足生損害；有參與組織罪時於事實內載明加入集團及角色；§321兇器改採客觀危險性寫法；事實欄末附構成要件自我檢核清單</li></ul><h4>處斷刑</h4><ul><li>依主文罪名對應法定刑表，自理由辨識加重、減輕事由，計算處斷刑並比對宣告刑（上下限、刑種、單科或併科罰金、罰金上限、應併科罰金）</li><li>分則加重（兒少法§112Ⅰ故意對兒少、§134、毒品§9、詐欺條例§44）後不得易科罰金（104台非159）；得易科者應諭知</li><li>處斷刑計算依簡報②（宋松璟，2024.7.19）重構：適用順序＝分則加重→總則加重→無免除之減輕（½）→有免除之減輕（⅔，§71Ⅱ先依較少之數）→§59→112憲判13→§55但書封鎖（第113張）</li><li>有期徒刑：加重最高度遞乘1.5（⅓者4/3），以20年為限；最低度逾原最低度即可，實務加1月，遞加仍僅加1月（第53–57、125張；111台非21、109台非159、111台上1439、115台上1167）；惟86台非11認遞加後判原下限加1月仍違法（臺中高分院112原上訴20據此採每一加重事由各加1月），見解未統一，宣告刑落於兩說之間者列「注意」並顯示另說最低度；詐欺條例§44Ⅱ、刑法§286Ⅲ最高最低度同加½。減輕最高度未滿原最高度（實務減1月），最低度遞乘½或⅓（遞減非通減），不滿1日不算（§72）；死刑→無期、無期→15年以上20年以下（§64、§65）</li><li>§59：以減輕後之最低度處斷刑為準，宣告刑須低於之，下限為其½（第74–81張；例：販二累犯＋§17Ⅱ＋§59＝1年9月7日以上，100台非226；§196累犯未遂＋§59＝10月至1年6月）</li><li>拘役：無加重59日；加重½為88日、⅓為78日、遞加以120日為限；減輕後58日以下（第42、62張）。罰金：1,000元以上以百元計，加重最低度1,100元、最高度乘1.5（第43、58張）</li><li>處斷刑同時顯示整月區間與精算值（如「1年10月以上〔精算：最低1年9月7日〕」）；宣告刑低於精算下限者為錯誤，含累犯加重而仍處原法定最低度（如竊盜累犯處2月）</li><li>加減事由辨識：加重至½（刑§47、134、150Ⅱ、272、280、303、313Ⅱ、318-2、361；毒品§8Ⅵ、9、15Ⅰ後；槍砲§16；貪污§7、16Ⅰ；兒少法§112Ⅰ；道交§86Ⅰ；銀行法§125-2Ⅱ；森林法§51Ⅲ）、加重至⅓（刑§116；槍砲§18Ⅳ後；野保§41Ⅱ、42Ⅱ）；減輕½（刑§16但、18ⅡⅢ、19Ⅱ、20、25Ⅱ、30Ⅱ、31Ⅰ但、62、162Ⅴ、244、347Ⅴ；毒品§17Ⅱ；貪污§8Ⅱ前、12；槍砲§8Ⅵ；洗錢自白；組織§8後段）、減輕或免除⅔（刑§23但、24但、27、154Ⅱ、166、172、185-4Ⅱ、227-1；毒品§17Ⅰ；貪污§8Ⅰ、8Ⅱ但、11Ⅴ；槍砲§18；組織§3Ⅰ但、8前段；詐欺條例§46、47後段；洗錢§23Ⅱ、Ⅲ後段）（第49–50張）</li><li>想像競合輕罪之§150Ⅱ相對加重，不得作為重罪之加重事由而先加後減（112台上4355）</li><li>§59酌減後宣告刑須低於酌減前最低度刑；最輕本刑為拘役或罰金者不得§59；§59酌減與量刑稱危害重大矛盾</li><li>拘役無加重上限59日、單一加重88日、減輕後58日；有期徒刑逾15年須有加重事由</li><li>累犯須檢察官主張舉證（110台上大5660）、勿寫「加重至二分之一」、死刑無期不加重；先加後減、遞減之說明；過失犯不審酌動機目的</li></ul><h4>詐欺犯罪與刑法第59條（判決研究，2026-09）</h4><ul><li>酌減理由僅見坦承、和解、初犯、經濟困難、年輕、車手收水等§57因子，未見個人特殊情狀或損害輕微且全額填補（112台上4847、115台上608）</li><li>別有詐欺條例§47、組織條例§8、洗錢自白、§30Ⅱ等法定減輕事由，未以遞減後最低度刑為判斷基準（114台上6067、115台上391）</li><li>以和解賠償為由酌減而未量化金額（114台上6067）；另有多件詐欺案件仍酌減（114上訴2649）</li><li>否准時僅以打擊詐欺集團必要性為由（111台上2668）；否准時未以遞減後最低度刑比較（115台上391）</li><li>撰稿綱要：勾選「酌減§59」且罪名為詐欺者，套用准許句型；「§59請求不准」可選一般否准或另有多案否准句型</li></ul><h4>妨害秩序（刑法§150）專題檢核（使用者提供之判決研究三份，2026-10）</h4><ul><li>主文：罪名贅列「共同」（79台上4231）；論以攜帶兇器或致生危險之加重罪名而未引第2項第1款、第2款（112台上3807）</li><li>論罪法條：在場助勢應引第1項前段、首謀及下手實施應引後段；第2項應標款次，並併引第1項前段或後段（臺中高分院111上訴2456）；引第2項第1款或第2款而罪名未載加重情狀</li><li>事實欄：公共場所／公眾得出入之場所及其與主文是否一致（114台上277）、聚集三人以上、施強暴脅迫之具體行為（含對物，臺高院110上訴3307）、各人參與型態、對公眾或他人之危害恐懼不安（外溢作用，110台上6191）；§150Ⅱ①須載「意圖供行使之用」及兇器、§150Ⅱ②須載具體危險狀態（112台上3807）；以「犯意聯絡」連結不同角色（113台上1727）；下手實施、在場助勢以在場為必要（113台上2353）</li><li>主觀：聚眾騷亂之共同意思不以起於聚集之初為必要（110台上6191）；偶發衝突之界限（臺高院110上易393）</li><li>共同正犯：首謀、下手實施、在場助勢之間不成立共同正犯，同一型態間始依§28論處（111台上3231、111台上4664、111台上4926、113台上1727）</li><li>在場助勢：須有具體助勢言行或以人數優勢助長聲勢（115台上1739撤銷發回）；單純在場、同車未下車不得擴張歸責（113台上2353）；「勸架、路過」抗辯之間接事實鏈（到場緣由、同行、在場認識、去留、供述矛盾；臺中高分院111上訴2456）；起訴下手實施改論在場助勢應變更起訴法條（刑事訴訟法第95條、第300條）</li><li>§150Ⅱ①及於未持兇器者，須明知或可得而知同夥攜帶兇器而可相互利用（109台上2708、113台上1727、113台上662）；「得」加重須敘明裁量（112台上4355、臺中高分院111上訴2456）</li><li>競合：恐嚇、強制通常被吸收（臺中高分院112上訴347）；傷害、毀損通常想像競合；另行剝奪行動自由則分論併罰；同一聚眾縱對數人仍為一罪（臺中高分院111上訴2456）；兒少法§112須對少年年齡有認識</li><li>說明：110台上6191（個人騷亂意思之內容與時點）與113台上1727（角色間不須犯意聯絡）處理層次不同，並無實質矛盾；113台上2353對模糊在場者要求「犯意聯絡」，與1727用語存在張力，撰判時避免混用</li></ul><h4>量刑理由頁面（刑法第57條；最高法院見解，2026-10）</h4><ul><li>依§57十款分為犯罪情狀（第1、2、3、7、8、9款）與行為人屬性、犯後態度（第4、5、6、10款），可選一段式或分項式；§57對照表檢視各款是否已具體審酌</li><li>重複評價：構成要件事實不得再作從重理由，但手段、損害輕重屬§57第3、9款情狀（114台上5994、113台上4575、112台上4686）；累犯已加重者，品行不得再泛稱前科素行（113台上1057）</li><li>犯後態度：否認或緘默屬防禦權，不得作為量刑畸重之依據（109台上3084、112台上168、113台上300）；認罪時點得作為減讓幅度之考量（111台上4339、110台上5396）；自首減刑後仍得審酌自首後之坦承、協助偵查（112台上4951）</li><li>想像競合輕罪之減輕事由移列量刑因子（113台上4304、114台上4550、114台上5777、115台上2330）；輕罪應併科罰金而不併科者應敘明（111台上977）</li><li>科刑辯論與被害人意見（刑事訴訟法第289條第2項；110台上2774、112台上2660）；量刑資訊系統僅供參考（114台上419）</li><li>定應執行刑：外部性界限（§51）與內部性界限，審酌罪質、時間密接、責任非難重複程度、邊際效應遞減（113台抗150、113台抗1083、112台抗1886、113台上1134）；暫不定刑係旁論建議，無拘束力（112台抗1754）</li></ul><h4>新舊法比較／空白刑法整合（判決研究與「近年刑事法律修正之新舊法比較」，2026-10）</h4><ul><li>撰稿綱要：勾選「新舊法比較」（或引用刑法§2、洗錢罪）時，依所選罪名自動帶出對應句型與提示——槍砲條例（§7、§8繼續犯、§18、§4Ⅲ零件公告、§9-1）、竊盜§320／§321、加重詐欺§339-4Ⅰ④、洗錢（112.6.16、113.8.2）、組織犯罪（112.5.26）、家暴§61、不能安全駕駛§185-3、道交§86Ⅰ、兒少性剝削§36與民法§12成年年齡、性侵害防治法§50Ⅲ、監護處分§87、罰金換算（108.12.27）、妨害公務§135／§140、傷害§277Ⅰ、森林法、毒品條例109.7.15、集合犯／繼續犯跨越修法，並附新舊法通則八點；已指定比較結果者仍依原通用句型，另附提示。</li><li>毒品競合：論罪頁新增「新舊法／空白刑法」模組N0–N11（列級屬補充規範、行為後改列、依托咪酯三階段列級、列管前論藥事法、持有跨越改列、改列後沒收銷燬依裁判時法、量刑、刑法§16、電子煙油、109.7.15修正之§4／§17Ⅱ／§9Ⅲ）。</li><li>「詐洗＋沒收」頁內容未更動。部分見解（依托咪酯列級公告字號與日期、§185-3高院114交上易23、性侵害防治法、N4、N7、N8）係依先前檢索摘要或理論推演，引用前請調閱原判決核對。</li></ul><h4>毒品專區：列級改列、販賣與藥事法、混合二種以上（23版新增）</h4><ul><li>列級改列：毒品之分級及品項屬填補空白刑法之補充規範，行為後改列僅屬事實變更，不生刑法第2條第1項新舊法比較，依行為時列級論罪（最高法院94台上771、97台上4022；臺南高分院115上訴1025）；沒收適用裁判時法（刑法§2Ⅱ）。依托咪酯：113.8.5列第三級、113.11.27改列第二級、115.6.25（院臺法字第1155013102號，115.6.27生效）改列第一級，美托咪酯、丙帕酯等併同改列</li><li>販賣與藥事法：販賣毒品之法定刑（§4Ⅱ無期徒刑或10年以上、§4Ⅲ7年以上）重於藥事法§83Ⅰ（7年以下），行為時已列管者依重法優於輕法論毒品條例；轉讓毒品（§8Ⅱ6月以上5年以下）輕於藥事法§83Ⅰ，應論藥事法並仍適用毒§17Ⅱ（109台上大4243）；列管前之行為僅論藥事法偽藥、禁藥（臺高院114上訴4755）</li><li>混合二種以上：毒§9Ⅲ「適用其中最高級別毒品之法定刑，並加重其刑至二分之一」，適用於§4至§8之罪；主文罪名載「…而混合二種以上之毒品罪」；最高級別以行為時列級判斷；無期徒刑不得加重（刑§65Ⅰ），有期徒刑最低度須逾原最低度、最高度以20年為限（§33Ⅲ）；先加後減；減輕後處斷刑上限為「未滿」原最高度（最高法院114台上3575：5年以上14年11月以下）；混合之故意僅須認知可能混合（臺高院115上訴1117）</li><li>§17Ⅰ供出來源：須與本案犯行具時序先後與事理因果，購毒在後、上游已先被查獲、非因被告供述而查獲者均不適用；共同被告間供述在後者無因果（臺高院114上訴6053、高雄高分院114上訴195）</li><li>檢核規則（242–249）：列級改列誤作新舊法比較、改列未說明依行為時列級、改列後沒收未說明裁判時法、販賣毒品誤論藥事法、轉讓毒品未說明重法優於輕法、混合未引§9Ⅲ或主文事實未載混合、混合加重未區分無期徒刑不得加重、事實欄多品項是否混合、行為日期對應列級；撰稿綱要新增「毒品列級（行為後改列）」「毒品§9Ⅲ混合二種以上」選項</li></ul><h4>詐欺犯罪危害防制條例§43、§44、§45與刑法§216論罪（高等法院見解，2026-10）</h4><ul><li>修法：§43、§44、§47於115年1月21日修正公布、同月23日生效。§43門檻改為100萬元（3–10年）、1,000萬元（5–12年）、1億元（7年以上）；修正前為「獲取」財物達500萬元（3–10年）、1億元（5–12年）。§44Ⅰ增訂第3款；§47Ⅰ增設6個月內支付調（和）解全部金額之要件</li><li>§43是§339-4的特別規定，優先適用，不另論§339-4（臺高院114上訴4669、臺南高分院115上訴126）。金額屬客觀處罰條件，不以行為人認識為必要（臺南高分院115上訴126）；中途加入者，僅就其參與部分合計（臺高院115上訴541）</li><li>行為在115.1.23前：罪名記載「修正前詐欺犯罪危害防制條例第43條前段之三人以上共同詐欺取財且詐欺獲取之財物達500萬元罪」（臺高院115上訴909、115原上訴321）；未達500萬元者，不得依新法100萬元門檻論以§43（高雄高分院115上訴421）</li><li>§44Ⅰ屬分則加重之獨立罪名（最高度、最低度同加½），主文記載「犯詐欺犯罪危害防制條例第44條第1項第1款之三人以上共同以網際網路對公眾散布而犯詐欺取財罪」，毋庸再贅述加重（臺中高分院114金上訴2501、1322）；被告須認識同條項第1、3、4款之事實，不知者僅論§339-4Ⅰ②（臺中高分院115金上訴214）</li><li>§43與§44Ⅰ：構成要件部分重合，依想像競合從一重之§44Ⅰ處斷，並受§55但書封鎖（臺中高分院114金上訴2759）</li><li>§44Ⅲ：「發起、主持、指揮犯罪組織而犯三人以上共同以網際網路對公眾散布詐欺取財罪」，引「第44條第3項、第1項第1款」（臺南高分院114金上訴2577）；§44Ⅳ：詐欺犯罪非屬第一審應行合議審判之案件</li><li>§47新舊法：修正後增加要件，並改為「得減輕」，未較有利，行為在修正前者適用修正前§47前段。修正前所稱「犯罪所得」指被告個人實際所得，無所得者自白即可減輕（113台上大4096）</li><li>§45：法人之代表人、法人或自然人之代理人、受僱人或其他從業人員因執行業務犯詐欺犯罪者，除處罰行為人外，並對該法人或自然人科以各該條之罰金（兩罰）；法人或自然人為被害人或已盡監督責任者，不在此限；主文例：「甲股份有限公司因其受僱人執行業務犯詐欺犯罪危害防制條例第44條第1項第1款之罪，科罰金新臺幣○元。」</li><li>刑法§216：依所行使文書之性質連結§210–§215論罪，如「刑法第216條、第210條之行使偽造私文書罪」「第216條、第212條之行使偽造特種文書罪」「第216條、第213條之行使公務員登載不實公文書罪」「第216條、第214條之行使使公務員登載不實文書罪」「第216條、第215條之行使業務上登載不實文書罪」。偽造之低度行為為行使之高度行為所吸收；偽造印章、印文、署押為偽造文書之階段行為</li><li>檢核：詐欺條例新舊法比較、新法後仍引「修正前」、新法後§47仍以自動繳交為要件、§43門檻金額與行為時不符、§43未標段別、§43／§44與§339-4並論、§43與§44未說明想像競合、§216未說明吸收、僅記載「第216條之罪」</li><li>撰稿綱要：「加入罪名」選單新增「刑法§150Ⅱ 加重妨害秩序」七項（①／②／①②各配第1項前段或後段，及幫助犯），依高等法院主文寫法產生罪名（如「意圖供行使之用而攜帶兇器在公共場所聚集三人以上下手實施強暴，因而致生公眾或交通往來之危險罪」）與論罪法條（「刑法第150條第2項第1款、第1項後段」）；另於加重減輕事由新增「刑法§150Ⅱ 加重／不予加重」，分別產生加重或不加重之說理句型，處斷刑與易科罰金依選擇計算；縱不加重，罪名仍記載加重罪名（臺南高分院114上訴2642、臺高院114上訴3917、高雄高分院114上訴639、臺高院112上訴4946）</li><li>撰稿綱要：「加入罪名」選單新增「組合條文（依高等法院論罪方式）」，可一鍵帶入§216＋§210／§211／§212／§213／§214／§215、§43前段／中段／後段、§44Ⅰ各款、§44Ⅲ、§45；目前尚無高院就新法§43中段、§44Ⅰ③之論罪先例，句型係依條文擬定</li></ul><h4>詐欺條例§44Ⅰ主文與論罪欄撰擬、未遂、行為日、所知所犯（判決研究，2026-10）</h4><ul><li>主文：既遂且三人以上共同並冒用公務員名義者，載「犯詐欺犯罪危害防制條例第44條第1項第1款之三人以上共同冒用〔政府機關及〕公務員名義犯詐欺取財罪，處有期徒刑○」；多被害人分論併罰各罪分列（彰化地院114訴1823；臺中地院114審金訴83；基隆地院114金訴753；臺北地院114審訴3308）</li><li>論罪欄：依§44Ⅰ①論罪，並與洗錢、行使偽造公文書、參與組織等想像競合，從一重論§44Ⅰ①之罪（法定刑加重後為1年6月以上10年6月以下）；論罪欄僅列§44Ⅰ①，或併列刑法§339-4Ⅰ①②於同一罪名之前，皆屬同一罪名之表述（臺中地院114審金訴83、114審金訴1078；新北地院114金訴2652）</li><li>理由寫法兩說、結論相同：獨立罪名說（分則加重；士林地院114審訴2720；最高法院115台上408）與法條競合說（特別法優先；彰化地院114訴1823、臺中地院114審金訴786）；未見判決主張既遂且符合第1款時可不論§44</li><li>未遂不適用§44：§44Ⅰ之罪未處罰未遂犯，「犯§339-4Ⅰ②之罪」不包括未遂；應論§339-4Ⅱ、Ⅰ①②之未遂罪，不加重（最高法院115台上408——原判決對未遂犯適用§44，撤銷發回；新竹地院114金訴437；新北地院114金訴2652）。同案既遂論§44、未遂論§339-4，主文分列</li><li>想像競合從一重比較「法定刑」，未遂減輕不影響比較；誤以行使偽造文書為重罪者屬適用法則不當（最高法院115台非1、115台非51，均因無提起必要而駁回非常上訴）</li><li>行為日：113.8.2前之行為，§43、§44、§47均為行為時所無，不得溯及（最高法院114台上6745；臺灣高等法院臺南分院114金上訴2064）。§44Ⅰ與§47分別認定比較，不採整體比較（最高法院114台上6745）；115.1.23修正僅增§44Ⅰ③，未涉者§44Ⅰ無比較問題（桃園地院115審原訴88），§47修正後較不利者適用修正前§47前段</li><li>「修正前」是否冠於主文，地院做法不一：因§47而一體適用修正前者冠之（彰化地院114訴1823；臺中地院115審原金訴16；士林地院114審訴2720）；認§44Ⅰ無影響而逕適用現行法者不冠（臺中地院114審金訴1453）。請依理由所採比較方法前後一致</li><li>加減順序：先依§44Ⅰ、Ⅱ加重，再依§47減輕，依刑法§71Ⅰ先加後減；累犯加重與§44遞加（臺中地院114審金訴786、114審金訴83；最高法院114台上6745）。§44之加重非釋字第775號解釋之範圍；情輕法重以刑法§59酌減處理，屬事實審裁量（最高法院114台上5642）</li><li>所知所犯：車手、取簿手無證據證明知悉冒用公務員名義，不論§44Ⅰ①，僅論§339-4Ⅰ②（桃園地院114審訴2993、115審訴1124；嘉義地院114金訴812、114金訴1265）；是否另行變更起訴法條，桃園地院載明變更，嘉義地院認僅屬加重條件毋庸變更。明知者論§44Ⅰ①（臺北地院114審訴3308）</li><li>起訴法條未載§44者，依刑事訴訟法§300變更起訴法條並告知（新北地院114金訴2652；臺中地院115審原金訴16；基隆地院114金訴753）</li><li>輕罪（洗錢）罰金：有「併科罰金」（臺中地院114審金訴83）與「有期徒刑已足收儆戒，不併科」（彰化地院114訴1823；新北地院114金訴2652）二種做法</li><li>樣本說明：以上為地方法院為主；最高法院僅115台上408、114台上6745（皆撤銷發回，專論§44之未遂與新舊法）可作為第三審依據，餘為地院個別見解；未見高院既遂§44主文專論之判決</li><li>檢核：論罪欄論§44主文未載（及反向）、§44與未遂並載、行為日在113.8.2前仍適用§43／§44／§47、§44與§47採整體比較、公訴意旨未載§44而論§44未見變更起訴法條、論§44Ⅰ①未見被告對冒用公務員名義之認識</li><li>撰稿綱要：§44Ⅰ①之主文與論罪欄句型、法條關係二說、加減順序、未遂、新舊法、起訴法條與所知所犯，已列為說明列（選§339-4Ⅰ①②、§44Ⅰ①組合條文時出現）</li></ul><h4>詐欺車手收據／工作證沒收說理（判決研究，2026-09）</h4><ul><li>未扣案收據等文書不予沒收之標準說理應同時具備四要素：①紙張本身無價值、僅著重表彰之意義；②對罪責評價無影響；③相較開啟執行程序之公益資源不符比例；④欠缺刑法上重要性，並引刑法第38條之2第2項（113年度金上訴字第1500號、114年度金上訴字第548、549號）</li><li>偽造私文書全紙已沒收者，其上偽造印文無庸重複宣告沒收，以免重複宣告同一標的（113年度金上訴字第1500號附表編號4）</li><li>引詐欺犯罪危害防制條例§48沒收供犯罪所用之物，宜載明「不問屬於犯罪行為人與否」，以別於刑法§38Ⅱ以屬被告所有為限之裁量沒收</li><li>偽造印文宣告沒收，宜附帶敘明因科技進步無須先刻製印章即可電腦製作、套印，卷內復無印章存在跡證，乃無從沒收印章本身</li><li>撰稿綱要：新增「供犯罪所用之物（詐欺條例§48Ⅰ，扣案）」「全紙已沒收，毋庸重複宣告印文」「偽造印文電腦列印／套印，附此敘明印章無從沒收」「未扣案收據紙張無價值不予沒收（§38-2Ⅱ）」四項沒收句型可勾選套用</li></ul><h4>詐欺犯罪與緩刑／一般預防（判決研究，2026-09）</h4><ul><li>詐欺、洗錢案件之緩刑准否，實務以「一般預防（維護社會法秩序、避免助長僥倖心理）」與「特殊預防（悔意、賠償意願、再犯風險）」雙軌架構為論理主線，源自110台上2939，經114台上4770、113台上2300、114台上5717等反覆援用（三審穩定見解，非個別高院見解）</li><li>被告另有多件詐欺、洗錢案件偵審中或未獲賠償，仍宣告緩刑而理由未見一般預防／特殊預防說明者，宜補充論理</li><li>併引詐欺犯罪危害防制條例§43加重最低刑度並諭知緩刑者，應具體交代依§47、未遂、§59等遞減後宣告刑（或應執行刑）已降至2年以下</li><li>否准緩刑而理由未見一般預防／特殊預防架構用語者，可套用標準句型（撰稿：勾選「緩刑不宜」並選「詐欺（一般預防）」模板）</li></ul><h4>妨害名譽案件與緩刑／關係修復（判決研究，2026-09）</h4><ul><li>妨害名譽（§309、§310）案件緩刑准否，與詐欺犯罪著重一般預防不同，實務多以雙方有無和解、調解、道歉、獲得諒解等關係修復事證為主要考量</li><li>否准緩刑而理由未見和解、道歉、諒解等關係修復事證說明者，宜補充被告是否曾試圖與告訴人和解、道歉及告訴人態度（撰稿：勾選「緩刑不宜」並選「妨害名譽（關係修復）」模板）</li><li>宣告緩刑而理由僅具備§74Ⅰ形式要件、未見具體促成緩刑之個案事證者，宜補充和解、道歉或素行等說明</li></ul><h4>強制辯護與無效辯護（§31、§284、§379⑦；判決研究，2026-10）</h4><ul><li>強制辯護案件當事人欄未見辯護人；載有辯護人未到庭而審判而未見另行指定或查明（112台上4817、110台上2801／2802；非強制案件參112台上14）</li><li>論述無效辯護須分「行為瑕疵」與「結果不利」二階段，先審前者（114台上6552）；駁斥時宜交代辯護人實際作為；辯護策略受秘匿特權保護（108台上397、110台上2234至2236、112台上184、113台上5138、114台上5815）</li><li>被告稱因辯護人建議而陳述：宜依§163Ⅱ調查任意性（111台上1120，唯一以疑慮撤銷者）；同一辯護人辯護多被告須無利害相反且未影響實質辯護權（114台上5002）</li><li>辯護人遲誤上訴之回復原狀：10日內向原審法院聲請（§67；112台抗1679、115台上1577）；§379⑦限審判程序，與警詢偵訊辯護人在場有別（112台上2474）；§31款次於112.12.15修正</li><li>說明：本類規則為文字比對，僅提示；案件是否屬強制辯護、辯護人到庭情形須對照筆錄</li></ul><h4>法條引用</h4><ul><li>條號格式、論罪法條列入附錄、洗錢防制法新舊法、詐欺犯罪危害防制條例、§55／§47／§62／§25／§59／§28／§30對應</li><li>引用法律座談會或大法庭裁定案號；特別法論罪未引刑法第11條</li></ul><h4>必要記載（第一審）</h4><ul><li>當事人欄、主文／事實／理由、§310各款、證據能力、檢察官到庭、宣判日、署名、上訴教示；緩刑須載明§74Ⅰ何款</li></ul><h4>精簡與用語（多為提示）</h4><ul><li>主文記載累犯或扣案與否、主文大寫國字與阿拉伯數字混用；事實欄記載前科、案源、查獲經過、自首、法律上稱謂、「民國（下同）」</li><li>未爭執之證據能力、無罪判決或簡式簡易程序說明證據能力、理由贅述程序轉換</li><li>發語詞與贅詞、「伊」、「證人即被害人」重複、例稿式可信性用語、「○女」「○某」、施用毒品用語、「結證」「右揭」「據上論結」、量刑複誦§57條文、據上論斷僅需引程序法</li><li>通俗化用語彙整表（云云、詎、渠、洵屬、揆諸、矧…）、雙重否定、「矢口否認」、理由金額以國字記載；無罪判決之職權用語與結論類型、上訴教示註明檢察官得上訴</li><li>據上論斷先程序後實體、刑法分則有罰金刑應引刑法施行法第1條之1；起訴檢察官之記載；變更起訴法條時案由仍依起訴法條</li></ul><h4>非常上訴衍生規則</h4><ul><li>依40件非常上訴（更正、撤銷）判決整理之衍生檢核規則（219–241），涵蓋累犯認定（少年前科塗銷基準、假釋期間再犯、數罪併罰執行完畢）、定應執行刑（不利益變更禁止、一事不再理）、撤回告訴與告訴期間翌日起算、罪名修正之新舊法比較、證交法沒收未載除外規定、減刑事由（毒品§17、銀行法§125-4、112憲判13號）、前案緩刑未屆滿、被告未到庭在監在押紀錄、少年案件誤依通常程序、移送併辦漏未審理、事實逾起訴範圍、量刑理由與和解諒解事證矛盾等</li><li>多數項目屬「文字共現觸發、仍待人工確認」性質（標示【注意】【提示】），僅主文理由矛盾（累犯）、告訴期間當日起算、證交法沒收未載除外規定三項因文字樣式明確而標示【錯誤】；其餘請務必核對卷證後再據以修改</li></ul><h4>刑事擬判參考資料衍生規則（105.06版，已依現行法更新）</h4><ul><li>沒收新制（105.7.1）：主文「追繳」「以其財產抵償」、舊式「如全部或一部不能沒收時」、稱沒收為「從刑」、應執行刑後重複宣告沒收</li><li>已刪除或失效之制度：連續犯、牽連犯、概括犯意（95.7.1）、業務過失致死傷（108.5.29公布）、強制工作（釋字第812號）、減刑條例之「減為」；引用「判例」「刑事庭會議決議」（108.7.4大法庭制度）</li><li>證據能力：移送書、員警職務報告不得依§159-4取得證據能力；鑑定報告屬§159Ⅰ法律有規定；監聽譯文、照片監視器通聯為非供述或依合法監聽；§159-2、§159-3未說明特信性；測謊僅供參酌</li><li>罪數與法條競合（分則各章）：持有毒品為販賣施用所吸收、轉讓禁藥與轉讓毒品為法條競合、轉讓禁藥仍得依毒品§17Ⅱ減輕（109台上大4243）、恐嚇為妨害自由或強制之手段、強盜搶奪致傷、行使偽造有價證券不另論詐欺、結合犯、戶籍法／森林法／水保法／選罷法／妨害國幣條例之特別規定、擄人勒贖吸收妨害自由、同時持有槍彈想像競合、賭博與廢清法集合犯</li><li>加重減輕：§185-3Ⅱ不得再依道交§86加重；兒少法§112但書（§227、§233、§240、§241、§341、兒少性剝削條例、毒品§9）；一般案件§59酌減僅見量刑因子</li><li>當事人欄與案由：家庭暴力罪之案由、住居所記載里鄰、通常改簡易及簡易改通常之案由敘述</li><li>擬判參考資料為105年版，所載新舊法比較結論（103–105年修法）、判例用語、地方法院檢察署名稱、當事人欄記載年齡、主文記載累犯、沒收舊制等，均已依現行法及本工具其他來源修正，不照單全收</li></ul><h4>115年刑事審判實務研討會衍生規則（研習①–④）</h4><ul><li>主文與刑度：簡易判決宣告逾6月有期徒刑未宣告緩刑（§449Ⅲ；114台非119）；緩刑負擔金額委由檢察官指定（錯誤）、期限或方式委由檢察官指定（注意）（114台非156）；主文諭知累犯而理由無說明、主文沒收之物理由另稱不予沒收（類型七）；理由認應無罪（免訴、不受理）而主文漏未諭知、補充判決僅援引原判決（115台上141、112台上2363）；數罪罰金定應執行之勞役折算應從期限較長者且逾1年應比例折算（§42Ⅳ、Ⅴ；112台非98）；少年不得褫奪公權；港澳居民驅逐出境；強制治療未經鑑定</li><li>處斷刑：少年時期觸法紀錄作為不利量刑或累犯（109台非90）；累犯前案易服社會勞動之執畢日（112台非10）；§150Ⅱ相對加重未說明裁量（112台上4355）；詐欺條例§44誤寫「加重其刑至二分之一」</li><li>審判範圍與程序（新分類）：變更起訴法條、罪數由一罪改數罪、單獨改共同正犯、起訴效力擴張事實之告知（110台非230、107台上1860、115台上270、113台上1979）；補充理由書擴張起訴事實（110台上4204）；更正起訴事實之界限（110台非82、113台上4416）；起訴部分無罪而併審併辦部分（114台非155）；依職權調查前之陳述意見與曉諭義務（111台上3936、111台上5593）；公眾週知事實（114台上2408）；未選任辯護人之傳聞同意（111台上4224）；毒品§17Ⅰ、§19等應依職權調查事項；被告不到庭逕行判決之生存確認、提供帳戶類同一案件之確認；沒收第三人財產未見參與程序（108台上大3594）</li><li>沒收：沒收為新舊法比較（§2Ⅱ）；不能安全駕駛之車輛（關聯客體）與過失犯工具之沒收（106台上1374、114台上2572）；和解未全數履行即全部不沒收（107台上4651）；賄款退還行賄者（107台上4009）；過苛條款混入量刑因子（109台上418）；估算未說明顯有困難（108台上559）；擴大利得沒收僅以無法說明來源為據（113憲判1）；法人被告依犯罪行為人規定沒收（107台上2049）；共同沒收或各共犯全額重複沒收（107台上2989）；事實欄記載扣案物；無罪判決之單獨宣告沒收（110台上3580）；違禁物僅因未扣案不沒收</li><li>既有規則補充出處：有期徒刑逾15年（112台非106）、明知與不確定故意（106台上3462）、義務勞務時數（101台非285）、第5至8款負擔付保護管束（109台上5564）；另否認案件爭點證據宜註明卷頁</li></ul><h4>強制戒治／觀察勒戒（判決研究，2026-10）</h4><ul><li>判決主文諭知觀察勒戒、強制戒治（錯誤）：係檢察官聲請、法院裁定事項（毒品條例§20Ⅰ、Ⅱ）</li><li>施用毒品論罪，理由未交代觀察勒戒／強制戒治前置程序（注意）：3年內再犯§23Ⅱ、3年後再犯§20Ⅲ；三年期間自執行完畢釋放日起算（提示）</li><li>聲請強制戒治案件之裁定檢核（評分核對、陳述意見、時程、救濟教示）請切換至上方「裁定檢核」模式</li></ul><h4>撰稿綱要（另一模式）</h4><ul><li>輸入論罪法條（可含§25、§28、§30、§47、§59、§62、兒少法§112、毒品§17、詐欺條例§44／§47等加減事由條文，會自動辨識），並勾選程序、參與形態、罪數、緩刑、沒收等要素</li><li>依上列檢核規則產生：當事人欄、案由（章名／違反○○法）、新式主文（易科罰金與併科罰金依法定刑自動判斷）、構成要件事實句型、理由各段、據上論斷、上訴教示、附錄法條全文</li><li>可選主文數字（阿拉伯數字／大寫國字）、沒收在主文之位置（另起一行／接續主刑／分項）、移送併辦（審判效力所及／退併辦）、前科僅供量刑、道交條例§86分則加重；否認案件附駁回調查證據聲請段落</li><li>加重減輕事由逐項選擇「減輕」或「不減」：累犯（加重／構成累犯但不加重）、自首、§59（酌減／兩種否准句型）、未遂、幫助犯、毒品§17Ⅰ與Ⅱ、詐欺條例§47前後段、洗錢§23Ⅲ、組織條例§8；選「不減」會產生不予減輕之說明句型，且不計入處斷刑</li><li>擬判參考資料整合：無罪判決綱要、程序轉換案由（簡易改通常、簡易→通常→簡式）、證據能力11種爭執類型例稿、否認案件9種論證模組、各罪罪數吸收與法條競合句型、接續犯／繼續犯／集合犯／同種想像競合、新舊法比較三種結論、§18Ⅱ、§19Ⅱ、§31Ⅰ、車禍自首、第三人沒收與不沒收說明、不另為免訴或不受理；新增放火、妨害公眾往來安全、略誘和誘、遺棄、準強盜與強盜結合犯、重利、擄人勒贖、干擾電腦、戶籍法、商業會計法、走私、製造販賣槍彈、貪污收賄、選罷法賄選、森林法、水保法、妨害國幣等罪名之法定刑、主文、事實句型及附錄條文</li><li>研習①–④整合：緩刑支付負擔改為主文具體諭知金額、期限及分期方式；「撰寫提醒」固定列出宣判前確認事項（被告生存、同一案件、累犯執畢日、簡易刑度、告知義務、告訴與時效、緩刑負擔、保安處分對象、§50但書、最低度刑）；累犯、前科、變更起訴法條、移送併辦、不另為無罪、否認案件、未選任辯護人之傳聞同意等段落加入對應提示；新增§150Ⅱ相對加重句型、共犯犯罪所得平均分擔沒收選項、和解部分履行之沒收句型、無罪判決單獨宣告沒收（違禁物、毒品、偽造印文署押）；工具沒收與不能安全駕駛、簡易程序、少年褫奪公權之錯誤提醒</li><li>多數被告：於「被告」區新增或複製被告，各被告分別設定姓名、論罪法條、判決類型（有罪／無罪）、參與形態、加減事由、緩刑、褫奪公權與沒收（標示「個別」者），法院、程序、證據能力等全案共用；產生時依被告分項合併主文、事實與理由（相同部分合併、相異部分以「被告〇〇部分」分項），有罪與無罪併存者理由另立「無罪部分」，據上論斷及附錄法條合併去重，處斷刑依被告分列</li><li>沒收生成器整合：撰稿綱要表單新增「詐欺洗錢扣案物沒收明細」（逐被告保存）。逐項登錄扣案物（手機、工作證、收據、印章、現金、帳戶、虛擬貨幣契約、交通工具等15類）與處理方式，另填洗錢標的、犯罪所得，啟用後主文沒收項、理由「沒收」各段（適用法律、供犯罪所用之物、現金及洗錢財物、犯罪所得、其餘扣案物）、扣案物明細表（數罪時附表一為各罪主文、附表二為明細）及據上論斷法條均由其產生，句型取材自新北地院33件、高等法院43件（114–115年）判決，並於「撰寫提醒」附引用判決索引；多數被告時各被告之附表分列合併。</li><li>「詐洗＋沒收」頁：新舊法比較例稿與扣案物沒收生成器合為一頁，被告姓名、被害人金額、犯罪所得、角色、罪數於兩者連動；另可切換為「完整判決綱要」（撰稿綱要引擎，限詐欺＋洗錢） 罪，於有該條所定加重事由時予以加重處罰，已成為另一獨立之罪名，屬刑法分則加重之性質，為被告行為時所無之處罰，依刑法第1條罪刑法定原則，無溯及既往適用之餘地，自無新舊法比較問題（最高法院113年度台上字第3358號判決意旨參照）。`,fz47indep:`至該條例第47條關於偵審自白減刑之規定，則係新增刑法所無之減輕刑責規定，與上開加重條件間並無適用上「依附及相互關聯」之特性，應依刑法第2條第1項從舊從輕原則，分別認定並比較而適用最有利於行為人之法律，尚無割裂適用之疑義（同前揭判決意旨）。`,fz47old:`113年7月31日制定公布之同條例第47條前段規定：「犯詐欺犯罪，在偵查及歷次審判中均自白，如有犯罪所得，自動繳交其犯罪所得者，減輕其刑」`,fz47new:`115年1月21日修正後同條第1項規定：「犯詐欺犯罪，在偵查及歷次審判中均自白，並於檢察官偵查中首次自白之日起六個月內，支付與被害人達成調解或和解之全部金額者，得減輕其刑」`,fz47cmp:`修正後規定除增加於一定期間內支付調（和）解全部金額之要件外，並將「應減輕」改為「得減輕」，經比較結果，修正後規定並未較有利於被告，依刑法第2條第1項前段，應適用修正前即113年7月31日制定公布之同條例第47條前段規定。`,fz44T2:`同條例第44條第1項雖於115年1月21日修正公布、同年月23日施行，增訂第3款「教唆、幫助或利用未滿十八歲、滿八十歲或非本國籍人士犯罪或與之共同實施犯罪」之加重事由，惟同項第1款、第2款及同條第2項規定均未修正，本件亦無第3款所定情形，自毋庸就第44條部分為新舊法比較。`,fz44noAttempt:`又同條例第44條不處罰未遂犯，本件為未遂，無該條加重規定之適用（臺灣高等法院113年度上訴字第6590號判決意旨參照）。`,fz43old:`修正前第43條規定：「犯刑法第三百三十九條之四之罪，詐欺獲取之財物或財產上利益達新臺幣五百萬元者，處三年以上十年以下有期徒刑，得併科新臺幣三千萬元以下罰金。因犯罪獲取之財物或財產上利益達新臺幣一億元者，處五年以上十二年以下有期徒刑，得併科新臺幣三億元以下罰金」`,fz43new:`修正後同條規定：「犯刑法第三百三十九條之四之罪，使人交付之財物或財產上利益達新臺幣一百萬元者，處三年以上十年以下有期徒刑，得併科新臺幣三千萬元以下罰金。使人交付之財物或財產上利益達新臺幣一千萬元者，處五年以上十二年以下有期徒刑，得併科新臺幣三億元以下罰金。使人交付之財物或財產上利益達新臺幣一億元者，處七年以上有期徒刑，得併科新臺幣五億元以下罰金」`,fz47rule:`按修正前詐欺犯罪危害防制條例第47條前段所稱「其犯罪所得」，係指行為人因犯罪而實際取得之個人所得；倘行為人未實際取得個人所得，僅須於偵查及歷次審判中均自白，即合於該條前段減輕其刑之要件（最高法院113年度台上大字第4096號裁定意旨參照）。`,minorRule:`想像競合犯之輕罪如有減輕其刑事由，雖因從一重處斷而無從逕以減輕重罪之法定刑，惟法院於量刑時仍應列為刑法第57條之有利因子（最高法院108年度台上字第4405號、第4408號判決意旨參照）。`,noFine:`刑法第55條但書之輕罪封鎖作用，固應結合輕罪法定最輕應併科之罰金刑；惟法院經整體評價，認所處重罪自由刑已較輕罪法定最輕徒刑及併科罰金為高，且足以充分評價行為之不法及罪責內涵者，得裁量不再併科輕罪之罰金刑（最高法院111年度台上字第977號判決意旨參照）。`,rel43imag:`修正前詐欺犯罪危害防制條例第43條前段重在詐欺結果之加重，第44條第1項第1款則重在詐欺手段之加重，二者構成要件部分重合而無包攝關係，被告同時該當，應依想像競合犯從一重處斷。比較法定刑結果，第44條第1項第1款（有期徒刑1年6月以上10年6月以下）重於第43條前段（有期徒刑3年以上10年以下），應從一重論以第44條第1項第1款之罪；惟依刑法第55條但書，不得科以較輕罪名所定最輕本刑即有期徒刑3年以下之刑（臺灣高等法院臺中分院114年度金上訴字第2759號判決意旨參照）。`,rel43norm:`被告所為同時該當詐欺犯罪危害防制條例第43條前段及第44條第1項第1款，二者係就同一加重詐欺行為之不同加重面向所為規定，屬法規競合，應擇一適用較重之第44條第1項第1款，為單純一罪，不受刑法第55條但書輕罪最輕本刑之拘束（臺灣高等法院115年度原上訴字第103號判決意旨參照）。`},ue={t:`T1`,pre0602:!1,role:`agg`,laundering:!0,org:!0,forgeP:!0,forgeS:!0,multi:!1,attempt:!1,comp1:!1,comp3:!1,d44_3:!1,amt:` 捕偵查→未遂`,x:`司法警察喬裝購毒者與被告聯繫交易，被告原即有販賣毒品之犯意，並已著手實施販賣行為，惟因喬裝購毒之員警自始無買受之真意，事實上不能真正完成買賣，僅能論以販賣毒品未遂罪。（臺中高分院112年度上訴字第634號、高雄高分院113年度上訴字第425號判決參照）`},{g:`fact`,id:`f-mfg`,t:`製造之定義〔固定〕`,x:`毒品危害防制條例第4條所稱「製造」，除將非屬毒品之原料化合而成毒品外，尚包括將原含有毒品成分之物，予以加工改製成適合施用之毒品。凡為製造之目的而對原料施以人為加工改製即屬之，不以原物料已發生化學變化為限。（高院113年度上訴字第2857號判決參照）`},{g:`fact`,id:`f-mfg-can`,t:`大麻栽種、乾燥→製造既遂`,x:`被告對大麻植株之花、葉、嫩莖，以人為方式摘取、清理後，再以風乾、陰乾等方式使之乾燥，已達於易於施用之程度，即屬製造第二級毒品既遂。（臺中高分院111年度上訴字第1455號、高院111年度上更一字第160號判決參照）`},{g:`fact`,id:`f-mfg-semi`,t:`半成品→製造既遂`,x:`被告以〔紅磷法〕製造甲基安非他命，產製過程中已產生含甲基安非他命成分之物，縱為半成品、富含雜質或純度不佳，因已處於隨時可供萃取使用之狀態，製造行為即已既遂。（臺南高分院111年度上訴字第208號判決參照）`},{g:`fact`,id:`f-mfg-oil`,t:`加熱稀釋大麻煙油→製造`,x:`被告將濃稠之大麻煙油加熱至液化，加入稀釋劑攪拌後分裝至空煙彈，已改變大麻煙油原有之狀態，使之達到易於施用之程度，核屬製造行為。（高院113年度上訴字第2857號判決參照）`},{g:`fact`,id:`f-mfg-mix`,t:`研磨混合調製咖啡包→製造`,x:`被告將〔○○〕研磨成粉，與〔○○〕粉末、果汁粉混合調製後分裝為毒品咖啡包，已將數種毒品混合而製成另一型態之毒品，屬製造行為。（高院110年度上訴字第3279號判決參照）`},{g:`fact`,id:`f-notmfg`,t:`單純分裝、添加風味粉→非製造`,x:`公訴意旨固認被告將毒品原料摻入〔風味粉〕並分裝封口，涉犯製造毒品罪。惟所謂製造，須使毒品產生物理或化學結構之變化，或提高純度、製成新毒品類型。被告僅將已含毒品成分之粉末添加食用粉末並以物理方式分裝，未改變毒品成分、效果或使用方法，難認該當「製造」之要件，應論以意圖販賣而持有毒品罪。（高院111年度上訴字第4744號、112年度上訴字第2315號判決參照）`},{g:`kj`,id:`kj-A0`,t:`A 階段行為吸收〔骨幹〕`,x:`按意圖販賣而持有毒品與販賣毒品，毒品危害防制條例第5條、第4條分別設有處罰。行為人先意圖販賣而持有毒品，嗣後又著手將該毒品販賣予他人者，係以同一行為客體，對同一法益所為不同階段之侵害行為，其中販賣毒品之重罪構成要件，雖無法包攝性質上屬於預備行為之意圖販賣而持有毒品行為，但就此等前後階段行為，論以較重之販賣毒品罪，即可充分滿足整體不法非難之需求，屬吸收犯，僅論以較重之販賣毒品罪即為已足。（臺中高分院114年度上訴字第661號、高院113年度上訴字第4232號判決參照）`},{g:`kj`,id:`kj-A1`,t:`A1 全部供該次交易→吸收`,x:`被告意圖販賣而持有{G}（及持有{G}純質淨重〔○〕公克以上）之低度行為，應為其販賣{G}〔未遂〕之高度行為所吸收，不另論罪。`},{g:`kj`,id:`kj-A2`,t:`A2 同時取得、供當日分次交付（小蜜蜂）→吸收`,x:`扣案如附表〔○〕編號〔○〕所示之毒品，與被告本次交付之毒品係於同日同時自「〔○○〕」取得，外包裝及成分均相同，並同時遭警查獲。參以毒品上游為提高效率，常一次交付多量毒品供「小蜜蜂」當日分次送交購毒者，核與被告手機內自當日〔時間〕起多次送交毒品予其他購毒者之對話紀錄相符，足認上開毒品亦係供本次販賣所用，其意圖販賣而持有之低度行為，應一併為販賣〔未遂〕之高度行為所吸收，不另論罪。（高院114年度上訴字第4113號判決參照）`},{g:`kj`,id:`kj-A3`,t:`A3 同級不同種類毒品只成立一罪`,x:`毒品危害防制條例係將毒品「分級」列管，而非按「種類」規制，同時持有同一級別內之不同種類毒品，僅侵害單一社會法益，應單純論以一罪，而非數罪。被告同時持有之〔愷他命〕及〔毒品咖啡包〕均屬{G}，其持有之低度行為（含意圖販賣而持有部分），均應為販賣〔未遂〕之高度行為所吸收，不另論罪。公訴意旨以毒品種類不同而主張分論併罰，尚有未合。（高雄高分院113年度上訴字第183號、113年度上訴字第425號判決參照）`},{g:`kj`,id:`kj-A4`,t:`A4 另論想像競合屬過度評價`,x:`被告持有之毒品既均供本次販賣所用，其意圖販賣而持有之低度行為應為販賣之高度行為所吸收；若另論以意圖販賣而持有毒品罪，並與販賣罪論以想像競合，即有過度評價之違誤。公訴意旨此部分所指，容有誤會。（高雄高分院113年度上訴字第425號判決參照）`},{g:`kj`,id:`kj-A5`,t:`A5 販入後第一次賣出→接續販入犯意`,x:`被告意圖營利販入毒品後第一次出賣，係接續原先販入之犯意，僅論以販賣既遂一罪，不另論意圖販賣而持有毒品罪。（高院111年度上訴字第4675號判決參照）`},{g:`kj`,id:`kj-B1`,t:`B1 剩餘另論意圖販賣而持有，分論併罰（113年後多數）`,x:`按以重罪吸收輕罪後，倘產生整體不法非難之需求未被充分滿足，而有評價不足之問題時，即不應論以吸收犯，除可成立其他包括一罪者外，仍應分論併罰。行為人所犯之輕罪與重罪（如意圖販賣而持有毒品、販賣毒品）間，縱具有想像上、邏輯上或論理上之前後階段關係，但因行為客體不同，實質上並不存有階段關係者，即非屬吸收犯。（最高法院112年度台上字第4369號、113年度台上字第4018號判決意旨，經高院113年度上訴字第4232號、臺中高分院114年度上訴字第661號判決援引）
又販賣毒品罪與意圖販賣而持有毒品罪，各有其構成要件及刑罰，除具有垂直關係外，難遽認彼此間有必然之吸收關係。行為人意圖營利而購入大量毒品後，倘將全部毒品同時販賣給同一人，固得認前、後行為係垂直連貫之階段行為而具吸收關係；惟若僅販賣其中部分，其餘尚未販賣而繼續持有之毒品，既非供該次販賣所用，與該次販賣並無垂直關係之階段性，難認為該次販賣毒品之構成要件及不法內涵所包括，自無吸收關係。（高院115年度上訴字第780號、臺中高分院113年度上訴字第1030號判決參照）
查被告於〔時間〕購入〔總量〕後，僅將其中〔數量〕販賣予〔○○○〕，其餘〔數量〕既非供該次販賣所用，自非該次販賣行為所得吸收，應另論以意圖販賣而持有毒品罪，並與販賣毒品罪分論併罰。公訴意旨認二罪應論以想像競合犯，容有誤會。`},{g:`kj`,id:`kj-B1a`,t:`B1 補強：數量差距＋購入時欠缺具體認識`,x:`意圖販賣而持有毒品與販賣毒品間之吸收關係，以前後行為所涉毒品內涵相同，且前行為時已有對後行為之具體認識者為限。被告意圖販賣而持有之毒品為〔咖啡包500包〕，嗣後販賣者僅〔10包〕，數量顯有差距，行為客體已非同一；且被告購入毒品時並無對日後特定販毒行為之具體認識，係待〔○○〕通知交易後始萌生具體販賣犯意，前後行為主觀上亦非出於同一犯意，自不具吸收關係。（高雄高分院113年度上訴字第664號判決參照）`},{g:`kj`,id:`kj-B1b`,t:`B1 補強：不同批、不同時取得`,x:`被告於〔半年前〕取得之〔○○〕，與本案販賣之毒品取得時間相隔甚久，型態、成分亦有別，且與本案交易無關，二者犯意各別，行為互殊，應分論併罰。（高院114年度上訴字第4113號判決參照）`},{g:`kj`,id:`kj-B1c`,t:`B1 補強：駁想像競合主張（去除夾結）`,x:`辯護意旨雖稱被告意圖販賣而持有之毒品與販賣之毒品係同一持有行為，應論以想像競合犯云云。惟持有毒品之繼續中多次另犯不法內涵較高之他罪者，應予分論併罰，始能充分評價其不法罪責內涵，此即學理上之「去除夾結效果」，尚不能僅因同次持有毒品，即將數次毒品犯罪論以一罪。辯護意旨所陳，尚非可採。（高院113年度上訴字第453號判決參照）`},{g:`kj`,id:`kj-B2`,t:`B2 剩餘由最後一次販賣吸收（備選）`,x:`以營利為目的販入毒品，經多次販賣後，持有剩餘毒品被查獲者，其各次販賣行為如併合處罰，該持有剩餘毒品之低度行為，應僅為最後一次販賣毒品之高度行為所吸收，不另論罪。（最高法院105年度台上字第2174號判決意旨，經臺南高分院112年度上訴字第876號判決援引；臺中高分院112年度上訴字第874號判決參照）`},{g:`kj`,id:`kj-B3`,t:`B3 先行銷後取貨＝單一著手（備選）`,x:`被告於取得毒品前，「〔○○〕」已對不特定人傳送販賣毒品之廣告訊息，被告於此著手後加入，取得〔總量〕均係為販賣，僅因初次交易即遭查獲而放棄整個販毒計畫。被告一個著手共同販賣〔總量〕之犯行，在實體法上應評價為一罪，其持有剩餘毒品之低度行為，為販賣〔未遂〕之高度行為所垂直吸收。（高院112年度上訴字第2378號判決參照）`},{g:`kj`,id:`kj-B4`,t:`B4 一持有行為兼具二犯意→想像競合（備選）`,x:`被告依「〔○○〕」指示駕車時，即持有存放於該車之如附表編號〔○〕所示毒品，其中〔部分〕係已與買家達成合意而前往交付，其餘則伺機販售。被告以單一持有行為，主觀上同時有販賣毒品及意圖販賣而持有毒品之犯意，係一行為觸犯販賣毒品未遂罪及意圖販賣而持有毒品罪，為想像競合犯，應依刑法第55條前段規定，從一重之〔罪名〕處斷。（高雄高分院114年度上訴字第435號、高院112年度上訴字第3568號判決參照）`},{g:`kj`,id:`kj-C1`,t:`C1 剩餘級別較高→不得以輕吸收重，分論併罰`,x:`被告販賣之〔第三級毒品咖啡包〕與其意圖販賣而持有之〔混合第二級、第四級毒品之哈密瓜錠〕，毒品種類、級別及販賣對象均不相同，不具邏輯上或論理上之前後階段關係；且後者之法定刑重於前者，其不法內涵顯非前者所能涵蓋，自無由較輕之販賣第三級毒品罪吸收較重之意圖販賣而持有第二級毒品罪之理。辯護意旨主張應論以想像競合犯或吸收犯，均非可採，應分論併罰。（臺中高分院114年度上訴字第661號、高院113年度上訴字第4232號判決參照）`},{g:`kj`,id:`kj-C2`,t:`C2 單一犯意同時取得多級毒品→想像競合（備選）`,x:`被告基於單一犯意，向「〔○○〕」拿取如附表編號〔○〕所示毒品，前往與員警交易並伺機販賣剩餘毒品，係一行為觸犯販賣第三級毒品未遂罪及意圖販賣而持有第二級毒品而混合二種以上之毒品罪，為想像競合犯，應依刑法第55條規定，從一重之意圖販賣而持有第二級毒品而混合二種以上之毒品罪處斷。（高院112年度上訴字第3568號判決參照）`},{g:`kj`,id:`kj-C3`,t:`C3 想像競合時輕罪減刑事由併予審酌`,x:`被告所犯輕罪即〔販賣第三級毒品未遂罪〕部分，雖有刑法第25條第2項未遂犯減輕其刑規定之適用，惟因想像競合從一重處斷，無從逕依該規定減輕其刑，僅於量刑時併予審酌。（高院112年度上訴字第3568號、臺中高分院112年度上訴字第3121號判決參照）`},{g:`kj`,id:`kj-D1`,t:`D1 施用持有後另起販賣意→分論併罰`,x:`因施用、轉讓或販賣而持有毒品之行為，為不同之犯罪型態，其持有低度行為之吸收關係，以高、低度行為間具有垂直關係者為限，非可任意擴張至他罪犯行。一定數量之毒品並非不可分，行為人僅取其中部分施用、轉讓或販賣後，仍繼續持有其餘毒品者，該次施用、轉讓或販賣所得吸收者，僅以供該次所用之毒品為限。被告初因施用而持有毒品，嗣後另行起意販賣，兩者犯意各別、行為互殊，應予分論併罰。（臺中高分院113年度上訴字第1030號判決參照）`},{g:`kj`,id:`kj-D2`,t:`D2 前案持有確定，後案販賣非同一案件`,x:`被告前案持有毒品係供己施用，本案則係意圖營利而販賣，主觀犯意不同、客觀行為有別，應認係另行起意之獨立行為。本案販賣之高度行為僅吸收該次販賣所持有之〔數量〕，其餘逾量毒品之繼續持有與本案販賣並無必然關連，二者無實質上或裁判上一罪關係，本案非前案確定判決效力所及。（高院113年度上訴字第453號判決參照）`},{g:`kj`,id:`kj-D3`,t:`D3 施用吸收範圍限於該次施用之毒品`,x:`施用毒品前持有毒品之行為，須該持有之毒品確係供該次施用者，始為施用行為所吸收；若持有之毒品與施用行為無關，即不發生吸收關係，亦非該確定判決既判力所及。（臺中高分院113年度上訴字第1000號判決參照）`},{g:`kj`,id:`kj-E1`,t:`E1 逾量持有為意圖販賣而持有吸收`,x:`被告持有{G}純質淨重〔○〕公克以上之低度行為，為意圖販賣而持有之高度行為所吸收，不另論罪。（高院112年度上訴字第4561號、臺南高分院110年度上更一字第48號判決參照）`},{g:`kj`,id:`kj-E2`,t:`E2 同時意圖販賣而持有多級毒品→想像競合`,x:`被告同時意圖販賣而持有第二級、第三級、第四級毒品，係以一行為觸犯上開三罪，為想像競合犯，應依刑法第55條規定，從一重之意圖販賣而持有第二級毒品罪處斷。（高院112年度上訴字第247號判決參照）`},{g:`kj`,id:`kj-E3`,t:`E3 混合毒品與未混合單一毒品同時持有`,x:`毒品危害防制條例第9條第3項所稱「混合二種以上之毒品」，係指將二種以上毒品摻雜調合、置於同一包裝而無從區分。被告持有之〔愷他命〕未混合其他毒品，僅成立同條例第5條第3項之罪，不得論以第9條第3項之罪；惟其以一持有行為，同時意圖販賣而持有〔愷他命〕及〔混合毒品咖啡包〕，為想像競合犯，應從一重之意圖販賣而持有第三級毒品而混合二種以上毒品罪處斷。（高院111年度上訴字第1976號判決參照）`},{g:`kj`,id:`kj-F1`,t:`F1 栽種、持有種子、製造後持有→製造吸收`,x:`被告製造第二級毒品大麻前持有大麻種子、意圖製造毒品而栽種大麻之低度行為，及製造完成後持有大麻之行為，均為製造第二級毒品之高度行為所吸收，不另論罪。（臺中高分院111年度上訴字第1455號、臺南高分院111年度上訴字第762號判決參照）`},{g:`kj`,id:`kj-F2`,t:`F2 製造第四級或先驅原料→製造第二級吸收`,x:`被告製造第二級毒品過程中伴隨產製第四級毒品〔假麻黃鹼〕，係同一製造行為之階段行為，應為較重之製造第二級毒品罪所吸收，不另論罪。（臺南高分院111年度上訴字第208號、高院112年度上訴字第1006號判決參照）`},{g:`kj`,id:`kj-F3`,t:`F3 製造↔意圖販賣而持有：吸收說`,x:`被告製造後意圖販賣而持有之行為，為製造毒品之高度行為所吸收，不另論罪。公訴意旨認被告以一行為同時觸犯製造及意圖販賣而持有毒品罪，應論以想像競合犯，容有誤會。（臺中高分院111年度上訴字第1455號判決參照）`},{g:`kj`,id:`kj-F3b`,t:`F3' 製造↔意圖販賣而持有：想像競合說`,x:`被告係為販賣以營利而製造毒品，製造完成後伺機販賣而持有，屬意圖販賣而持有，且該製造犯行與意圖販賣而持有犯行有行為局部同一之情形，應依刑法第55條前段想像競合犯規定，從一重之製造毒品罪處斷。（高雄高分院113年度上訴字第746號判決參照）`},{g:`kj`,id:`kj-F4`,t:`F4 製造目的即在販賣→想像競合`,x:`毒品危害防制條例第4條所規範之製造行為，按其性質或結果，並非當然含有販賣之成分，難謂其間必有高低度或前後階段行為之吸收關係。惟倘行為人製造毒品之目的即在販賣牟利，其製造與販賣行為局部同一，應按想像競合犯處斷。被告基於販賣之意思而製造{G}，嗣即對外販售，以一行為觸犯製造及販賣{G}〔未遂〕二罪名，應依刑法第55條規定，從一重之製造{G}罪處斷。（花蓮高分院112年度原上訴字第42號、高院110年度上訴字第3279號判決參照）`},{g:`kj`,id:`kj-F5`,t:`F5 製造完成後另起販賣犯意→分論併罰`,x:`製造毒品與販賣毒品，按其性質或結果，並非當然含有販賣之成分，難謂其間必有低度與高度或前階段與後階段行為之吸收關係。被告製造〔○○〕後，始另起意圖營利販賣之犯意，先後〔○〕次販賣予〔○○○〕，其製造與各次販賣犯意各別、行為不同，應分論併罰。（高院112年度聲再字第245號、113年度上訴字第2857號判決參照）`},{g:`kj`,id:`kj-F6`,t:`F6 一次製造、多次販賣`,x:`被告等以一次製造完成之毒品陸續販賣，並不違反常情；檢察官復未能舉證有多次獨立之製造行為，應僅論以一次製造毒品罪，其餘各次販賣行為，則各論以販賣毒品〔未遂〕罪。（高院114年度原上訴字第327號判決參照）`},{g:`kj`,id:`kj-F7`,t:`F7 製造舉動接續犯`,x:`被告於事實欄所示時、地製造毒品之數行為態樣，均於密切接近之時地實施，侵害同一法益，各行為之獨立性極為薄弱，應視為數個舉動之接續施行，屬接續犯，論以包括一罪。（高院113年度上訴字第2857號、臺中高分院111年度上訴字第1455號判決參照）`},{g:`kj`,id:`kj-G1`,t:`G1 長途運送後交付→運輸＋販賣想像競合`,x:`運輸毒品罪之規範目的在遏止毒品於兩地間流通擴散，凡將毒品由甲地運送至乙地即屬之，不限國境內外或為人、為己。行為人為自己販賣而攜帶毒品，除主觀上另具運輸之意思而為實際運送外，應逕依販賣論擬。被告將〔數量〕毒品自〔甲地〕以〔超商店到店〕方式跨縣市託運至〔乙地〕交付買受人，顯非零星夾帶或短途持送，主觀上除販賣犯意外另具運輸之犯意。其運輸與販賣行為局部同一，應論以想像競合犯，從一重之〔罪名〕處斷。（高院112年度上訴字第1274號、臺中高分院112年度上訴字第3121號判決參照）`},{g:`kj`,id:`kj-G2`,t:`G2 攜往約定地點交付→只論販賣`,x:`行為人基於販賣毒品營利之意圖，自其住處攜帶毒品前往約定地點交付購買者，除主觀上另具運輸毒品之犯意而有實質運送行為外，僅論以販賣毒品罪，毋庸另論運輸毒品罪。被告係先與買家談妥交易，始前往取回毒品並攜往交易地點，主觀上係基於販賣目的而取得毒品，並非基於運輸之犯意，公訴意旨另論運輸毒品罪，尚有未洽。（臺中高分院111年度上訴字第1932號判決參照）`},{g:`kj`,id:`kj-G3`,t:`G3 運輸大量囤貨→運輸＋意圖販賣持有；與後續販賣分論`,x:`被告與共犯自〔甲地〕載運毒品咖啡包〔○〕箱至〔乙地〕，數量非少，顯非短途持送或零星夾帶，被告除意圖販賣而持有外，另有運輸毒品之犯意，自應併論運輸毒品罪。又被告前開運輸、持有行為與嗣後之販賣行為，行為種類不同、時地亦異，具獨立性，非屬接續犯，應分論併罰。（臺中高分院111年度上訴字第967號判決參照）`},{g:`kj`,id:`kj-I1`,t:`I1 以毒品抵償債務→販賣`,x:`被告以毒品〔○○〕抵償其積欠〔○○〕之新臺幣〔○〕元債務，屬有償交易，客觀上已該當販賣行為；所謂營利意圖不以實際得利為必要，被告既藉此消滅自身債務，主觀上即有營利之意圖。（臺中高分院111年度上訴字第967號判決參照）`},{g:`kj`,id:`kj-I2`,t:`I2 同次交易賣出多級毒品→想像競合`,x:`被告於同一次交易中，同時販賣〔第一級毒品海洛因〕及〔第二級毒品甲基安非他命〕予〔○○〕，係以一行為觸犯〔販賣第一級毒品罪及販賣第二級毒品罪〕，應依刑法第55條規定，從一重之〔販賣第一級毒品罪〕處斷。（高院111年度上訴字第333號判決參照）`},{g:`kj`,id:`kj-I3`,t:`I3 混合毒品第9條第3項為獨立罪名`,x:`毒品危害防制條例第9條第3項所定「犯前五條之罪而混合二種以上之毒品者，適用其中最高級別毒品之法定刑，並加重其刑至二分之一」，係就行為人犯同條例第4條至第8條之罪，因混合二種以上毒品之特殊情形，加重其法定刑至二分之一，屬刑法分則加重之性質，而成為另一獨立之罪名。（臺中高分院111年度上訴字第1772號、高院111年度上訴字第1976號判決參照）`},{g:`kj`,id:`kj-I3a`,t:`I3a 對混合成分具不確定故意`,x:`毒品咖啡包之內容物種類多樣，被告未確認成分即購入販售，主觀上對於毒品咖啡包內含毒品種類為何毫不在乎，決意販賣，堪認具有販賣{G}而混合二種以上毒品之不確定故意。（臺中高分院111年度上訴字第1932號、高院113年度上訴字第4232號判決參照）`},{g:`kj`,id:`kj-I3b`,t:`I3b 同次交付之未混合單一毒品→想像競合`,x:`被告同時交付之〔愷他命〕並未與其他毒品混合，此部分僅成立販賣第三級毒品〔未遂〕罪；被告以一行為同時觸犯販賣第三級毒品未遂罪及販賣第三級毒品而混合二種以上之毒品未遂罪，為想像競合犯，應從一重之販賣第三級毒品而混合二種以上之毒品未遂罪處斷。（高雄高分院111年度上訴字第1089號、高院112年度上訴字第5351號判決參照）`},{g:`kj`,id:`kj-I5`,t:`I5 對未成年人販賣須明知或可預見（不加重）`,x:`成年人對未成年人販賣毒品，須行為人主觀上明知或可預見購毒者為未成年人，始得依毒品危害防制條例第9條第1項加重其刑。〔購毒者〕外貌成熟，自陳從事〔板模工〕，毒品交易過程接觸短暫，卷內亦無證據證明其曾告知年齡，難認被告可預見其為未成年人，依罪疑唯輕原則，不依上開規定加重其刑。（臺中高分院112年度上訴字第476號判決參照）`},{g:`role`,id:`r-H0`,t:`H0 正犯與幫助犯之區分〔固定〕`,x:`刑法關於正犯、幫助犯之區別，係以其主觀之犯意及客觀之犯行為標準。凡以自己犯罪之意思而參與犯罪，無論所參與者是否犯罪構成要件之行為，皆為正犯；其以幫助他人犯罪之意思而參與犯罪，其所參與者，苟係犯罪構成要件之行為，亦為正犯；必以幫助他人犯罪之意思而參與犯罪，其所參與者又為犯罪構成要件以外之行為，始為從犯。就販賣毒品而言，洽談買賣條件、看貨、議價、洽定交易時地、運送貨品、收取價金等，依社會通念均屬賣方整體販賣行為之一部分，祇要參與其一，即屬販賣之構成要件行為。（臺中高分院112年度上更一字第45號、112年度上訴字第2750號判決參照）`},{g:`role`,id:`r-H1`,t:`H1 小蜜蜂、送毒司機→共同正犯`,x:`被告受「〔○○〕」雇用，依其指示前往約定地點交付毒品並收取價金，所分擔者為交付毒品、收取價金等販賣之構成要件行為，縱其僅領取〔日薪／每包報酬〕而未直接參與議價，仍係以自己犯罪之意思參與，與「〔○○〕」等人有犯意聯絡及行為分擔，應論以共同正犯。（高雄高分院113年度上訴字第183號、114年度上訴字第435號判決參照）`},{g:`role`,id:`r-H1b`,t:`H1 補充：參與犯罪組織＋首次販毒→想像競合`,x:`被告參與犯罪組織之繼續行為，應與其參與後首次經起訴之販賣毒品犯行論以想像競合犯，以避免重複評價。本案為被告參與本案販毒集團後最先繫屬於法院之案件，其參與犯罪組織、販賣毒品〔未遂〕、意圖販賣而持有毒品等罪，係一行為觸犯數罪名，應依刑法第55條前段規定，從一重之〔罪名〕處斷。（臺中高分院111年度上訴字第1772號判決參照）`},{g:`role`,id:`r-H2`,t:`H2 居間介紹（未參與構成要件、無報酬）→幫助販賣＋幫助施用`,x:`居間介紹買賣毒品者，若未涉及看貨、議價、洽定交易時地、收款、交貨等販賣罪之構成要件行為，亦未受有報酬，應視其主觀意思，分別成立幫助施用或幫助販賣毒品罪；若同時與買賣雙方聯繫而助益雙方，則成立幫助施用及幫助販賣毒品罪之想像競合犯。查被告僅將〔購毒者〕欲購毒之訊息轉知〔販毒者〕，嗣交易之數量、價格、時地均由二人自行聯絡議定，被告未參與交付毒品或收取價金，亦無證據證明其與〔販毒者〕約定分潤，其所為同時助益〔販毒者〕之販賣及〔購毒者〕之施用，係犯刑法第30條第1項前段、毒品危害防制條例第4條第〔○〕項之幫助販賣{G}罪，及刑法第30條第1項前段、同條例第10條第〔○〕項之幫助施用{G}罪，以一行為觸犯二罪名，應從一重之幫助販賣{G}罪處斷。公訴意旨認被告為共同正犯，容有誤會。（高院111年度上訴字第1372號、112年度上訴字第5037號、高雄高分院111年度上更一字第35號判決參照）`},{g:`role`,id:`r-H2a`,t:`H2 補充：幫助販賣之未必故意`,x:`幫助販賣毒品罪之成立，不以行為人明知買賣雙方交易細節（如價額、數量）為必要；行為人對於賣方係基於營利意圖販賣毒品、買方係基於施用意圖購入毒品等基本事實有所認識，並居中促成交易，即具幫助販賣之未必故意。（高雄高分院111年度上更一字第35號判決參照）`},{g:`role`,id:`r-H2b`,t:`H2 補充：買賣雙方均為販毒者`,x:`被告明知「〔○○〕」從事販賣毒品，仍提供助力促成交易，構成幫助販賣既遂；又明知〔買方〕購毒目的係為轉售，亦構成幫助〔買方〕販賣未遂。被告以一行為觸犯上開二罪名，應從一重之幫助販賣{G}既遂罪處斷。（臺中高分院112年度上訴字第2750號判決參照）`},{g:`role`,id:`r-H3`,t:`H3 居間但參與看貨、議價、秤重、收款→共同正犯`,x:`被告雖辯稱僅係居間媒介云云。惟〔購毒者〕無從直接聯繫「〔○○〕」，交易價格、數量均由被告傳達，現場復由被告確認數量、秤重分裝、收取價金後轉交「〔○○〕」，顯已阻斷買方與上游之聯繫管道，被告係立於賣方立場參與交易，其行為已包含洽定交易時地、看貨、交付毒品、收取價金等販賣構成要件行為，與單純牽線者有別，應論以共同正犯，不能以「居間」脫免販賣罪責。（高院111年度上訴字第4575號、高雄高分院111年度上訴字第164號判決參照）`},{g:`role`,id:`r-H3b`,t:`H3 補充：明知買方轉售仍代尋貨源→共同正犯`,x:`被告明知〔○○〕購入毒品係為販賣營利，仍代為聯繫上游、磋商價格、陪同交易並轉交價金及毒品，其參與者屬販賣之構成要件核心行為，且對交易完成具必要性，應論以共同正犯，而非幫助犯。（高院111年度上訴字第4675號判決參照）`},{g:`role`,id:`r-H4`,t:`H4 搭載、陪同到場→幫助犯`,x:`本案在網路散布販毒廣告、與喬裝買家之員警議定交易數量、價格及時地、到場親自交易之人均為〔○○〕，被告僅騎車搭載〔○○〕到場並在旁等候，卷內查無積極證據證明被告參與販賣之構成要件行為，或與〔○○〕間有共同犯罪之意思聯絡，僅能認定被告知悉〔○○〕販毒之情而提供助力，應成立幫助犯。（高院111年度上訴字第37號判決參照）`},{g:`role`,id:`r-H4x`,t:`H4 例外：長途載運大量毒品→運輸共同正犯`,x:`被告雖辯稱僅依指示開車載運，不知紙箱內為毒品云云。惟紙箱內之毒品外包裝經採得與被告相符之指掌紋，被告亦自承曾拆箱查看；且運輸、販賣毒品者深恐事跡敗露，非極信任之人絕不輕易託付，被告既配合將〔數量〕毒品自〔甲地〕載運至〔乙地〕，主觀上確有運輸及販賣之犯意聯絡，應論以共同正犯。（臺中高分院112年度上訴字第3121號判決參照）`},{g:`role`,id:`r-H5`,t:`H5 自居賣方（駁合資、代購、調貨）→販賣`,x:`毒販基於營利意圖，與買方議妥交易後，始轉向上手取得毒品交付買方，所在多有，不可與單純為便利施用而代為購買之幫助施用情形等同視之。所謂合資、代購、調貨是否構成販賣，應視被告在交易過程中之行為特徵而定，即其究係立於賣方立場，於向上游取得貨源後以己力為出售之交易，抑或立於買方立場而代為聯繫購買。查被告接受〔購毒者〕之要約，先行收取價金後，獨自向上游取得毒品交付，〔購毒者〕自始不知上游為何人，亦無從與之聯繫，交易之價格及數量均由被告單方決定。被告既阻斷買方與上游之聯繫管道而居於出賣人地位，縱其毒品係事後另向上游調貨，仍屬販賣行為，所辯合資或幫助施用云云，不足採信。（臺中高分院111年度上訴字第902號、112年度上更一字第45號、高雄高分院113年度上訴字第814號判決參照）`},{g:`role`,id:`r-H6`,t:`H6 代購→變更起訴法條為幫助施用（第一、二級）`,x:`受施用毒品者委託，代為向販售毒品者購買毒品後交付委託人，並收取價款，與受販售毒品者委託交付毒品並收取價款，二者雖具相同之行為外觀，惟應以行為人主觀上究與買受人或販售者間有意思聯絡，而異其行為責任。單純意在便利、助益施用，而基於與施用者間之意思聯絡代購毒品者，僅屬幫助施用；若意圖營利，而基於與販售者間之犯意聯絡代為交付毒品者，則為共同販賣。（最高法院112年度台上字第369號、第4160號判決意旨，經臺中高分院113年度上訴字第665號、高院114年度上訴字第5236號判決援引）
查〔購毒者〕認識上游「〔○○〕」而可自行接洽，被告向上游取得之價格即為轉告〔購毒者〕之價格，未從中賺取價差、量差，亦無自行決定價格、數量之權限，卷內復無證據足認被告有營利之意圖，依罪疑唯輕原則，應為有利被告之認定。（高院114年度上訴字第5236號、高雄高分院111年度重上更三字第7號、臺南高分院111年度上訴字第1478號判決參照）`},{g:`role`,id:`r-H6b`,t:`H6 代購第三、四級毒品→無罪`,x:`施用第三級、第四級毒品，毒品危害防制條例並無刑罰規定，被告縱係基於幫助施用之意思代為購買，亦無從成立幫助犯。被告此部分被訴販賣毒品罪嫌，既不能證明其有營利之意圖，自應為無罪之諭知。（臺中高分院113年度上訴字第665號、高院113年度上訴字第453號判決參照）`},{g:`role`,id:`r-H7`,t:`H7 合資購買→共同持有`,x:`「合資購買」乃行為人與他人共同出資向上游購買後共同持有，重在購毒成本之分攤，並無營利之意圖。查被告收受〔○○〕支付之價金後分毫未留，加計自己出資部分旋即全數匯予上游，時序密接，核與合資購毒之常情相符；且係〔○○〕主動詢問能否取得毒品。被告與〔○○〕約定合資購毒，主觀上有共同持有之犯意聯絡，客觀上由被告出面購買、秤重朋分，應論以持有毒品罪之共同正犯。（高院111年度上訴字第2185號判決參照）`},{g:`role`,id:`r-H8`,t:`H8 製毒集團出資者、後勤人員→共同正犯`,x:`共同正犯不以全體均實行構成要件行為為必要；行為人出於自己犯罪之意思，參與構成要件以外但對犯罪實現不可或缺之分工，或於共同意思範圍內相互利用他人之行為以達犯罪目的者，即屬共同正犯。被告〔出資提供設備並約定分配利潤三成／載運封口機等設備、購買原料、搬遷製毒器具及成品〕，參與過程橫跨製毒之準備、原料取得及成品搬遷，對本案犯行之實現具有高度重要性，並知悉且同意分配不法利潤，應論以共同正犯，辯護意旨主張僅為幫助犯，不足採信。（高雄高分院113年度上訴字第746號、臺南高分院114年度上訴字第112號判決參照）`},{g:`nl`,id:`nl-N0`,t:`N0 毒品列級屬空白刑法補充規範〔骨幹〕`,x:`毒品危害防制條例第2條第3項規定，毒品之分級及品項，由法務部會同衛生福利部組成審議委員會，每三個月定期檢討，審議通過後報由行政院公告調整、增減之。核其性質，係立法者授權行政機關以補充毒品條例各罪構成要件內容之「空白刑法」補充規範，其本身並非刑罰法律；補充規範縱有變更，僅屬構成要件所涉事實內容之變更，並非刑罰法律本身之變更，不生刑法第2條第1項新舊法比較之問題，應依行為時補充規範所填補之事實內容適用法律。（最高法院113年度台非字第168號、97年度台上字第4022號、94年度台上字第771號判決意旨參照）`},{g:`nl`,id:`nl-N1`,t:`N1 行為後改列→依行為時列級論罪`,x:`被告行為時（〔行為日期〕），〔毒品名稱〕係列為第〔二〕級毒品；嗣行政院於〔公告日期〕以〔公告字號〕公告修正毒品分級及品項，將〔毒品名稱〕改列為第〔一〕級毒品，並自〔生效日期〕生效。揆諸前揭說明，上開改列僅屬補充規範之事實變更，不生新舊法比較問題，被告本案犯行應依其行為時之列級，論以{G}之罪，而非改列後之級別。`},{g:`nl`,id:`nl-N2`,t:`N2 依托咪酯列級時間軸（第三級→第二級→第一級）`,x:`依托咪酯經行政院公告，於113年8月5日公告列為第三級毒品（自113年8月6日公布於行政院公報起生效），嗣於113年11月27日改列為第二級毒品，復經行政院於115年6月25日以院臺法字第1155013102B號公告改列為第一級毒品，自115年6月27日生效。被告於〔行為日期〕〔販賣／持有／施用／轉讓〕依托咪酯，行為時依托咪酯係屬第〔三／二／一〕級毒品，應依行為時之列級論罪。（上開公告日、生效日及字號，請依公告原文核對；部分地院判決載115年6月25日生效，宜以公告為準）`},{g:`nl`,id:`nl-N3`,t:`N3 列管前之行為→不成立毒品條例，論藥事法`,x:`依托咪酯於113年8月6日公告生效列管前，並未列入毒品危害防制條例所定毒品品項，被告於列管前之行為，不成立毒品危害防制條例之罪。〔依托咪酯屬藥事法所稱之〔偽藥／禁藥〕，被告〔販賣偽藥／轉讓禁藥〕之行為，應依藥事法第83條第1項論處；公訴意旨認被告涉犯毒品危害防制條例，應依刑事訴訟法第300條變更起訴法條並告知。〕`},{g:`nl`,id:`nl-N4`,t:`N4 持有跨越改列→以行為終了時列級（依繼續犯理論推演）`,x:`被告持有〔毒品名稱〕之行為屬繼續犯，一經持有罪即成立，但其完結須繼續至持有行為終了時為止；其間法律縱有變更，行為既繼續實施至變更以後，即不生行為後法律變更之問題（最高法院95年度台上字第3461號、102年度台上字第1305號關於繼續犯以行為終了時之法律為行為時法之意旨參照）。被告持有行為終了於〔終了日期〕，斯時〔毒品名稱〕已列為第〔　〕級毒品，應以行為終了時之列級論罪。`},{g:`nl`,id:`nl-N5`,t:`N5 改列後沒收銷燬→依裁判時法（刑法§2Ⅱ、毒§18Ⅰ）`,x:`扣案之〔毒品名稱〕，被告行為時雖列為第〔三〕級毒品，惟裁判時已改列為第〔一／二〕級毒品。按沒收、非拘束人身自由之保安處分適用裁判時之法律，刑法第2條第2項定有明文；毒品之列級變更既屬補充規範之事實變更，本案沒收部分即應依裁判時之列級，適用毒品危害防制條例第18條第1項前段規定，不問屬於犯罪行為人與否，宣告沒收銷燬之。（本段亦可移入沒收理由）`},{g:`nl`,id:`nl-N6`,t:`N6 量刑不因嗣後改列而加重`,x:`被告行為後〔毒品名稱〕雖經改列為較高級別毒品，惟刑事責任應以行為時之法律評價為基礎，量刑時不因嗣後改列而逕予加重，僅就毒品之危害程度、被告行為時之認識及犯罪情節，依刑法第57條各款事項審酌。`},{g:`nl`,id:`nl-N7`,t:`N7 不知列管→刑法§16（違法性認識）`,x:`被告辯稱不知〔毒品名稱〕已列為毒品云云。惟刑法第16條規定，除有正當理由而無法避免者外，不得因不知法律而免除刑事責任，但按其情節，得減輕其刑。〔被告於警詢／本院審理時自陳〔如何取得、使用方式、曾見新聞報導或有同類前科〕，並有〔證據〕可佐，應可查詢確認而能避免〕，難認有何無法避免之正當理由，自不得依上開規定免除其刑責。〔如認有正當理由：被告確因〔具體事由〕無從知悉，且已盡查證能力，仍得依刑法第16條但書減輕其刑。〕`},{g:`nl`,id:`nl-N8`,t:`N8 電子煙油：藥事法改菸害防制法非「廢止刑罰」→不免訴`,x:`被告行為後，〔含〔毒品名稱〕成分之電子煙油〕之管理規範，由藥事法改依菸害防制法規定，惟此屬構成要件所涉補充規範之變更，核屬事實之變更，並非刑法第2條所指犯罪後之法律已廢止其刑罰，亦無刑事訴訟法第302條第4款所定免訴事由。（最高法院113年度台非字第168號判決意旨參照；引用前請調閱原判決核對）`},{g:`nl`,id:`nl-N9`,t:`N9 毒品條例109.7.15修正：§4罰金提高→適用修正前`,x:`按行為後法律有變更者，適用行為時之法律，但行為後之法律有利於行為人者，適用最有利於行為人之法律，刑法第2條第1項定有明文。被告行為後，毒品危害防制條例第4條、第9條第3項、第17條第2項業於109年1月15日修正公布，並自同年7月15日生效施行。修正前第4條第1項罰金上限為新臺幣2,000萬元，修正後為3,000萬元；第2項由「無期徒刑或7年以上有期徒刑，得併科新臺幣1,000萬元以下罰金」修正為「無期徒刑或10年以上有期徒刑，得併科新臺幣1,500萬元以下罰金」；第3項罰金由700萬元提高為1,000萬元；第4項罰金由300萬元提高為500萬元。是修正後之規定已提高法定刑，並未較有利於被告。〔經綜合全部罪刑比較，應一體適用修正前之規定。〕（新北地院112年度訴字第430號、111年度訴字第20號）`},{g:`nl`,id:`nl-N10`,t:`N10 §17Ⅱ「歷次審判」→修正前較有利`,x:`毒品危害防制條例第17條第2項於109年1月15日修正公布、同年7月15日施行，修正前規定「犯第4條至第8條之罪於偵查及審判中均自白者，減輕其刑」，修正後規定「偵查及歷次審判中均自白者，減輕其刑」，限制減輕其刑之適用，修正後之規定並未較有利於被告，被告行為在修正前者，應適用修正前之規定。〔被告於偵查及審判中均自白，依修正前第17條第2項規定減輕其刑。〕`},{g:`nl`,id:`nl-N11`,t:`N11 §9Ⅲ增訂（混合毒品）→較不利，適用修正前`,x:`毒品危害防制條例第9條第3項於109年1月15日增訂，明定犯前五條之罪而混合二種以上之毒品者，適用其中最高級別毒品之法定刑，並加重其刑至二分之一。扣案之〔毒品咖啡包〕同時檢出〔第三級毒品成分〕及〔第四級毒品成分〕，核屬混合二種以上且屬不同級別之混合型毒品，依修法前實務見解，係依想像競合犯從一重處斷，適用最高級別毒品所定之法定刑；增訂後則適用最高級別毒品之法定刑，並加重其刑至二分之一，修正後之加重規定顯較不利於被告，被告行為在109年7月15日前者，應適用修正前之規定。`}],Ct=[{id:`d01`,t:`購毒者為求減刑或挾怨而誣指`,say:`證人〔購毒者〕係為邀減刑寬典〔或與被告有嫌隙〕而誣指被告`,r:`被告雖辯稱證人〔購毒者〕係為邀減刑寬典而誣指云云。按購毒者所稱向某人買受毒品之指證，固不得作為有罪判決之唯一證據，仍須有補強證據以擔保其真實性；惟所謂補強證據，並非以證明犯罪構成要件之全部事實為必要，祇須與購毒者之指證相互利用，綜合判斷足以擔保其指證非屬虛構者，即屬充分；證人前後陳述雖有部分不符，事實審法院仍得本於經驗及論理法則合理取捨，非謂一有不符即全部不可採信。查證人〔購毒者〕就交易之時間、地點、毒品種類、數量及價金，於警詢、偵查及本院審理時之證述大致相符；且與〔通訊監察譯文／對話紀錄〕所示雙方於〔時間〕聯繫後旋即於〔地點〕見面之時序緊密連貫，復有〔監視器畫面／匯款紀錄〕可佐，其指證並非憑空虛構。又證人與被告間並無仇怨糾紛，若非確有其事，殊無甘冒偽證罪責而誣陷被告之理。被告所辯，不足採信。（高雄高分院112年度上更一字第9號、高院114年度上訴字第5979號判決參照）`,a:`按販賣毒品案件，購毒者所稱向某人買受毒品之指證，不得作為有罪判決之唯一證據。良以購毒者供出毒品來源，因而查獲其他正犯或共犯者，法律規定得減輕或免除其刑，其有為邀輕典而為不實陳述之可能，供述之憑信性本不及於一般人，必須有補強證據以擔保其真實性；所謂補強證據，必須與毒品交易之供述具有相當程度之關聯性，足使一般人對其供述無合理懷疑存在者，始足當之。查證人〔購毒者〕就〔交易價格／數量／交付方式〕之證述前後不一，且有供出毒品來源以求減刑之動機〔，與被告間復有金錢糾紛〕，其指證憑信性已有疑義；而卷內〔通訊紀錄〕僅能證明雙方曾相約見面，並未提及毒品種類、數量、價金或交易暗語，〔證人○○〕所述亦僅係聽聞〔購毒者〕轉述之累積證據，均不足以補強其指證。（高院114年度上訴字第1764號、112年度上訴字第950號、114年度原上訴字第390號判決參照）`},{id:`d02`,t:`數名購毒者（合資者）之指證不得互為補強`,say:`證人〔甲〕、〔乙〕之指證不得互為補強`,r:`被告雖辯稱證人〔甲〕、〔乙〕之指證不得互為補強云云。惟〔甲〕、〔乙〕係分別於不同時間、各自向被告購買毒品，各為獨立之交易，並非同一交易之對向共犯，其等證述各自另有〔通訊監察譯文、匯款紀錄〕可資補強，被告所辯，容有誤會。（反面參照高雄高分院113年度上訴字第514號判決）`,a:`購毒者之指證屬對向犯之供述，其憑信性本不及於一般人；複數對向必要共犯（如合資購毒者）一致之不利指證，其證據價值仍不出對向正犯之範疇，不得互為補強證據。查〔甲〕、〔乙〕係合資向被告購毒之對向共犯，其等就〔單純購買或合資購買〕、〔交付數量〕、〔交易金額〕等重要情節之證述前後不一且互核不符，復無通訊聯繫紀錄或交易現場扣得之毒品、金錢等其他補強證據，不能證明被告犯罪。（高雄高分院113年度上訴字第514號判決參照）`},{id:`d03`,t:`金錢往來係借款、還款或買酒`,say:`其與〔購毒者〕間之金錢往來係〔借款／還款／買酒〕`,r:`被告雖辯稱其與〔購毒者〕間之金錢往來係〔借款／還款／買酒〕云云。惟查：被告就〔借款之時點、金額、還款頻率〕之陳述前後不一，與證人〔購毒者〕所述亦多所歧異，且未能提出任何借款憑據；依其等所述推算，〔購毒者〕於〔交易日〕亦無為清償債務而交付〔金額〕元之可能。再觀諸〔通訊監察譯文〕，〔購毒者〕以「〔暗語〕」等語聯繫，被告即制止其於電話中續談並相約見面，核與毒品交易為規避查緝而以隱晦用語聯繫之常態相符，與單純借貸還款之對話顯然有別。被告所辯，顯係事後卸責之詞，不足採信。（臺南高分院112年度上訴字第1237號、臺中高分院112年度上訴字第155號、高院112年度上訴字第1307號判決參照）`,a:`查卷附通訊監察譯文之內容為〔購毒者〕向被告表示「〔那天跟你借3000，要拿3000還你〕」等語，依其文義僅能認定〔購毒者〕係以還款為由與被告相約見面，〔購毒者〕雖稱所謂還款即係購毒，然與通話內容之原本文義明顯不同，且其亦證稱被告常借錢予其，則上開譯文反足為被告有利之證明，自難據以補強〔購毒者〕之指證。（高雄高分院112年度上訴字第270號判決參照）`},{id:`d04`,t:`通訊內容與毒品無關（指人、藥物或一般物品）`,say:`通訊監察譯文所稱「〔暗語〕」係指〔○○〕，與毒品無涉`,r:`被告雖辯稱通訊監察譯文所稱「〔暗語〕」係指〔○○〕，與毒品無涉云云。惟毒品交易為減少遭查緝之風險，慣以買賣雙方得以知悉之術語或已有默契之含混語意替代毒品交易之重要訊息。證人〔購毒者〕已明確證稱「〔暗語〕」係指〔甲基安非他命及其數量／金額〕，核與譯文前後脈絡及雙方見面時序相符；〔且被告於前案販毒聯繫時，亦慣以相同數字暗語表示毒品交易之價格數量，犯罪手法具同一性〕。被告就譯文所辯，或前後不一，或無從合理說明對話中「〔不要一直打電話／怕東西被看到〕」等語，顯不足採。（高雄高分院112年度上訴字第565號、臺中高分院112年度上更一字第36號判決參照）`,a:`以通訊監察譯文作為購毒者指證之補強證據，其對話內容須依社會通念已足以辨別明白確係涉及毒品交易，始足當之；語意隱晦不明者，縱購毒者指述其含意即係毒品交易，仍屬購毒者單方之指述。查卷附譯文僅有「〔○○〕」等語，未提及交易之數量、價金等具體條件，依社會通念無從辨別係毒品交易，自不足作為補強證據。（高院112年度上訴字第950號、112年度上訴字第2721號判決參照）`},{id:`d05`,t:`僅係合資、代購或幫助施用`,say:`其係與〔購毒者〕合資購買或代為購買，並無營利意圖`,ref:{r:`r-H5`,a:`r-H6`}},{id:`d06`,t:`毒品係供己施用，無販賣意圖`,say:`扣案毒品均係供己施用，並無販賣之意圖`,r:`被告雖辯稱扣案毒品均係供己施用云云。惟被告持有之〔毒品〕〔數量〕，已明顯逾越一般施用者短期所需；扣案毒品經分裝為〔○〕包，每包〔○〕公克至〔○〕公克不等，並扣得電子磅秤、分裝袋等物；且被告與〔○○〕之對話以「〔暗語〕」詢價，綜合判斷，足認其主觀上有伺機販售牟利之意圖，被告所辯，不足採信。（臺中高分院113年度上訴字第1030號、高雄高分院114年度上訴字第579號判決參照）`,a:`公訴意旨固認被告就〔毒品〕涉犯意圖販賣而持有毒品罪。惟被告否認有販賣之意圖，卷內復無帳冊、交易紀錄或其他積極證據足資證明，不得僅憑持有數量多寡遽予推定；依罪疑唯輕原則，僅能認定被告構成持有毒品罪。（臺中高分院113年度上訴字第1000號、111年度上訴字第1932號判決參照）`},{id:`d07`,t:`不知所轉交、運送或代收之物為毒品`,say:`其僅受〔○○〕之託轉交物品／代收包裹，不知其內為毒品`,r:`被告雖辯稱其僅受〔○○〕之託〔轉交物品／代收包裹〕，不知其內為毒品云云。惟查：被告與〔○○〕〔素昧平生／僅一面之緣〕，竟以〔每趟○元〕之報酬代為〔收受、轉交〕來路不明之物品，所獲報酬與單純送貨之勞務顯不相當；且被告將該物品〔藏放於車內椅墊下隱密處／以衛生紙包覆〕，〔繞行後始行交付〕，〔並依指示刪除對話紀錄〕，顯係刻意規避查緝。衡以運送毒品者深恐事跡敗露，非極信任之人絕不輕易託付，被告對其所轉交者為毒品，縱非明知，亦已預見而不違背其本意，至少具有不確定故意。被告所辯，不足採信。（高院113年度上更一字第32號、114年度上更一字第42號、高雄高分院113年度上訴字第350號判決參照）`,a:`被告雖於〔警詢〕中陳稱知悉所轉交者為毒品，惟依刑事訴訟法第156條第2項規定，被告之自白不得作為有罪判決之唯一證據。證人〔○○〕證稱未告知被告袋內為毒品，被告亦未獲取任何好處；證人〔收受者〕亦證稱交付過程中與被告並無對話。除被告前開自白外，並無其他補強證據足以佐證其主觀上知悉所交付者為毒品，自不能遽為不利於被告之認定。（高雄高分院112年度原上訴字第17號判決參照）`},{id:`d08`,t:`不知毒品混合二種以上成分`,say:`不知所販售之毒品咖啡包混有〔○○〕成分`,r:`被告雖辯稱不知所販售之毒品咖啡包混有〔○○〕成分云云。惟毒品咖啡包之內容物種類多樣，成分不一，被告既未確認成分即予購入販售，主觀上對於毒品咖啡包內含毒品種類為何毫不在乎，決意為之，堪認具有混合二種以上毒品之不確定故意。（臺中高分院111年度上訴字第1932號、高院113年度上訴字第4232號判決參照）`,a:`扣案毒品咖啡包雖另檢出〔○○〕成分，然其純度未達1%，且被告係一次購入包裝相同、價格無異之毒品咖啡包，難認其對於混合之成分有所認識，自不得論以毒品危害防制條例第9條第3項之加重罪名。（高院112年度原上訴字第116號、112年度上訴字第2315號判決參照）`},{id:`d09`,t:`偵查自白係為求交保或遭誘導`,say:`其於偵查中之自白係為求交保〔／遭員警誘導〕而為`,r:`被告雖辯稱其於偵查中之自白係為求交保〔／受律師勸說／遭員警誘導〕而為云云。惟本院勘驗被告〔警詢、偵訊〕錄音錄影結果，詢（訊）問過程均以平和語氣為之，並無強暴、脅迫、利誘、詐欺、疲勞訊問或其他不正方法，被告精神狀況正常〔，且有辯護人在場〕；又被告於同次訊問時就其他販毒嫌疑仍堅詞否認，益見其係本於自由意志選擇性陳述。縱被告認罪之動機係為求交保，亦僅屬其自白之動機，不影響自白之任意性。其自白並與證人〔○○〕之證述及〔對話紀錄、匯款紀錄〕相符，足認與事實相符，自得採為認定犯罪之依據。（高院112年度上訴字第4831號、111年度上訴字第4462號、臺南高分院112年度上更一字第26號判決參照）`,a:`被告於偵查中雖曾自白，惟其陳稱係為求交保而為，且其自白內容與證人〔○○〕嗣於本院具結後之證述及〔通訊監察譯文〕所示情節不符，其自白之憑信性存疑；復無其他補強證據足以擔保其自白之真實性，自不得遽為有罪之依據。（高院112年度上訴字第2721號、114年度原上訴字第390號判決參照）`},{id:`d10`,t:`遭警方陷害教唆`,say:`其係遭員警陷害教唆`,r:`被告雖辯稱其係遭員警陷害教唆云云。按「誘捕偵查」區分為「創造犯意型」與「提供機會型」二種類型。前者係行為人原無犯罪之意思，純因具有司法警察權者之設計誘陷，始萌生犯意，實務上稱為「陷害教唆」，所取得之證據不具證據能力；後者則係行為人原已具有犯罪之意思，偵查人員僅提供機會，佯與之為對合行為，使其暴露犯罪事證，實務上稱為「釣魚偵查」，因屬偵查犯罪技巧之範疇，所取得之證據非無證據能力。查被告〔或共犯〕先於〔通訊軟體〕公開刊登暗示販賣毒品之訊息，員警執行網路巡邏發現後始佯裝買家與之聯繫，被告本即有販毒之犯意，並非因員警誘發始萌生，核屬合法之釣魚偵查，被告所辯，不足採信。（最高法院111年度台上字第1611號判決意旨，經高院111年度上訴字第3455號判決援引；高院114年度上訴字第5463號、112年度原上訴字第116號判決參照）`},{id:`d11`,t:`交易當日不在場、未與購毒者見面`,say:`案發當日〔在公司上班／不在住處〕，未與〔購毒者〕見面`,r:`被告雖辯稱案發當日〔在公司上班／不在住處〕，未與〔購毒者〕見面云云。惟〔公司雖有上下班刷卡紀錄，然無門禁管制，員工得短暫外出〕；且〔公司至交易地點車程僅約○分鐘〕，〔蒐證器材顯示時間經校正後與通訊監察及基地台位置相符〕，均無從排除被告於〔時間〕外出交易之可能，被告所辯，不足為有利之認定。（高雄高分院112年度上更一字第9號、臺中高分院112年度上更一字第36號判決參照）`},{id:`d12`,t:`反指購毒者才是賣方或推銷者`,say:`實係〔購毒者〕販賣毒品予被告〔／向被告推銷毒品〕`,r:`被告雖辯稱實係〔購毒者〕販賣毒品予被告〔／向被告推銷毒品〕云云。惟被告此部分辯解，或與其先前所稱〔借款／買酒〕前後不一，或與證人〔○○〕之證述及〔通訊監察譯文〕所示，由〔購毒者〕主動詢問「〔還有嗎〕」、被告回覆「〔有阿〕」之對話脈絡不符，顯係臨訟卸責之詞，不足採信。（臺中高分院112年度上訴字第155號、高院112年度上訴字第2791號判決參照）`},{id:`d13`,t:`無營利意圖、原價轉讓或無償提供`,say:`並無營利之意圖〔，係原價轉讓／無償提供〕`,r:`被告雖辯稱其無營利之意圖〔，係原價轉讓／無償提供〕云云。惟販賣毒品之營利意圖，不以實際獲利為必要；被告與〔購毒者〕非屬至親，毒品價昂且取得不易，查緝又嚴，倘非有利可圖，殊無甘冒重典風險、費時費力交付毒品之理。〔況被告於交付毒品後，猶持續催討款項，與無償轉讓者不在意對方是否付款之常情有違。〕〔證人亦證稱所取得毒品之數量價值不及其所支付之價金。〕被告所辯，不足採信。（高院114年度上訴字第5979號、臺南高分院112年度上訴字第1237號、高雄高分院114年度上訴字第603號判決參照）`},{id:`d14`,t:`交易未完成（現金不足、未交付）`,say:`當日因〔購毒者現金不足〕而未完成交易`,r:`被告雖辯稱當日因〔購毒者現金不足〕而未完成交易云云。惟被告與〔購毒者〕於通話中已議定交易之價格與數量，並親自出面〔交付毒品、收取價金〕，此與證人〔○○〕之證述及〔監視器畫面〕相符；若交易確未完成，被告殊無於〔時間〕出面之理，所辯與常情有違，不足採信。（臺南高分院112年度上訴字第24號判決參照）`,a:`證人〔購毒者〕於本院審理時證稱當日交易未成功，與其先前所述已有不一；卷附蒐證照片僅能證明雙方曾碰面，搜索扣押及鑑定資料亦僅能證明被告持有毒品，均不足以補強其指證，此部分不能證明被告犯罪。（高雄高分院114年度上訴字第603號判決參照）`},{id:`d15`,t:`僅居間介紹，應為幫助犯`,say:`其僅居間介紹，至多僅屬幫助犯`,ref:{r:`r-H3`,a:`r-H2`}}],wt={k12:{l:`第一、二級毒品（含包裝）`,v:`沒收銷燬`,seized:!0},mix12:{l:`含第一、二級成分之混合毒品`,v:`沒收銷燬`,seized:!0},tool12:{l:`專供製造、施用第一、二級毒品之器具`,v:`沒收銷燬`,seized:!0},k34:{l:`第三、四級毒品（含包裝）`,v:`沒收`,seized:!0},res34:{l:`檢出第三、四級毒品殘留之器具`,v:`沒收`,seized:!0},phone:{l:`行動電話（聯繫交易）`,v:`沒收`,seized:!0},tools:{l `)}function mn(e){let t=new Set;return e.forEach(e=>{({sell:[`販賣`,`持有`],possess_sell:[`意圖販賣而持有`],manufacture:[`製造`,`持有`],transport:[`運輸`,`持有`],help_sell:[`販賣`],help_use:[`施用`,`持有`],possess:[`持有`]}[e.act]||[]).forEach(e=>t.add(e))}),[...t].join(`、`)}var hn=[[`sell`,`販賣（既遂／未遂）`],[`possess_sell`,`意圖販賣而持有`],[`manufacture`,`製造`],[`transport`,`運輸`],[`help_sell`,`幫助販賣（居間）`],[`help_use`,`幫助施用（代購）`],[`possess`,`持有（含共同持有）`]],gn=[[`confess`,`自白`],[`confess_legal`,`自白，僅爭執法律評價`],[`deny`,`否認`],[`inv_confess_trial_deny`,`偵查自白、審理否認`]];function _n(e){let t=kt;kt=e;try{return pn()}finally{kt=t}}var vn=[{g:`定義`,id:`DEF_INTENT`,t:`竊盜故意與不法所有意圖`,x:`刑法第320條第1項竊盜罪之成立，除客觀上須有破壞他人對物之持有、建立自己持有支配關係之竊取行為外，主觀上尚須具備竊盜故意及為自己或第三人不法所有之意圖。所謂不法所有意圖，係指行為人欲排除所有人或持有人對物之支配地位，而僭居所有人地位，行使類似所有權人對於物之支配權之意思；其有無，應綜合取得財物之過程與手段、使用時間之久暫、有無就財物為攸關權義或處分之行為等客觀情狀判斷（臺灣高等法院111年度上易字第374號、114年度上易字第748號判決意旨參照）。`},{g:`定義`,id:`DEF_ATT`,t:`既未遂與著手（權力支配說）`,x:`竊盜罪既遂、未遂之區分，以行為人是否已將竊盜客體移入一己實力支配之下為斷。又行為人主觀上基於為自己不法所有之意圖，本於行竊他人財物之意思，客觀上從事於物色他人財物，企趁人不知，移置他人財物於自己實力支配之下，即屬已著手實行竊盜行為，至有無果然取得他人財物，僅屬既、未遂之別（最高法院106年度台上字第2010號判決意旨參照）。惟加重竊盜罪仍以著手竊取他人動產為實行行為，如僅著手於刑法第321條第1項各款之加重條件行為而尚未搜尋財物，仍屬預備階段（最高法院108年度台非字第30號、109年度台非字第36號判決意旨參照）。本件被告已接近並翻找、搜尋財物，即已著手於竊盜行為之實行，惟未得逞，為未遂犯。`},{g:`論罪`,id:`C`,t:`侵入住宅／有人居住之建築物（§321Ⅰ①）`,x:`刑法第321條第1項第1款將住宅與建築物併列，前者指人類日常住居生活作息之場所；後者指住宅以外上有屋面，周有門壁，足蔽風雨，供人出入，且定著於土地之工作物；所謂侵入，指未得允許擅自進入非公共場所或非公眾得出入之場所（最高法院101年度台非字第140號判決意旨參照）。所謂有人居住之建築物，祇須為人所居住之處所為已足，不以行竊時有人在內為必要，亦不以每房每室均有人居住為限（臺灣高等法院高雄分院112年度上易字第273號、臺灣高等法院111年度上易字第533號判決意旨參照）。又侵入住宅既為加重竊盜之加重條件，已結合於加重竊盜之罪質中，自不另論刑法第306條第1項之罪（最高法院92年度台非字第6號判決意旨參照）。`},{g:`論罪`,id:`D`,t:`毀越門窗、牆垣、安全設備（§321Ⅰ②）`,x:`刑法第321條第1項第2款所謂「毀越」，係指毀損或超越、踰越而言；所謂「越」，係指越入，如係走入或以鑰匙開鎖啟門入室，均不得謂之越（最高法院93年度台上字第6687號、95年度台上字第4340號判決意旨參照）。是僅毀損門窗或安全設備者，應論以「毀壞」；僅攀越者論以「踰越」；毀損後並自破壞處越入者，始為「毀越」，判決主文須與事實相符（最高法院93年度台上字第6727號判決意旨參照）。所謂「其他安全設備」，指門窗、牆垣以外，依社會通常觀念足認防盜之設備，諸如圍籬、鐵皮圍牆、格柵鋁窗均屬之（臺灣高等法院臺中分院114年度上易字第972號、115年度上易字第241號、臺灣高等法院臺南分院111年度上易字第175號判決意旨參照）；惟汽車為動產，其車窗雖具防閑功能，仍非本款所稱之安全設備（最高法院85年度台非字第313號判決意旨參照）。`},{g:`論罪`,id:`E`,t:`攜帶兇器（§321Ⅰ③）`,x:`刑法第321條第1項第3款所謂兇器，其種類並無限制，凡客觀上足對人之生命、身體、安全構成威脅，具有危險性者均屬之，且祇須行竊時攜帶此種具有危險性之兇器為已足，並不以攜帶之初有行兇之意圖為必要（最高法院79年台上字第5253號判決先例意旨參照）；亦不以取出兇器犯之為必要（最高法院112年度台上字第5344號判決意旨參照），兇器縱置放一旁而處於隨時可取用之狀態，或係在犯罪現場隨手取得者，亦屬攜帶（最高法院113年度台上字第3293號判決意旨參照）；兇器縱未扣案，仍得依卷內影像等證據判斷其性質（最高法院112年度台上字第2375號判決意旨參照）。本件被告所持之{TOOL}，質地堅硬，客觀上足以對人之生命、身體構成威脅，自屬兇器。`},{g:`論罪`,id:`F_A`,t:`結夥三人以上——在場（含附近把風接應）計入`,x:`刑法分則或刑法特別法規定中所謂結夥二人或三人以上之犯罪，應以在場共同實行或在場參與分擔實行犯罪之人為限，並不包括同謀共同正犯在內（最高法院76年台上字第7210號判決先例意旨參照）；所稱以在場共同實行或在場參與分擔實行犯罪之人為限，旨在排除同謀共同正犯，非謂僅限在犯罪場所之人始計入結夥人數，縱未在犯罪場所之內，但在附近或經聯繫得及時到場馳援之把風或接應者，既足以排除犯罪障礙或助成犯罪之實現，仍應計入結夥之內（最高法院112年度台上字第855號、112年度台上字第4999號、114年度台上字第32號、114年度台上字第2432號判決意旨參照）。本件在場共同實行或於附近把風、接應者已達三人以上，該當刑法第321條第1項第4款之加重條件。`},{g:`論罪`,id:`F_B`,t:`結夥三人以上——事前同謀而未在場者不計入`,x:`刑法分則規定之結夥三人以上犯罪，應以在場共同實行或在場參與分擔實行犯罪之人為限，不包括同謀共同正犯在內（最高法院76年台上字第7210號判決先例意旨參照）；在附近把風、接應而可及時到場馳援者固應計入（最高法院114年度台上字第2432號判決意旨參照），惟本件〔共犯〕僅事前同謀，於著手前即已離去，未在附近把風或接應，自不得計入結夥人數。`},{g:`論罪`,id:`G`,t:`車站、公眾運輸（§321Ⅰ⑥）`,x:`被告係在{P6}行竊，屬刑法第321條第1項第6款所定在車站或供公眾運輸之舟、車、航空機內犯之，該當該款之加重條件（臺灣高等法院112年度上易字第896號、臺灣高等法院臺南分院113年度上易字第701號、臺灣高等法院115年度上易字第312號判決意旨參照）。`},{g:`論罪`,id:`H`,t:`數款加重條件併存`,x:`被告一竊盜行為同時該當刑法第321條第1項{KS}之加重條件，仍僅成立一加重竊盜罪。`},{g:`論罪`,id:`I`,t:`竊佔（§320Ⅱ）`,x:`刑法第320條第2項竊佔罪，以行為人意圖為自己或第三人不法之利益，客觀上破壞他人對不動產之占有支配關係，並建立自己之占有支配關係為要件，其占有支配須具排他性及繼續性，侵害行為須足以造成所有人在事實上無法使用或使用極為困難（最高法院110年度台上字第5114號判決意旨參照）。又竊佔罪為即成犯，於竊佔行為完成時犯罪即已成立，其後之繼續竊佔乃狀態之繼續，而非行為之繼續（最高法院66年台上字第3118號判決先例意旨參照）。`},{g:`選用`,id:`F_MID`,t:`事中參與者計入結夥人數`,x:`共同正犯之成立不以全程參與為必要，於他人實施犯罪中途始基於共同意思加入參與者，亦成立共同正犯（最高法院110年度台上字第3060號判決意旨參照），其既在場參與分擔實行，亦應計入結夥人數（臺灣高等法院111年度上易字第533號判決意旨參照）。`},{g:`選用`,id:`E_ALT1`,t:`不知同夥攜帶工具→不論兇器`,x:`依卷內事證，無從證明被告事前知悉共犯下手時攜帶客觀上可供兇器使用之工具，即難令被告就攜帶兇器之加重條件負責（臺灣高等法院114年度上易字第164號判決意旨參照）。`},{g:`選用`,id:`E_ALT2`,t:`扣案工具與行竊無關聯→不論兇器`,x:`扣案工具之查扣時間距行竊時已有數日，期間被告仍頻繁外出，無從認定被告行竊時即攜帶該工具，依罪疑唯輕原則，不論以攜帶兇器之加重條件（臺灣高等法院高雄分院113年度上易字第47號判決意旨參照）。`},{g:`選用`,id:`C_ALT`,t:`因他故侵入後起意→普通竊盜`,x:`侵入住宅竊盜須以侵入之初即具竊盜故意為必要，如因他故侵入後始乘機起意竊盜，僅成立普通竊盜罪（臺灣高等法院111年度原上易字第15號判決意旨參照）。`},{g:`選用`,id:`J1`,t:`毀越門窗為結合犯，不另論毀損`,x:`刑法第321條第1項第2款乃同法第354條毀損罪與竊盜罪之結合犯，被告毀損門窗或安全設備之行為已結合於加重竊盜之罪質中，縱被害人提出毀損告訴，亦不另論毀損罪（最高法院92年度台非字第6號判決意旨參照）。`},{g:`選用`,id:`J2`,t:`破壞車窗等非安全設備→與毀損想像競合`,x:`汽車車窗非刑法第321條第1項第2款之安全設備（最高法院85年度台非字第313號判決意旨參照）。被告破壞他人物品之目的在竊取財物，係基於單一行竊決意，其毀損行為與竊盜行為局部重疊，為一行為觸犯竊盜罪及刑法第354條毀損他人物品罪，具有行為局部同一性及密切關聯性（最高法院102年度台上字第942號判決意旨參照），為想像競合犯，應依刑法第55條前段從一重之竊盜罪處斷，並於量刑時審酌輕罪之不法內涵（臺灣高等法院111年度上易字第836號、臺灣高等法院臺中分院111年度上易字第1089號判決意旨參照）。`},{g:`選用`,id:`J3`,t:`侵入無人居住之建築物→與§306想像競合`,x:`被告侵入他人建築物之行為，另犯刑法第306條第1項之無故侵入他人建築物罪，與所犯竊盜罪間為一行為觸犯數罪名之想像競合犯，應依刑法第55條前段從一重處斷（臺灣高等法院臺南分院112年度上易字第201號判決意旨參照）。`},{g:`選用`,id:`K1`,t:`接續犯`,x:`被告於密切接近之時間、地點，數度搬運財物，侵害同一被害人之財產法益，各行為獨立性極為薄弱，依一般社會健全觀念難以強行分開，應視為數個舉動之接續施行，論以接續犯之一罪（臺灣高等法院臺中分院112年度上易字第443號判決意旨參照）。`},{g:`選用`,id:`K3`,t:`一行為竊取多人之物而不知→一罪`,x:`被告行竊時主觀上僅知竊取現場財物，不知所有權人有多人，依其單一竊盜故意及行為，僅論以一竊盜罪（臺灣高等法院臺中分院112年度上易字第443號判決意旨參照）。`},{g:`選用`,id:`K3B`,t:`侵害所有人與管領人→想像競合`,x:`被告以一竊盜行為，同時侵害財物所有權人及管領權人之法益，為想像競合犯，應依刑法第55條規定從一重處斷（臺灣高等法院臺中分院115年度上易字第29號判決意旨參照）。`},{g:`選用`,id:`K4`,t:`贓物搬離後再度侵入→另行起意`,x:`被告於贓物全數搬離後再度侵入搜尋財物，已屬另行起意，應另論一罪（臺灣高等法院臺中分院112年度上易字第443號判決意旨參照）。`},{g:`選用`,id:`I_ACQ`,t:`竊佔不罰過失`,x:`刑法第320條第2項竊佔罪不處罰過失犯，被告越界占用面積非大、兩地間無明顯界線，無從排除過失不知地界之可能；竊佔罪為即成犯，亦不因嗣後鑑界知悉地界而轉為故意（臺灣高等法院高雄分院113年度上易字第187號判決意旨參照）。`},{g:`科刑`,id:`REC_ADD`,t:`累犯——加重`,x:`被告前因{PRIOR}，經法院判處有期徒刑確定，於{PDATE}執行完畢，有前案判決、執行指揮書及法院前案紀錄表在卷可稽，其於受徒刑執行完畢後5年內故意再犯本件有期徒刑以上之罪，為累犯。檢察官已就前開累犯事實及應加重其刑事項為主張並具體指出證明方法（最高法院110年度台上大字第5660號裁定意旨參照），本院審酌被告前案與本案罪質相同，足見其刑罰反應力薄弱，依司法院釋字第775號解釋意旨，加重其最低本刑並無罪刑不相當之情形，爰依刑法第47條第1項規定加重其刑。`},{g:`科刑`,id:`REC_NO`,t:`累犯——不加重`,x:`被告前因{PRIOR}，經法院判處有期徒刑確定，於{PDATE}執行完畢，其於5年內故意再犯本件有期徒刑以上之罪，固構成累犯，惟前案與本案罪質、犯罪型態及侵害法益均有不同，難認被告有特別惡性或刑罰反應力薄弱之情，依司法院釋字第775號解釋意旨，不予加重其刑，僅於量刑時審酌其素行（臺灣高等法院臺中分院112年度上易字第384號判決意旨參照）。`},{g:`科刑`,id:`REC_NC`,t:`累犯——檢察官未主張`,x:`被告構成累犯之事實及應加重其刑之事項，均應由檢察官主張並具體指出證明之方法（最高法院110年度台上大字第5660號裁定意旨參照）。本件檢察官未就被告構成刑法第47條第1項累犯之事實為主張或具體指出證明方法，本院不予論以累犯，僅將被告之前科素行列為刑法第57條第5款之量刑審酌事項。`},{g:`科刑`,id:`REC_PV`,t:`非累犯——前案尚未執行完畢（假釋撤銷／定應執行刑）`,x:`按刑法第47條第1項累犯之成立，以受徒刑之執行完畢或一部之執行而赦免後，5年以內故意再犯有期徒刑以上之罪為要件。被告前案{PRIOR}，{PVW}，前案徒刑於本件犯罪時尚未執行完畢，自不構成累犯（最高法院111年度台非字第67號、103年度台非字第32號、113年度台非字第94號判決意旨參照）。`},{g:`科刑`,id:`ATT`,t:`未遂減輕`,x:`被告已著手竊盜行為之實行而不遂，為未遂犯，所生危害較既遂犯為輕，爰依刑法第25條第2項規定，按既遂犯之刑減輕之。`},{g:`科刑`,id:`STOP`,t:`中止未遂`,x:`被告已著手竊盜行為之實行，因己意中止而未遂，為中止未遂，爰依刑法第27條第1項前段規定減輕其刑。`},{g:`科刑`,id:`S19`,t:`刑法第19條第2項`,x:`經本院囑託{HOSP}鑑定，結果認被告罹患{DIAG}，於行為時依其辨識而行為之能力顯著減低，爰依刑法第19條第2項規定減輕其刑。`},{g:`科刑`,id:`S19N`,t:`刑法第19條——不適用`,x:`被告雖提出就醫資料，惟其於警詢、偵訊時對行竊過程、動機均能清楚說明，行為時意識清楚，辨識行為違法及依其辨識而行為之能力均未達顯著減低之程度，無刑法第19條規定之適用（臺灣高等法院113年度上易字第73號判決意旨參照）。`},{g:`科刑`,id:`S62`,t:`自首`,x:`被告於有偵查犯罪職權之公務員知悉其犯行前，主動向{POL}坦承犯行，願接受裁判，合於自首之要件，爰依刑法第62條前段規定減輕其刑。`},{g:`科刑`,id:`S59`,t:`刑法第59條——適用`,x:`本件被告所竊財物價值不高，犯罪情節尚屬輕微，所犯之罪法定最輕本刑為有期徒刑6月，縱科以最低度刑仍嫌過重，客觀上足以引起一般同情，爰依刑法第59條規定酌減其刑（臺灣高等法院112年度上易字第420號、112年度上易字第1592號判決意旨參照）。`},{g:`科刑`,id:`S59N`,t:`刑法第59條——不適用`,x:`被告正值青壯，非無謀生能力，竟以前揭手段行竊，犯罪情狀並無特殊原因與環境足以引起一般同情，縱科以法定最低度刑亦無情輕法重之情形，自無刑法第59條規定之適用（臺灣高等法院113年度上易字第676號、112年度上易字第59號判決意旨參照）。`},{g:`無罪`,id:`ACQ_STD`,t:`無罪判決通則`,x:`按犯罪事實應依證據認定之，無證據不得認定犯罪事實；不能證明被告犯罪者，應諭知無罪之判決，刑事訴訟法第154條第2項、第301條第1項分別定有明文。又檢察官就被告犯罪事實，應負舉證責任，並指出證明之方法，刑事訴訟法第161條第1項亦有明文；其所提出之證據不足為被告有罪之積極證明，或其指出證明之方法無從說服法院以形成被告有罪之心證者，基於無罪推定原則，自應為被告無罪判決之諭知。`},{g:`無罪`,id:`ACQ_END`,t:`無罪結論`,x:`綜上所述，檢察官所舉證據，尚未達於通常一般之人均不致有所懷疑，而得確信其為真實之程度，不能證明被告犯罪，依前揭說明，自應為無罪之諭知。`}],yn=[{id:`D1`,t:`以為是遺失物而拾取`,say:`我以為那是別人遺失的東西才撿走`,r:`被告雖辯稱以為{物}係他人遺失之物，惟所謂遺失物，係指非出於本人之意思而喪失其持有，且現無人持有之物。本件{物}係被害人置放於{處所}，仍在被害人或該處管理人得以支配之範圍內，並未脫離持有，自非遺失物；況被告取得後未交由現場人員或送交警察機關招領，反逕行攜離，足認其主觀上具有排除他人支配、據為己有之不法所有意圖，所辯不足採信（臺灣高等法院113年度聲再字第8號裁定所載原確定判決理由參照）。`,a:`被告辯稱係拾得他人遺失之物等語。查{物}於被告取得前已脫離被害人之持有，被告事後〔已送交／送回〕失主，{物}內財物亦無確實證據證明係被告取走。竊盜罪與侵占遺失物罪之區別，在於行為人取得時該物是否仍在持有人之管領力範圍內（最高法院109年度台上字第1283號判決意旨參照）；且二罪均以不法所有意圖為要件，未即時送交警察機關，尚不能逕行推論行為人有不法所有意圖（臺灣高等法院高雄分院112年度上易字第305號、臺灣高等法院114年度上易字第249號判決意旨參照）。是被告所辯尚非全然無據，檢察官所舉證據不足以證明被告有竊盜之故意及不法所有意圖。〔如認被告具不法所有意圖而僅物已脫離持有，二罪基本社會事實同一，應依刑事訴訟法第300條變更起訴法條為刑法第337條，不得逕諭無罪（最高法院105年度台非字第162號判決意旨參照）〕`,ref:{r:`DEF_INTENT`,a:`DEF_INTENT`}},{id:`D2`,t:`誤認係自己之物`,say:`我以為那是我自己的東西，拿錯了`,r:`被告雖辯稱誤認{物}為其所有，惟{物}之外觀、重量與被告所稱之物明顯有別，被告取走前未為任何查證，亦未能提出其曾持有相類物品之證據，所辯前後不一；且被告取得後並未於發現有誤時主動歸還，悖於常情，足認其係明知非己所有而仍取走，具竊盜故意及不法所有意圖（臺灣高等法院113年度上易字第1273號判決意旨參照）。`,a:`被告辯稱誤認{物}為自己所有等語。查{物}屬外觀常見之物，與被告所有之物相似，客觀上確有誤認之可能；被告取物時公然為之，無遮掩、閃避監視器或緊張觀望之舉，與一般竊盜者心虛遮掩之常情有違，且事後知悉誤取即主動歸還（臺灣高等法院111年度上易字第374號、112年度上易字第1448號、112年度上易字第673號、113年度上易字第2022號判決意旨參照）。苟無竊盜之犯意，縱有誤取他人財物之行為，亦不構成竊盜罪，本件尚難排除被告確係誤取之合理懷疑。`,ref:{r:`DEF_INTENT`,a:`DEF_INTENT`}},{id:`D3`,t:`只是借用（使用竊盜）`,say:`我只是暫時借用，本來就打算歸還`,r:`被告雖辯稱僅係借用等語。按使用竊盜係指行為人自始即無不法所有意圖，基於暫時利用他人之物之目的，且有返還之意思，並於客觀上確有返還行為者而言。被告取走{物}後並未歸還原處，亦未以任何方式告知所有人，而係〔持續使用至遭查獲／任意棄置他處〕，顯以所有人自居，排除原所有人之支配，具有不法所有意圖，與使用竊盜迥不相同；縱其事後歸還，因竊盜罪為即成犯，亦不影響犯罪之成立；必自客觀上觀察足認有真摯返還之意思，僅返還前之一時占用，始可認無不法所有意圖，倘基於事後隨意棄置之心態，致難以期待權利人自行尋回，即難謂無不法所有意圖（最高法院110年度台上字第2462號判決意旨參照；臺灣高等法院臺中分院112年度上易字第384號、臺灣高等法院112年度上易字第1065號、臺灣高等法院臺南分院114年度上易字第227號判決意旨參照）。`,a:`被告辯稱僅係暫時借用等語。查被告取用{物}之時間短暫，使用後即放回原處，{物}亦無明顯之效能或價值減損，對原所有人之支配管領並未造成顯著妨礙，綜合取得過程、使用時間及事後處置等客觀情狀，足認其有真摯返還之意思，難認被告主觀上有排除所有人支配、據為己有之不法所有意圖，屬學理上之使用竊盜，非刑法非難之對象（最高法院100年度台上字第3232號、110年度台上字第2462號判決意旨參照）。`,ref:{r:`DEF_INTENT`,a:`DEF_INTENT`}},{id:`D4`,t:`監視器中之人不是我`,say:`監視器畫面中的人不是我`,r:`被告雖否認為行為人，惟監視器錄影畫面中竊嫌之衣著、身形、所騎乘之交通工具，核與被告當日〔住處監視器／搭乘大眾運輸〕所攝得之特徵相符，且被告持用之行動電話於案發時段之基地台位置即在案發地點附近；認定犯罪事實所憑之證據，不以直接證據為限，綜合各項間接證據本於推理作用認定犯罪事實，如未違背經驗及論理法則，即非法所不許（臺灣高等法院111年度上易字第775號、112年度上易字第1065號判決意旨參照）。被告所辯，不足採信。`,a:`公訴意旨固以監視器錄影畫面為據。惟經本院勘驗，畫面〔模糊未攝得面容／前後服裝、隨身物品明顯不同〕，無從確認竊嫌與被告為同一人；被害人亦無法指認，現場復未採得被告之指紋或生物跡證。至被告雖有竊盜前科，基於習性推論禁止之法則，亦不得以其品格證據推論本件犯罪事實（臺灣高等法院臺中分院111年度上易字第375號、臺灣高等法院113年度上易字第334號、111年度上易字第219號判決意旨參照）。是依卷內事證，尚有合理懷疑存在。`,ref:{r:``,a:`ACQ_STD`}},{id:`D5`,t:`物品是他人給的／買來的`,say:`東西是別人給我的（或我向別人買的），不是我偷的`,r:`被告雖辯稱{物}係〔他人交付／向他人購得〕，惟其就交付者之姓名、交付時地前後所述不一，亦未能提出任何交易憑據；且其持有{物}之時間與失竊時間密接，並有〔監視器畫面〕可證其於案發時出現在現場，所辯顯係臨訟卸責之詞，不足採信。`,a:`公訴意旨固以被告持有{物}為據，惟被害人未目睹行竊過程，卷內亦無證據證明被告為實施竊取行為之人，單憑被告事後持有贓物之事實，尚不能推認其即為竊盜行為人（臺灣高等法院臺中分院113年度上易字第336號判決意旨參照）。`,ref:{r:``,a:`ACQ_STD`}},{id:`D6`,t:`進入現場另有他故、未著手`,say:`我進去只是為了休息（找東西），沒有要偷`,r:`被告雖辯稱進入{處所}並非為行竊，惟其所辯理由顯與常情有違，被告復自承曾看見{處所}之財物，現場物品並有遭翻動之痕跡，足認其已有物色、搜尋財物之動作而著手竊盜，所辯不足採信（臺灣高等法院臺中分院114年度上易字第206號、臺灣高等法院花蓮分院111年度原上易字第25號、臺灣高等法院高雄分院113年度原上易字第7號判決意旨參照）。`,a:`公訴意旨固認被告已著手竊盜。惟加重竊盜罪之著手，以行為人已以行竊之意思接近財物並進而物色財物為準，如僅著手於刑法第321條第1項各款之加重條件行為，尚不得以加重竊盜未遂論；依卷內證據，僅足證明被告曾進入{處所}，並無證據顯示其已接近財物或開始物色、搜尋財物，尚屬預備階段，刑法並不處罰（臺灣高等法院113年度上易字第334號、111年度上易字第918號判決意旨參照）。`,ref:{r:`DEF_ATT`,a:`ACQ_STD`}},{id:`D7`,t:`不知同夥攜帶工具`,say:`我不知道同夥身上帶著工具`,r:`被告雖辯稱不知共犯攜帶工具，惟被告與共犯事前共同謀議前往行竊，〔該工具係放置於被告駕駛之車內／共犯於被告面前持以破壞〕，被告對其攜帶兇器之情當有認識，自應就攜帶兇器之加重條件共同負責（臺灣高等法院臺中分院114年度上易字第888號判決意旨參照）。`,a:`依共犯所證，其所持工具係放置於衣褲口袋內，外觀上無從察覺，卷內復無證據證明被告事前知悉共犯下手時攜帶客觀上可供兇器使用之工具，即難令被告就攜帶兇器之加重條件負責（臺灣高等法院114年度上易字第164號判決意旨參照）。`,ref:{r:`E`,a:`E_ALT1`}},{id:`D8`,t:`只是載送、未在現場`,say:`我只是開車載他們，沒有在現場`,r:`被告雖辯稱僅係載送，惟其駕車搭載共犯前往現場，於共犯行竊期間在附近等候把風，事後再接應載離並分得贓物，顯係以自己犯罪之意思參與分擔，應論以共同正犯；又結夥三人以上竊盜罪重在於犯罪現場共同實行或分擔，在附近把風、接應而可即時到場者，亦應計入結夥人數（最高法院112年度台上字第4999號、114年度台上字第2432號判決意旨參照）。`,a:`被告僅駕車搭載共犯前往，於共犯著手前即先行離去，未在場共同實行或參與分擔，並非在附近把風或可及時到場接應之人，依最高法院76年台上字第7210號判決先例、114年度台上字第2432號判決意旨，結夥三人以上應以在場共同實行或在場參與分擔實行犯罪之人為限（含附近把風接應者），不包括同謀共同正犯，被告不得計入結夥人數（臺灣高等法院臺南分院113年度上易字第382號判決同旨）。`,ref:{r:`F_B`,a:`F_A`}},{id:`D9`,t:`因他故侵入後才起意`,say:`我進去是為了其他事情，進去後才臨時拿東西`,r:`被告雖辯稱侵入係為他事，惟其於侵入前即〔攜帶工具、選擇深夜無人之時段〕，侵入後即直接前往{處所}搜尋財物，所竊者復為易於變現之物，足認其侵入之初即具竊盜故意，所辯不足採信。`,a:`侵入住宅竊盜須以侵入之初即具竊盜故意為必要，如因他故侵入後始乘機起意竊盜，即難以該罪論處。依卷內事證，被告侵入之初係基於〔　〕之意思，於屋內所取者僅為價值低微之物，與一般行竊者以高單價、易變現物品為目標之常情有違，無從認定其侵入之初即有竊盜犯意，僅能論以普通竊盜罪（臺灣高等法院111年度原上易字第15號判決意旨參照）。`,ref:{r:`C`,a:`C_ALT`}},{id:`D10`,t:`忘記結帳`,say:`我只是忘記結帳`,r:`被告雖辯稱忘記結帳，惟其將{物}藏放於〔衣物內／自備提袋夾層〕，〔並拆除防盜扣〕，結帳時僅取出其他商品，遭店員攔查時復〔拒絕檢查／欲逃離〕，與一時疏忽之情形迥異，足認其具竊盜故意。`,a:`被告將{物}與其他商品同置於自備提袋內，{物}體積扁平不易察覺，結帳時僅取出部分商品，嗣遭賣場人員檢查時坦然配合，主動打開提袋供檢視，並無掩飾或逃離之舉；且{物}裝有防盜磁扣，被告若有竊盜犯意，當無坦然通過感應門之理，綜合判斷，難認其具竊盜故意及不法所有意圖（臺灣高等法院114年度上易字第748號判決意旨參照）。`,ref:{r:`DEF_INTENT`,a:`DEF_INTENT`}},{id:`D11`,t:`先前自白不實`,say:`我先前的自白不是真的`,r:`被告雖辯稱先前自白不實，惟被告於〔偵查中〕經明確告知訊問內容後，坦承犯行並主動交待犯罪細節及贓物去向，核與監視器畫面、查獲經過等補強證據相符，其事後空言翻異，不足採信（臺灣高等法院臺中分院113年度上易字第215號判決意旨參照）。`,a:`被告之自白不得作為有罪判決之唯一證據，仍應調查其他必要之證據以察其是否與事實相符。經本院勘驗警詢錄影，被告警詢時精神明顯不濟，所述侵入方式與現場跡證不符，其自白之真實性已有重大瑕疵，而卷內其餘證據至多僅能證明被害人遭竊之事實，不足以補強被告之自白（臺灣高等法院111年度上易字第219號判決意旨參照）。`,ref:{r:``,a:`ACQ_STD`}},{id:`D12`,t:`以為是廢棄物／無主物`,say:`我以為那是別人丟棄不要的東西`,r:`被告雖辯稱以為{物}係廢棄物，惟{物}〔包裝完整、具經濟價值〕，{處所}並有〔有人使用〕之跡象，常人一望即知非拋棄之無主物；被告復選擇深夜時段取物，所辯悖於常情，不足採信（臺灣高等法院高雄分院112年度上易字第273號判決意旨參照）。`,a:`{物}放置之處所、狀態〔堆置於路旁且無任何標示〕，客觀上確有被誤認為廢棄物之可能，被告亦係公然取物，無遮掩行跡之舉，尚難認其主觀上明知{物}為他人所有而有竊盜故意。`,ref:{r:`DEF_INTENT`,a:`DEF_INTENT`}}],bn={lootU:{l:`未扣案犯罪所得（未發還）`,v:`犯罪所得{d}沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。`,seized:!1,r:`被告竊得之{d}，為其犯罪所得，未據扣案，亦未實際合法發還被害人，應依刑法第38條之1第1項前段、第3項規定宣告沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。`},lootS:{l:`扣案犯罪所得（未發還）`,v:`如附表二編號{n}所示之犯罪所得沒收。`,seized:!0,r:`扣案之{d}，為被告之犯罪所得，且未發還被害人，應依刑法第38條之1第1項前段規定宣告沒收。`},ret:{l:`已發還被害人`,v:null,seized:!1,r:`被告竊得之{d}，業經發還被害人，有贓物認領保管單在卷可稽，依刑法第38條之1第5項規定，不予宣告沒收或追徵。`},comp:{l:`已和解賠償（足額）`,v:null,seized:!1,r:`被告竊得之{d}，固為其犯罪所得，惟被告已與被害人達成和解並賠償完畢，被害人之損害已獲填補，如再宣告沒收，將使被告遭受雙重剝奪，爰不予宣告沒收或追徵（最高法院106年度台上字第1131號判決意旨參照）。`},compP:{l:`部分賠償（沒收差額）`,v:`犯罪所得{d}沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額。`,seized:!1,r:`被告竊得財物之價值逾其已賠償被害人之金額，就已賠償部分固不再宣告沒收，惟其犯罪所得超過實際賠償部分即{d}，仍應依刑法第38條之1第1項前段、第3項規定宣告沒收，於全部或一部不能沒收或不宜執行沒收時，追徵其價額（最高法院106年度台上字第1131號、108年度台上字第717號判決意旨參照）。`},low:{l:`價值低微／過苛`,v:null,seized:!1,r:`被告竊得之{d}，價值低微，宣告沒收或追徵欠缺刑法上之重要性，爰依刑法第38條之2第2項規定，不予宣告沒收或追徵。`},toolS:{l:`扣案行竊工具（被告所有）`,v:`如附表二編號{n}所示之物沒收。`,seized:!0,r:`扣案之{d}，為被告所有且供本件犯罪所用之物，業據被告供承在卷，依刑法第38條第2項前段規定宣告沒收。`},toolN:{l:`行竊工具未扣案（不沒收）`,v:null,seized:!1,r:`被告持以行竊之{d}，非違禁物，且價值低微，宣告沒收或追徵欠缺刑法上之重要性，依刑法第38條之2第2項規定，不予宣告沒收或追徵。`},cert:{l:`證件、卡片等`,v:null,seized:!1,r:`被告竊得之{d}，具有專屬性，經掛失補發後即失其效用，欠缺刑法上之重要性，依刑法第38條之2第2項規定不予宣告沒收或追徵。`},unrel:{l:`扣案物與本案無關`,v:null,seized:!0,r:`其餘扣案之{d}，無證據證明與本案犯行有關，爰不予宣告沒收。`}},xn=[`lootU`,`lootS`,`ret`,`comp`,`compP`,`low`,`toolS`,`toolN`,`cert`,`unrel`],Sn=Object.fromEntries(vn.map(e=>[e.id,e])),Cn=Object.fromEntries(yn.map(e=>[e.id,e]));function wn(){return{res:`g`,kind:`move`,stage:`done`,k1:!1,k1t:`住宅`,k2:!1,k2a:`毀越`,k2b:`門窗`,k2o:``,k3:!1,tool:``,k4:!1,fAB:`A`,k5:!1,k5d:`火災`,k6:!1,p6:``,partners:``,date:``,place:``,victim:``,item:``,value:``,means:``,fail:``,spot:``,disc:``,iref:``,evp:``,pvt:`parole`,bz:!1,bzno:``,bzrel:`接續犯之實質上一罪`,conf:`c`,admit:``,evid:``,den:{},mods:[],recid:`0`,prior:``,pdate:``,
