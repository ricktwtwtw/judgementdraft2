所謂補強證據，須與被害人指述具有相當程度關聯性，且非屬與被害人指述具同一性之累積證據；證人陳述之內容係轉述聽聞自被害人陳述被害經過者，性質上與被害人之陳述同一，自不具補強證據之適格。`},{k:`lc`,t:`【法則】共犯自白須補強`,on:!1,x:`按被告或共犯之自白，不得作為有罪判決之唯一證據，仍應調查其他必要之證據，以察其是否與事實相符，刑事訴訟法第156條第2項定有明文。共犯不利於己之陳述，除須無瑕疵可指外，並應有補強證據佐證，不得專憑該項陳述作為其他共犯犯罪事實之認定；共同被告或共犯之自白縱內容一致，本質上仍屬自白，不得互為補強。`},{k:`lb`,t:`【法則】購毒者指證須補強`,on:!1,x:`按購毒者指證某人販賣毒品，因有邀刑法減刑寬典而為不實陳述之可能，其證詞之憑信性本不及一般證人，不得作為有罪判決之唯一證據，仍須有補強證據以擔保其陳述之真實性；以通訊監察譯文為補強證據者，其對話內容須依社會通念足以辨別係交易毒品，始具關聯性。`},{k:`in`,t:`指述前後不一`,on:!0,x:`關於{{issue}}，{{who}}於警詢時證稱〔甲陳述〕（見〔警卷〕第〔　〕頁），於偵查中改稱〔乙陳述〕（見〔偵卷〕第〔　〕頁），於本院審理時復證稱〔丙陳述〕（見本院卷第〔　〕頁），就此攸關犯罪成立之重要情節，前後所述顯有歧異，其指述已有瑕疵。`},{k:`de`,t:`事隔愈久陳述愈詳細`,on:!1,x:`{{who}}初次陳述時僅概略提及〔　〕，嗣於事隔更久之偵審程序，反能逐一詳述各次行為之時間、地點及手法，與一般記憶隨時間淡化之經驗法則有違，其指述之憑信性已有疑義。`},{k:`mo`,t:`另案查獲、邀減刑動機`,on:!1,x:`證人〔姓名〕係因另案為警查獲始供出毒品來源，有為邀刑法減刑寬典而為不實陳述之可能，其證詞之憑信性本不及一般證人。`},{k:`ac`,t:`轉述證言屬累積證據`,on:!0,x:`證人〔姓名〕於本院審理時證稱：〔　〕等語，然其並未親自見聞案發經過，所述係聽聞自{{who}}之轉述，屬與{{who}}陳述具同一性之累積證據，不具補強證據之適格。`},{k:`ch`,t:`對話紀錄僅單方陳述／安撫語意`,on:!1,x:`{{who}}與〔姓名〕之LINE對話紀錄，內容僅為{{who}}單方陳述被害情節，亦屬累積證據；至被告於對話中稱〔「對不起」等語〕，依前後文脈絡，係因{{who}}表達〔負面情緒〕而順應其語意安撫，尚難解為被告自承犯行。`},{k:`wt`,t:`通訊監察譯文無法辨識交易`,on:!1,x:`卷附通訊監察譯文僅有〔「我在門口」等語〕，未提及毒品種類、數量、價金或任何暗語，依社會通念不足以辨別與毒品交易相關，自難作為購毒者指證之補強證據。`},{k:`md`,t:`診斷證明屬自述`,on:!1,x:`卷附〔診斷證明書／病歷〕關於病因之記載，係依{{who}}自述而來，仍屬累積證據；{{who}}身心症狀之成因既有多端，亦無從認定與本案具有關聯。`},{k:`pg`,t:`測謊不得為認定基礎`,on:!1,x:`測謊鑑定不具再現性，且易受受測者人格特質影響，審判上尚不得作為認定犯罪事實之基礎；本件測謊問題復未特定具體時地，無從對應起訴之各次事實。`},{k:`pr`,t:`被告前案不得補強`,on:!1,x:`公訴意旨雖援引被告另案〔　〕之犯罪紀錄，然該案之犯罪時間、成員及手段均與本案不同，復無證據證明屬同一集團所為，自不得作為本案不利於被告認定之補強證據。`},{k:`dn`,t:`辯解未經證明不得反推有罪`,on:!0,x:`被告所辯〔　〕，縱未經其證明，惟檢察官仍應提出積極證據證明被告犯罪至無合理懷疑之程度，尚不能因被告未能提出有利於己之證明，即遽為不利於被告之認定。`}],refs:[[`TPHM,113,上訴,4686,20250327,1`,`臺灣高等法院113年度上訴字第4686號`,`共犯證述不一、前案不得補強`],[`TPHM,113,原侵上訴,6,20240627,1`,`臺灣高等法院113年度原侵上訴字第6號`,`轉述證言、對話紀錄屬累積證據`],[`TPHM,114,侵上訴,35,20250717,1`,`臺灣高等法院114年度侵上訴字第35號`,`道歉對話係安撫語意`],[`TPHM,112,侵上訴,93,20230713,1`,`臺灣高等法院112年度侵上訴字第93號`,`陳述愈趨詳細、測謊`],[`KSHM,113,上訴,642,20241127,1`,`高雄分院113年度上訴字第642號`,`譯文不足辨識毒品交易`],[`SLDM,115,易,55,20260514,1`,`士林地院115年度易字第55號`,`告訴人指訴瑕疵、交接清單不足補強`]]},{id:17,g:`A`,name:`自白虛偽（頂替）`,tag:`警詢自白翻異、受人指示頂罪`,steps:[`列明被告偵查自白與審判翻異`,`共犯證述是否指向被告`,`影像比對行為人外觀`,`勘驗警詢錄影檢驗自白任意性與真實性`,`結論：自白欠缺補強，另提醒檢察官偵辦頂替`],fields:[[`instigator`,`指使頂替之人`,``],[`real`,`真正行為人代稱`,`甲男`],[`codef`,`共犯姓名`,``],[`video`,`影像來源`,`行車紀錄器影像`],[`features`,`行為人外觀特徵`,``]],law:`按被告或共犯之自白，不得作為有罪判決之唯一證據，仍應調查其他必要之證據，以察其是否與事實相符，刑事訴訟法第156條第2項定有明文。其立法目的乃欲以補強證據擔保自白之真實性，排除虛偽自白；倘被告之自白與卷內其他客觀證據不符，且無法排除其係為他人頂替而為虛偽陳述之可能，即不得據以認定犯罪事實。`,mods:[{k:`re`,t:`自白與翻異`,on:!0,x:`被告於警詢及偵查中固坦承犯行，惟於本院審理時否認，辯稱係受{{instigator}}指示為{{real}}頂罪等語。`},{k:`co`,t:`共犯證述未指向被告`,on:!0,x:`共犯{{codef}}於警詢、偵查中均未證稱被告參與本案，於本院審理時更明確證稱{{real}}並非被告等語（見本院卷第〔　〕頁）；〔姓名〕雖曾稱共犯有「〔　〕」，然係聽聞自他人所述，嗣已確認行為人並非被告。`},{k:`vi`,t:`影像比對外觀不同`,on:!0,x:`案發現場{{video}}所攝得之行為人，{{features}}，與被告於製作警詢筆錄時之外觀明顯不同（見〔　〕卷第〔　〕頁）。`},{k:`pv`,t:`勘驗警詢錄影有他人陪同指示`,on:!1,x:`經本院勘驗被告警詢錄影光碟，詢問過程中有一名男子陪同並多次插話，被告屢有眼神飄向該男子之情形；證人即製作筆錄之員警〔姓名〕亦證稱該男子為{{instigator}}，與被告所辯受指示頂替之情節相符，被告警詢自白之真實性顯有疑義。`},{k:`fa`,t:`親屬證述曾被要求頂替`,on:!1,x:`證人〔被告之父〕亦證稱{{instigator}}確曾要求被告頂替他人等語（見本院卷第〔　〕頁）。`},{k:`cn`,t:`結論`,on:!0,x:`綜合卷內證據，無法排除被告係為頂替他人而為虛偽自白之高度可能性，被告之自白既欠缺補強證據擔保其真實性，自不得作為認定其犯罪之依據。`},{k:`pt`,t:`附帶：頂替罪嫌由檢察官處理`,on:!0,x:`至被告是否另涉頂替罪嫌，{{instigator}}是否另涉教唆頂替罪嫌，宜由檢察官依法另行偵查處理，附此敘明。`}],refs:[[`PCDM,111,訴,829,20240123,1`,`新北地院111年度訴字第829號`,`影像外觀不同、共犯否認，頂替無罪`],[`TPHM,113,上訴,159,20240710,1`,`臺灣高等法院113年度上訴字第159號`,`勘驗警詢錄影，自白真實性有疑`]]},{id:5,g:`A`,name:`因果關係／過失不能證明`,tag:`傷害、過失致死`,steps:[`認定被告客觀行為（勘驗錄影）`,`傷害：比對傷勢部位、型態與行為；指出其他成因`,`過失：注意義務是否違反→因果關係、信賴原則`,`鑑定意見歧異之取捨`,`構成要件不該當即毋庸論阻卻違法`],fields:[[`injury`,`告訴人傷勢`,``],[`act`,`被告行為`,``],[`video`,`勘驗標的`,`監視器錄影畫面`]],law:``,mods:[{k:`hv`,t:`【傷害】勘驗結果`,on:!0,x:`被告與告訴人於〔時間〕，在〔地點〕發生肢體衝突，告訴人於案發後經〔醫院〕診斷受有{{injury}}等情，有診斷證明書在卷可稽。惟告訴人所受上開傷勢是否為被告所致，經本院勘驗{{video}}，結果略以：〔勘驗要旨〕（見本院卷第〔　〕頁）。`},{k:`hm`,t:`【傷害】傷勢部位不符、無法排除自傷`,on:!0,x:`依上開勘驗結果，被告{{act}}所及部位為告訴人之〔左後腿〕，與告訴人所受〔左膝正面挫擦傷〕之位置不符；且衝突過程中告訴人〔左腿數度緊貼椅緣／曾跌坐於地背部撞擊機車〕，其傷勢無從排除係衝突中自行碰撞所致。告訴人所受傷害與被告行為間是否具因果關係，既存有合理懷疑，自難遽以傷害罪相繩。`},{k:`hd`,t:`【傷害】毋庸審酌正當防衛`,on:!1,x:`被告固辯稱其係出於正當防衛，惟正當防衛乃阻卻違法事由，以行為該當構成要件為前提；被告被訴傷害部分既無積極證據證明構成要件事實存在，即無再論正當防衛之餘地，附此敘明。`},{k:`nl`,t:`【過失】法則`,on:!1,x:`按刑法上之過失，以行為人對結果之發生應注意、能注意而不注意為要件，並須其過失行為與結果間在客觀上有相當因果關係；縱行為人有行政法規之違規，亦非當然即應負過失之刑事責任，仍須審究該違規與結果間之關聯及結果是否屬注意規範所欲防止之範圍。`},{k:`nd`,t:`【過失】已盡注意義務`,on:!1,x:`依〔中央警察大學〕鑑定書，被告{{act}}時之平均車速約每小時〔　〕公里；被告並於確認後方約〔　〕公尺內無來車後始行〔倒車〕，察覺後方來車時即行煞停（見〔偵卷〕第〔　〕頁），足認被告已盡相當之注意義務。`},{k:`nc`,t:`【過失】介入因素、被害人違規`,on:!1,x:`證人〔姓名〕駕駛之車輛及時減速，未與被告車輛發生碰撞，被害人係因未注意車前狀況、未保持安全距離而追撞〔證人〕減速中之車輛，致生本件結果；被害人自身既違反交通規則，無從主張信賴原則，被告之行為與被害人死傷結果間，亦難認具有相當因果關係。`},{k:`nk`,t:`【過失】鑑定意見取捨`,on:!1,x:`至〔車輛行車事故鑑定會〕鑑定意見認被告有肇事因素，惟該意見未就被告〔車速〕提出具體數據，本院審酌〔中央警察大學〕鑑定書係以客觀數據及逐格影像分析為基礎，較為可採，自難以前開鑑定意見為不利被告之認定。`}],refs:[[`TPHM,114,交上訴,8,20250507,1`,`臺灣高等法院114年度交上訴字第8號`,`緩慢倒車已盡注意、第三人介入`],[`TPHM,113,上訴,1014,20240530,1`,`臺灣高等法院113年度上訴字第1014號`,`傷勢位置不符，毋庸論防衛`],[`TPHM,111,上訴,942,20220427,1`,`臺灣高等法院111年度上訴字第942號`,`無法排除自傷`]]},{id:2,g:`B`,name:`交付帳戶欠缺不確定故意`,tag:`幫助詐欺、幫助洗錢`,skipUnd:!0,steps:[`客觀事實先行認定`,`揭示不確定故意與有認識過失之區別`,`不得以成年人、政府宣導推論；綜合個人條件與處境`,`檢驗欠缺容任之徵象（查證、追問、常用帳戶、無對價、自身受損）`,`處理前案經驗、辯解不一`,`結論：至多重大過失，刑法不罰過失幫助`],fields:[[`account`,`帳戶`,`〔銀行〕帳戶`],[`contact`,`對方暱稱`,`LINE暱稱「〔　〕」之人`],[`purpose`,`交付目的`,`求職`]],law:`按刑法上之故意，分為直接故意與不確定故意，行為人對於構成犯罪之事實，預見其發生而其發生並不違背其本意者，為不確定故意，刑法第13條第2項定有明文；行為人對於構成犯罪之事實，雖預見其能發生而確信其不發生者，則屬有認識之過失（同法第14條第2項）。二者對犯罪事實之發生均有預見，其區別在於前者對結果之發生抱持容任之意欲，後者則確信其不發生。刑法幫助詐欺取財及幫助洗錢罪均不處罰過失，是提供帳戶之人是否成立上開罪名，自須積極證明其交付帳戶時，已預見帳戶將供詐欺及洗錢之用，且未確信係供其他用途，不得僅因帳戶事後遭詐欺集團利用，即推認其主觀上必有幫助犯意。又詐欺集團取得人頭帳戶之手法層出不窮，判斷交付者有無不確定故意，應綜合其年齡、教育程度、工作及生活經驗、身心狀況、交付當時是否居於急迫、輕率、無經驗或難以求助之脆弱處境，以及其與對方之對話磋商過程等一切主客觀情狀審慎認定，不宜以事後理性客觀第三人之角度苛求，亦不得僅以行為人為心智成熟之成年人、政府已廣為宣導防詐為由，遽認其具有幫助犯罪之未必故意。`,mods:[{k:`ob`,t:`客觀事實（置於法則前）`,on:!0,pre:!0,x:`{{contact}}所屬詐欺集團成員取得被告申設之{{account}}（下稱本案帳戶）〔提款卡及密碼〕後，於附表所示時間，以附表所示方式詐騙附表所示告訴人，致其等陷於錯誤而匯款至本案帳戶，旋遭提領一空等情，業據告訴人等於警詢時指述明確，並有本案帳戶開戶資料、交易明細在卷可稽，且為被告所不爭執，此部分事實固堪認定。`},{k:`cs`,t:`供述一致、對方話術`,on:!0,x:`被告自警詢、偵查迄本院審理，均一致供稱係因{{purpose}}，依{{contact}}之指示而交付本案帳戶資料，前後所述並無矛盾。觀諸被告提出之對話紀錄，對方以〔　〕等語取信被告，並傳送〔身分證件照片／借貸契約書〕以為擔保（見〔　〕卷第〔　〕頁），被告所辯非屬無據。`},{k:`fu`,t:`交付後持續追問`,on:!0,x:`被告於交付本案帳戶資料後，仍於〔日期〕至〔日期〕間多次向對方追問〔撥款／工作〕進度（見〔　〕卷第〔　〕頁），足見其確信對方係為{{purpose}}而使用帳戶，與預見帳戶將供犯罪使用而容任其發生之情形迥異。`},{k:`da`,t:`常用帳戶、未領空餘額`,on:!1,x:`本案帳戶係被告平日用以〔領取薪資／政府補助款〕之帳戶，交付時尚有餘額新臺幣〔　〕元未提領，交付後仍有〔補助款〕持續匯入，此與一般出售、出租帳戶者多先將存款提領殆盡、交付閒置帳戶以免自身受損之常情顯然不同。`},{k:`pc`,t:`個人條件、脆弱處境`,on:!1,x:`被告為〔年籍、學歷、職業〕，〔領有身心障礙證明／甫來臺工作語言能力有限／長期住院甫出院〕，其社會經驗及風險辨識能力難與常人等量齊觀，交付時復因〔　〕急需資金，處於經濟弱勢之脆弱處境。`},{k:`nr`,t:`無對價、自身受損`,on:!1,x:`被告並未因交付帳戶獲取任何對價，反致自身帳戶遭警示、餘款遭轉出而受有損害，嗣並主動報警處理，實難想像其已預見帳戶將供詐欺使用而仍甘冒上開風險。`},{k:`vf`,t:`已查證、簽約、註記用途`,on:!1,x:`被告於交付前已〔要求對方傳送身分證件、簽立保管契約〕，並於密碼字條註記〔僅供審核還款使用〕等語，已為相當程度之風險控管，與單純貪圖報酬而隨意提供帳戶予陌生人之情形有別。`},{k:`pp`,t:`前案經驗、辯解不一`,on:!1,x:`公訴意旨雖以〔被告前曾因交付帳戶經不起訴處分／被告偵查中辯稱遺失、審理中改稱交付他人〕為由，認被告應有不確定故意。然〔前案係交付〔　〕家銀行提款卡，與本案態樣顯然不同，不能比附推論〕；且行為人因畏懼追訴而於初詢時未吐實者所在多有，被告辯解縱前後不一，亦不能據以反推其交付時即具犯罪故意。`},{k:`cn`,t:`結論：重大過失不罰`,on:!0,x:`綜上，被告交付本案帳戶資料之舉，固有思慮未周之疏失，或屬重大過失，然此與預見並容任帳戶遭不法使用之不確定故意仍屬有別，刑法既不處罰過失幫助詐欺取財及洗錢，自難以上開罪名相繩。`}],refs:[[`TPHM,114,上訴,1076,20250717,1`,`臺灣高等法院114年度上訴字第1076號`,`貸款受騙、脆弱處境，撤銷改判`],[`TCHM,113,金上訴,386,20240619,1`,`臺中分院113年度金上訴字第386號`,`好友信賴交付`],[`TNHM,113,金上訴,1886,20250313,1`,`臺南分院113年度金上訴字第1886號`,`常用帳戶未領空、重大過失`],[`TPHM,112,上訴,2269,20230712,1`,`臺灣高等法院112年度上訴字第2269號`,`簽約註記用途`],[`TPHM,113,上訴,5930,20250116,2`,`臺灣高等法院113年度上訴字第5930號`,`外籍移工、辯解不一`]]},{id:3,g:`B`,name:`欠缺不法所有意圖（使用竊盜、誤取）`,tag:`竊盜`,skipUnd:!0,steps:[`客觀竊取事實不爭執`,`揭示不法所有意圖與使用竊盜`,`涵攝：時間久暫、耗損、處分、以所有人自居、歸還方式`,`車輛：耗油不另成罪，社維法88條`,`誤取型：事前事後客觀行為`,`自白不改變結論`],fields:[[`item`,`物品`,``],[`use`,`使用情形`,`短暫使用代步`],[`ret`,`歸還方式`,`騎回原處停放`]],law:`按刑法第320條第1項竊盜罪之成立，除客觀上須有竊取他人動產之行為外，主觀上尚須具有為自己或第三人不法所有之意圖。所謂不法所有意圖，係指行為人欲排除原權利人對物之支配，而自居於所有人地位，對物為使用、收益、處分之意思。倘行為人僅一時擅自使用他人之物，並無據為己有之意思，於使用後即予返還，學理上稱為「使用竊盜」，因欠缺不法所有意圖，與竊盜罪之構成要件不符。又行為人有無不法所有意圖，屬其內心狀態，應綜合使用時間之久暫、物之性質、使用後有無耗損或減低其經濟價值、有無為處分行為、有無對外以所有權人自居、是否主動返還及其返還方式等客觀情狀判斷之。`,mods:[{k:`fa`,t:`客觀事實（置於法則前）`,on:!0,pre:!0,x:`被告於〔時間〕，在〔地點〕，未經告訴人同意，取走其所有之{{item}}，嗣於〔時間〕將之{{ret}}等情，為被告所不爭執，核與告訴人於警詢時之指述相符，並有〔監視器錄影畫面擷圖、本院勘驗筆錄〕在卷可稽，此部分事實堪予認定。`},{k:`sh`,t:`短暫使用即歸還`,on:!0,x:`被告取走{{item}}後，僅{{use}}，使用時間約〔　〕，旋即將之{{ret}}，未有任意棄置、轉賣或其他處分行為。被告若有竊盜故意，大可基於自己實力支配而棄置該物，殊無費神將之送回原處之必要；被告此舉足徵其並未以所有權人自居。`},{k:`ow`,t:`未對外以所有人自居`,on:!1,x:`證人〔姓名〕亦證稱被告曾告知該車為〔公司車〕等語，被告並未對外表示為其所有。`},{k:`ga`,t:`車輛：耗油不另成罪、社維法`,on:!1,x:`至被告駕駛期間消耗之油料，乃車輛運作之當然結果，被告之目的在於使用車輛代步，而非竊取油料，自難就此認其具不法所有意圖。況擅自駕駛他人車輛之行為，社會秩序維護法第88條第1款僅處以罰鍰，歷次刑法修正草案擬增訂處罰均未經立法院通過，足見立法者迄今認此類行為以行政罰規範即為已足；若以竊盜罪相繩，將生擅用車輛僅受行政罰，而其必然伴隨之耗油結果反須負刑責之失衡。`},{k:`mi`,t:`誤取型`,on:!1,x:`被告案發當日稍早確曾持〔雨傘〕進入〔地點〕，離去時並未攜傘，嗣返回自傘架取走告訴人之{{item}}，此經本院勘驗監視器畫面屬實（見本院卷第〔　〕頁）；且被告取物時遇有他人經過，並無躲避或異常舉動，其辯稱係誤認為自己所有，尚非無稽。`},{k:`cf`,t:`自白不改變結論`,on:!1,x:`被告雖於〔警詢／準備程序〕時坦承犯行，惟其所坦承者，僅係擅自取用{{item}}之客觀事實，此等事實既不該當竊盜罪之構成要件，自不因被告之自白而為不利於被告之認定。`},{k:`cn`,t:`結論`,on:!0,x:`被告所為固屬未經同意擅用他人之物，其是否另應負民事責任或受行政裁罰，要屬另事，尚難以竊盜罪相繩。`}],refs:[[`KSHM,113,上易,39,20240313,1`,`高雄分院113年度上易字第39號`,`擅駛公司車、耗油`],[`KSHM,112,上易,46,20230510,1`,`高雄分院112年度上易字第46號`,`使用竊盜不罰、自白`],[`TNHM,112,上易,190,20230815,1`,`臺南分院112年度上易字第190號`,`判斷因素`],[`TPHM,112,上易,1448,20231220,1`,`臺灣高等法院112年度上易字第1448號`,`誤拿雨傘`]]},{id:15,g:`B`,name:`肇事逃逸未認識肇事`,tag:`刑法185條之4`,steps:[`客觀：事故、傷害、離去不爭執`,`法則：須認識肇事致人死傷並決意逃離`,`被告供述是否一致`,`勘驗：有無碰撞、車身晃動`,`車損輕微、聲響隔絕、無人示警`,`駕駛舉止無異常；有無逃逸動機`,`被害人推測不足為不利認定`],fields:[[`video`,`勘驗標的`,`後方車輛行車紀錄器錄影`],[`damage`,`被告車損`,`左後保險桿輕微凹陷`],[`drive`,`離去舉止`,`直行`]],law:`按刑法第185條之4之肇事逃逸罪，客觀上須行為人駕駛動力交通工具發生交通事故致人死傷而逃逸，主觀上須行為人對發生交通事故及致人死傷之事實有所認識，並進而決意擅自逃離現場，始足當之；若行為人不知已肇事並致人死傷，縱然離去，亦與本罪之構成要件不合（最高法院107年度台上字第4677號判決意旨參照）。判斷行為人是否知悉肇事，應綜合碰撞力道、車損程度、現場聲響、行為人車內感官狀態、離去時之駕車舉止及現場有無他人示警等客觀情狀認定之。`,mods:[{k:`cs`,t:`被告供述一致`,on:!0,x:`被告自警詢、偵查迄本院審理，均一致供稱未見聞事故發生、未感受到碰撞，係經警方通知後始知等語，前後所述並無矛盾。`},{k:`vd`,t:`勘驗：碰撞不明、無晃動`,on:!0,x:`經本院勘驗{{video}}，結果略以：〔勘驗要旨〕（見本院卷第〔　〕頁）。依勘驗結果，兩車是否確有碰撞，因拍攝角度無從明確觀察；縱有碰撞，碰撞當下被告車身亦無明顯晃動。`},{k:`dm`,t:`車損輕微`,on:!0,x:`被告車輛僅{{damage}}，告訴人機車亦無明顯擦痕，且〔未修繕仍使用迄今〕，足見碰撞力道輕微，被告難以藉由車體震動察覺肇事。`},{k:`sd`,t:`聲響隔絕、無人示警`,on:!0,x:`事故地點車流量大，車輛行駛本即產生引擎、輪胎及風切聲響，被告車窗關閉〔並播放音樂〕，能否透過聽覺感知事故發生，亦有疑義；現場〔義交及員警〕均未吹哨示警或攔阻。`},{k:`dr`,t:`駕駛舉止無異常`,on:!0,x:`被告於事故發生後維持原有車速{{drive}}駛離，並無煞停、遲疑減速或突然加速等異常舉止，與一般知悉肇事者之反應不符，足認其辯稱未發覺事故發生，尚屬可信。`},{k:`mv`,t:`無逃逸動機（保險、調解）`,on:!1,x:`被告有投保〔強制及任意險〕，事後亦已與告訴人調解並給付完畢，益徵其並無肇事逃逸之動機。`},{k:`vs`,t:`被害人推測之詞`,on:!0,x:`告訴人雖證稱認為被告應知悉事故發生，然此屬其個人推測之詞，無從為不利被告之認定。`}],note:`過失傷害部分如經撤回告訴，另於主文諭知公訴不受理（刑訴303條第3款），並說明肇事逃逸部分既經無罪，二者無裁判上一罪關係，應分別諭知。`,refs:[[`TPDM,114,交訴,29,20251009,1`,`臺北地院114年度交訴字第29號`,`變換車道、碰撞不明、車內音樂`],[`TPDM,114,交訴,10,20250625,1`,`臺北地院114年度交訴字第10號`,`後車追撞、力道輕微、有保險`],[`TPDM,114,交訴,42,20251125,1`,`臺北地院114年度交訴字第42號`,`無人示警、一部不受理`]]},{id:14,g:`B`,name:`偽造文書：經授權或不知無權`,tag:`刑法210、215、216`,steps:[`製作權：明示或默示授權`,`董事會授權範圍`,`主觀：是否明知無製作權`,`215條須以自己名義`,`事後同意`],fields:[[`witness`,`證人`,``],[`conduct`,`授權徵象`,`提供所得資料並於申報書簽名確認後繳稅`],[`doc`,`文書`,`〔文書名稱〕`],[`org`,`公司`,`〔公司〕`]],law:`按刑法第210條之偽造私文書罪，以無製作權之人冒用他人名義而製作該文書為要件；如行為人係基於他人之授權委託而製作，即不能謂無製作權，自不成立該罪，而授權之方式，無論出於明示或默示，均無不可（最高法院110年度台上字第663號判決意旨參照）。又偽造私文書罪以行為人主觀上明知無製作權而仍為之為必要，倘行為人誤信已獲授權，即欠缺偽造文書之故意。`,mods:[{k:`im`,t:`默示授權`,on:!0,x:`依證人{{witness}}之證述及卷附〔申報資料〕，告訴人每年均{{conduct}}，足認告訴人至少已默示同意或授權被告製作{{doc}}，被告即屬有製作權之人，自不成立偽造私文書罪。`},{k:`bd`,t:`董事會授權`,on:!1,x:`{{org}}董事會已決議授權被告〔全權處理融資事宜〕，未限縮授權範圍，亦未事後撤銷，被告〔刻製公司大小章、開立帳戶〕係為完成上開決議內容而為之，屬授權範圍內之業務執行，並無隱瞞或欺騙之情事，自不該當偽造印章印文、偽造私文書及行使偽造私文書等罪。`},{k:`kn`,t:`不知無權（罪疑唯輕）`,on:!1,x:`本案除證人{{witness}}之供述外，並無其他事證足證被告主觀上知悉告訴人未授權辦理〔信託及抵押權登記〕；{{witness}}於偵查中更曾稱已告知被告告訴人同意等語，則被告主觀上是否明知無製作權，已非無疑，依罪疑唯輕原則，難認被告有偽造文書之故意。`},{k:`r5`,t:`215條須以自己名義`,on:!1,x:`刑法第215條業務上文書登載不實罪，係指從事業務之人以自己名義製作內容不實之業務文書；{{doc}}係以告訴人等名義製作，非以被告自己名義製作，縱內容有所出入，亦與該罪構成要件不符。`},{k:`af`,t:`事後同意`,on:!1,x:`證人{{witness}}於警詢時證稱其事後知悉並協助處理債務等語，似有事後授權或同意之意，亦無從憑此認定被告冒用其名義。`}],refs:[[`PCDM,112,自,41,20240704,1`,`新北地院112年度自字第41號`,`默示授權、215須自己名義`],[`PCDM,111,訴,1491,20240430,1`,`新北地院111年度訴字第1491號`,`不知告訴人未授權`],[`PCDM,113,訴,225,20250321,1`,`新北地院113年度訴字第225號`,`董事會授權刻印開戶`]]},{id:4,g:`C`,name:`公然侮辱經合憲限縮不該當`,tag:`刑法309、113憲判3`,skipUnd:!0,steps:[`勘驗確認實際言詞與先後順序`,`引用113憲判3：社會名譽、名譽人格，不含名譽感情`,`表意脈絡：關係、起因、誰先挑釁、時間、反覆與否、見聞者`,`非針對結構性弱勢`,`結論：屬個人修養範疇`],fields:[[`words`,`言詞`,`〔言詞〕`],[`conflict`,`衝突起因`,`行車糾紛`],[`sec`,`持續秒數`,``]],law:`按憲法法庭113年憲判字第3號判決意旨，刑法第309條第1項所處罰之公然侮辱行為，係指依個案之表意脈絡，表意人故意發表公然貶損他人名譽之言論，已逾越一般人可合理忍受之範圍；經權衡該言論對他人名譽權之影響，及該言論依其表意脈絡是否有益於公共事務之思辯，或屬文學、藝術之表現形式，或具學術、專業領域等正面價值，於個案足認他人之名譽權應優先於表意人之言論自由而受保障者。本罪所保護之名譽，限於真實之社會名譽及名譽人格，不及於個人主觀之名譽感情。又於衝突當場之短暫言語攻擊，如非反覆、持續出現之恣意謾罵，即難逕認表意人係故意貶損他人之社會名譽或名譽人格；一人對他人之負面言語，縱造成他人一時不悅，然如其冒犯及影響程度輕微，尚難逕認已逾一般人可合理忍受之範圍。`,mods:[{k:`fa`,t:`客觀言詞（置於法則前）`,on:!0,pre:!0,x:`被告於〔時間〕，在〔地點〕，對告訴人稱「{{words}}」〔並比中指〕等情，為被告所不爭執，並有本院勘驗〔錄音／行車紀錄器／監視器〕畫面之勘驗筆錄在卷可稽（見本院卷第〔　〕頁），此部分事實堪以認定。`},{k:`ca`,t:`衝突起因、對方挑釁`,on:!0,x:`被告與告訴人〔素不相識〕，係因{{conflict}}發生爭執，依前開勘驗結果，係告訴人先〔指責被告／以「〔　〕」等語挑釁相激〕，被告始口出上開言詞，並非無端開啟爭端而恣意攻擊告訴人。`},{k:`sh`,t:`一次性短暫、見聞者有限`,on:!0,x:`被告上開言詞自出口至結束，歷時僅約{{sec}}秒，係於情緒激動下一時脫口而出之一次性言語，並無反覆、持續之情形；現場〔未見其他人經過〕，亦不具累積性或擴散性。`},{k:`fe`,t:`屬名譽感情`,on:!0,x:`被告所用言詞固屬粗鄙、不雅，而使告訴人感到不快，然此屬名譽感情之範疇；一般理性第三人綜合上開爭執脈絡觀之，當可理解係雙方糾紛所生之情緒性反應，尚不致因此對告訴人之人格或社會評價產生負面認知，亦未達使告訴人自我否定其人格尊嚴之程度。`},{k:`st`,t:`非針對結構性弱勢`,on:!1,x:`被告上開言詞係針對告訴人〔於會議中之專業發言〕表達不滿，亦非針對告訴人之性別、種族、身心障礙等結構性弱勢身分而為羞辱。`},{k:`cn`,t:`結論`,on:!0,x:`綜上，被告之言行雖有失修養，惟依表意脈絡整體觀察，尚未逾越一般人可合理忍受之範圍，難認係故意貶損告訴人之社會名譽或名譽人格，與刑法第309條第1項公然侮辱罪之構成要件尚屬有間。`}],refs:[[`KSHM,114,上易,28,20250529,1`,`高雄分院114年度上易字第28號`,`會議衝突一次性粗話`],[`TPHM,108,上易,770,20240731,3`,`臺灣高等法院108年度上易字第770號`,`憲判後改判無罪`],[`KSHM,114,原上易,5,20250625,1`,`高雄分院114年度原上易字第5號`,`勘驗27秒、見聞者有限`],[`TPDM,115,易,290,20260526,1`,`臺北地院115年度易字第290號`,`私怨偶發留言，不另為無罪`]]},{id:9,g:`C`,name:`民事糾紛型詐欺（無施用詐術）`,tag:`刑法339、締約詐欺、履約詐欺`,steps:[`區分締約詐欺與履約詐欺`,`締約時有無虛構事實或隱瞞重要事項`,`締約後有無履約作為`,`資力惡化不等於自始無履約意思`,`事後外部原因致不能履約`,`結論：民事債務不履行`],fields:[[`keyFact`,`締約重要事項`,``],[`perf`,`已履行部分`,``],[`dispute`,`雙方爭議事項`,``],[`later`,`嗣後未履約原因`,``]],law:`按刑法第339條詐欺罪之成立，以行為人意圖為自己或第三人不法之所有，以詐術使人將本人或第三人之物交付為要件。所謂以詐術使人交付，必須被詐欺人因其詐術而陷於錯誤，若其所用方法，不能認為詐術，亦不致使人陷於錯誤，即不構成該罪。於雙方締結契約之情形，詐欺之態樣可分為締約詐欺與履約詐欺：前者係行為人於締約之際使用詐騙手段，使被害人對締約之基礎事實發生錯誤而締約；後者則係行為人於締約之初即無履約之意，或於履約過程中以詐術使被害人交付財物。行為人雖未依債之本旨履行給付，僅係依雙方約定負賠償責任或依民法債務不履行規定負民事責任，尚不得僅以未依債之本旨履行給付之情狀，即推論行為人自始即有詐欺之故意。又交易時之風險評估，本屬當事人於私法自治原則下之權利行使表現，單純未向對方主動說明債信狀況，除另有虛構職業、收入、資產等情形外，亦不得與施用詐術相提並論。`,mods:[{k:`ct`,t:`締約詐欺不成立`,on:!0,x:`關於締約詐欺部分：告訴人於本院審理時證稱：〔　〕等語（見本院卷第〔　〕頁），自承其締約係基於〔　〕之考量，而非因被告就{{keyFact}}有所隱瞞或虛構；被告僅表示〔　〕，並未佯稱〔　〕，難認被告於締約時有何施用詐術使告訴人陷於錯誤之情事。`},{k:`pf`,t:`曾有履約作為、雙方另有爭議`,on:!0,x:`關於履約詐欺部分：被告於締約後，已{{perf}}，此有〔匯款紀錄／LINE對話紀錄〕在卷可稽，足見被告非無履約之意願及能力。嗣雙方就{{dispute}}發生爭執，且未將口頭約定記載於契約，被告因而未依約履行，尚非全然無據。`},{k:`as`,t:`資力惡化不等於自始無履約意思`,on:!1,x:`公訴意旨雖以被告〔名下無財產／支票跳票〕為由，認其締約時即無資力。然債信狀況惡化之原因所在多有，債臺高築者亦難與無資力履約畫上等號；被告當時〔另有債權可期受償／仍有收入來源〕，所辯有能力付款等語，尚非無稽。`},{k:`lt`,t:`事後外部原因致未履約`,on:!1,x:`被告嗣後未能依約給付，係因{{later}}，屬締約後始發生之情事，尚不能據以回溯推認被告於締約之初即懷有不履約之意圖。`},{k:`mt`,t:`未告知動機非詐術`,on:!1,x:`被告未告知〔入住目的〕，僅屬締約動機問題，並非契約之重要資訊，尚不該當施用詐術。`},{k:`cn`,t:`結論：民事債務不履行`,on:!0,x:`綜上，公訴人所舉證據，僅足證明被告與告訴人訂立契約後未依約履行之事實，被告應負之民事債務不履行責任，與刑事詐欺罪之構成要件尚屬二事，自難以詐欺罪相繩。`}],refs:[[`TPDM,112,易,869,20240417,1`,`臺北地院112年度易字第869號`,`締約、履約詐欺均不成立`],[`TPDM,113,易,446,20241101,1`,`臺北地院113年度易字第446號`,`律師費未付、資力惡化`],[`TPDM,113,易,1431,20250421,1`,`臺北地院113年度易字第1431號`,`未說明債信非詐術`],[`TPDM,114,易,1309,20260106,1`,`臺北地院114年度易字第1309號`,`另案羈押致未付房費`]]},{id:10,g:`C`,name:`侵占／背信不該當（金錢所有權移轉）`,tag:`刑法335、336、342`,steps:[`侵占須持有他人之物、易持有為所有`,`金錢消費借貸：所有權移轉`,`是否屬業務範圍`,`背信須為他人處理事務（他屬性）`,`混同、無短少`],fields:[[`witness`,`交付款項之人`,``],[`money`,`款項`,`新臺幣〔　〕元`]],law:`按刑法上之侵占罪，以意圖為自己或第三人不法之所有，而擅自處分自己持有之他人所有物，即變更持有之意為不法所有之意，為其構成要件。侵占罪被侵占之物，須原為行為人所持有之他人之物，倘自始即為行為人自己所有之物，即不生易持有為所有之問題；若以自己或他人名義向人借貸，不能如數清償，係民事上違背契約問題，與侵占罪之要件不合。又金錢為代替物，於消費借貸關係中，借用人收受後其所有權即移轉於借用人。`,mods:[{k:`ln`,t:`消費借貸、所有權移轉`,on:!0,x:`依證人{{witness}}之證述及雙方LINE對話紀錄（見〔　〕卷第〔　〕頁），{{witness}}係同意將{{money}}先交付被告使用，並約定〔由被告直接向告訴人給付分期款項〕，雙方間實係成立消費借貸關係。金錢為代替物，被告收受後所有權即移轉於被告，告訴人自始未取得該款項之所有權，被告即非持有他人之物，其事後未依約返還或轉付，僅屬民事債務不履行問題，與侵占罪之構成要件不符。`},{k:`bs`,t:`非業務範圍`,on:!1,x:`依告訴代理人〔姓名〕之證述，向〔客戶〕收取款項並非被告之業務範圍，是被告亦非業務上持有該款項之人。`},{k:`br`,t:`背信：非為他人處理事務`,on:!1,x:`按刑法第342條背信罪，以為他人處理事務為前提，所處理之事務須具有他屬性；若行為人與本人立於對向之契約關係，而非為本人處理事務，即非本罪之行為主體。被告收取上開款項係基於其與{{witness}}間之消費借貸關係，並非為告訴人處理事務，且告訴人對{{witness}}之債權並不因此受影響，被告所為亦與背信罪之構成要件有間。`},{k:`cv`,t:`背信：配件費等屬民事債務`,on:!1,x:`被告應允〔贈送客戶超過公司規定額度之配件〕，依證人〔姓名〕之證述，該費用係由〔配件行〕直接向被告結算，公司並未經手，縱有超過額度，亦屬被告與〔配件行〕間之民事債務不履行問題，難認被告有背信之不法意圖。`},{k:`mx`,t:`混同、無短少`,on:!1,x:`至〔意向金〕部分，款項匯入被告帳戶後已與被告其他款項混同，告訴人就此部分亦未發現有何短少或異常繳付之情形，尚乏證據證明被告有何易持有為所有之行為。`}],refs:[[`SLDM,114,易,159,20250708,1`,`士林地院114年度易字第159號`,`消費借貸、背信他屬性`],[`SLDM,112,易緝,3,20230613,1`,`士林地院112年度易緝字第3號`,`配件費屬民事，背信一部無罪`]]},{id:11,g:`C`,name:`恐嚇危害安全：未達惡害通知`,tag:`刑法305（含強制罪）`,steps:[`勘驗還原言詞與舉動`,`須明確、具體之將來惡害通知`,`不以被害人主觀感受為準`,`告訴人當時反應`,`怨懟、宣洩之詞非惡害通知`,`強制罪併同處理`],fields:[[`video`,`勘驗標的`,`監視器錄影畫面`],[`act`,`被告舉動`,``],[`topic`,`爭論內容`,``],[`words`,`被告言詞`,``],[`reason`,`發言緣由`,``]],law:`按刑法第305條恐嚇危害安全罪，以加害生命、身體、自由、名譽、財產之事恐嚇他人，致生危害於安全為要件。所稱恐嚇，係指以將來之惡害通知被害人，使其心生畏懼；該惡害通知須明確、具體，依社會通常觀念足使一般人感受其特定法益可能遭受侵害之不安、畏懼。是認定行為人之舉止是否該當本罪，須先審究其言詞或舉動，客觀上是否已該當具體加害他人法益之惡害告知，而惡害告知是否已達致生危害於他人安全之程度，並非僅以被害人主觀感受或陳述為據，而應綜合行為人為該舉止之整體時空背景、雙方互動狀態，依社會通常之倫理觀念判斷之。`,mods:[{k:`vd`,t:`勘驗：無加害之意思表示`,on:!0,x:`經本院勘驗{{video}}，結果略以：〔勘驗要旨〕（見本院卷第〔　〕頁）。依上開勘驗結果，被告固有{{act}}之舉，然其持續時間短暫，其後並無〔再為揮擊或其他肢體動作〕，所為言詞內容均係針對{{topic}}爭論，未見有何明示或暗喻加害告訴人生命、身體、自由、名譽或財產之意思表示。`},{k:`rx`,t:`告訴人當時反應`,on:!0,x:`告訴人於案發時尚〔以不小音量與被告爭論，並要求被告留下〕，其於警詢時亦僅稱〔不知被告會有何舉動〕等語，可見其並未認知到任何具體之惡害內容，客觀上難認被告所為已達使通常之人心生畏怖之程度。`},{k:`vt`,t:`怨懟、宣洩之詞`,on:!1,x:`被告所稱「{{words}}」等語，依其前後語境，係因{{reason}}而發之怨懟、宣洩之詞，並非針對告訴人之將來惡害通知；被告縱有〔拿取剪刀〕之舉，亦未持之指向告訴人，客觀上難認足以構成威脅。`},{k:`nv`,t:`被害人證稱未受恐嚇`,on:!1,x:`證人〔姓名〕於本院審理時明確證稱：被告沒有恐嚇我等語（見本院卷第〔　〕頁），且未對被告提出恐嚇告訴，則其是否因被告之行為感受到生命、身體等法益之危害，已非無疑。`},{k:`cp`,t:`併論強制罪不成立`,on:!1,x:`又刑法第304條強制罪，以行為人主觀上有強制故意，客觀上以強暴、脅迫方法妨害他人行使權利為要件。被告〔拉開車門旋即關閉〕，時間短暫，未放任車門開啟或驟然減速停車，其目的係在質問〔逼車〕一事，難認主觀上有妨害告訴人行使權利之意，亦不構成強制罪。`},{k:`cn`,t:`結論`,on:!0,x:`綜合案發前因、背景及雙方互動過程，被告所為固屬失當，然客觀上尚非具體加害法益之惡害告知，主觀上亦難認有恐嚇之犯意，自不得以恐嚇危害安全罪相繩。`}],refs:[[`PCDM,113,易,1551,20250417,1`,`新北地院113年度易字第1551號`,`持傘揮擊帽簷、咆嘯`],[`PCDM,114,易,118,20250424,1`,`新北地院114年度易字第118號`,`拉開車門旋即關閉，含強制罪`],[`PCDM,114,易,1573,20251209,1`,`新北地院114年度易字第1573號`,`怨懟之詞，一部無罪`],[`PCDM,115,易,428,20260331,1`,`新北地院115年度易字第428號`,`被害人證稱未受恐嚇，不另為無罪`]]},{id:13,g:`C`,name:`妨害公務：未達強暴脅迫`,tag:`刑法135（含傷害）`,steps:[`勘驗密錄器還原經過`,`強暴須積極、直接對公務員攻擊`,`消極不配合、閃躲、掙脫壓制不構成`,`短暫情緒舉動欠缺妨害公務犯意`,`員警傷勢成因`,`證人與勘驗不符`],fields:[[`act`,`被告舉動`,``],[`restraint`,`遭壓制情狀`,`雙手業經上銬，且現場至少有〔4〕名員警在旁壓制`],[`officer`,`員警`,``]],law:`按刑法第135條第1項之妨害公務罪，目的在貫徹國家意志及保護國家法益，行為人主觀上須有妨害公務之故意，客觀上須有積極、直接施加強暴或脅迫之行為，致對公務員依法執行職務造成阻礙，達於足以妨害公務員執行職務之程度，始足當之。所謂強暴，係意圖妨害公務員職務之依法執行，以公務員為目標，對物或他人實施一切有形物理暴力而言；並非公務員執行職務時，人民一有任何肢體舉止，均構成以強暴妨害公務。倘僅係於公務員依法執行職務時，以消極之不作為、不配合、閃躲，或於遭壓制之過程中扭動身軀，而未有其他積極、直接對公務員攻擊、對抗、反制之作為，即與本條所指強暴行為不符（最高法院111年度台上字第2676號判決意旨參照）。`,mods:[{k:`vd`,t:`勘驗密錄器`,on:!0,x:`經本院當庭勘驗員警密錄器錄影畫面，結果略以：〔勘驗要旨〕（見本院卷第〔　〕頁）。依勘驗結果，被告固有{{act}}之舉，然未見其有何以身體衝撞、揮打或其他積極、直接對員警施加強暴之行為。`},{k:`rs`,t:`掙脫壓制屬消極抗拒`,on:!0,x:`被告斯時{{restraint}}，其扭動身軀應僅係為擺脫員警對其身體施加之強力控制，屬消極之抗拒，而非積極攻擊員警之行為。`},{k:`em`,t:`短暫情緒舉動`,on:!1,x:`被告以不到1秒之時間{{act}}，係基於〔不滿遭取締〕之情緒所為，難認主觀上有妨害員警執行職務之犯意，客觀上亦未達對物施加不法腕力之強暴程度。`},{k:`in`,t:`員警傷勢另有成因`,on:!1,x:`員警{{officer}}所受傷勢，依勘驗結果係〔追捕過程中遭路邊橫桿絆倒〕所致，與被告之行為並無關聯；證人{{officer}}於本院審理時亦證稱無法確認其受傷是否因被告所致等語。`},{k:`wt`,t:`證人證述與勘驗不符`,on:!1,x:`證人〔姓名〕雖證稱目睹被告〔以身體撞倒員警〕，然與前揭密錄器勘驗結果不符，復無其他補強證據，尚難採信。`},{k:`hu`,t:`併論傷害不成立`,on:!1,x:`告訴人雖於案發後驗傷，惟其於被告動作後並無疼痛反應，現場對話中亦未提及受傷，依勘驗畫面亦難認被告有碰觸告訴人身體，自難認被告有傷害之犯意或得預見告訴人受傷。`}],refs:[[`SLDM,113,易,582,20241111,1`,`士林地院113年度易字第582號`,`抽取罰單不到1秒`],[`SLDM,111,易,503,20230829,1`,`士林地院111年度易字第503號`,`上銬後扭動身軀`],[`SLDM,111,原訴,20,20230720,1`,`士林地院111年度原訴字第20號`,`逃避追捕、員警自行絆倒`]]},{id:16,g:`C`,name:`妨害秩序：未生外溢作用`,tag:`刑法150`,steps:[`法則：保護公眾安寧，須妨害秩序故意`,`對特定人施暴須有外溢作用`,`時地：深夜、無人車往來、時間短`,`在場民眾反應（圍觀非恐慌）`,`共同正犯：突發行為超出共同決意`,`傷害告訴撤回另諭知不受理`],fields:[[`cause`,`衝突緣由`,``],[`victims`,`被害人`,``],[`time`,`時間`,``],[`place`,`地點`,``],[`dur`,`衝突時間`,`1分鐘餘`],[`actor`,`突發下手者`,``]],law:`按刑法第150條聚眾施強暴脅迫罪，係重在保護公共秩序及公眾安寧之抽象危險犯，聚眾實施強暴脅迫之人，主觀上須具有妨害秩序之故意，即具有實施強暴脅迫而為騷亂之共同意思。其實施強暴脅迫之對象如係對群眾或不特定人為之，已造成公眾或他人之危害、恐懼不安，固屬該當；惟如僅對特定人或物為之，必其憑藉群眾形成之暴力威脅情緒或氛圍所營造之攻擊狀態，已有可能因集體情緒失控及所生之加乘效果，而波及蔓延至周邊不特定、多數、隨機之人或物，以致此外溢作用產生危害於公眾安寧、社會安全，而使公眾或不特定之他人產生危害、恐懼不安之感受，始符合本罪之立法意旨。`,mods:[{k:`sp`,t:`僅針對特定人`,on:!0,x:`依被告供述、告訴人證述及本院勘驗筆錄，被告等人係因{{cause}}，僅針對特定之{{victims}}施以強暴，並非對群眾或不特定人為之。`},{k:`tp`,t:`時地無公眾往來`,on:!0,x:`本案案發時間為{{time}}，地點位於{{place}}，現場〔並無其他民眾或人車往來〕，衝突時間僅約{{dur}}。`},{k:`cr`,t:`在場民眾圍觀而非恐慌`,on:!1,x:`經本院勘驗現場監視器及民眾錄影畫面，衝突時在場民眾〔抬頭觀看、移近圍觀，甚有拍手鼓掌者〕，並未出現恐慌、爭先離開之情事（見本院卷第〔　〕頁），客觀上難認已因外溢作用對公眾或他人產生危害、恐懼不安之影響。`},{k:`ex`,t:`突發行為超出共同決意`,on:!1,x:`{{actor}}持〔球棒〕揮打之際，其餘被告僅在旁觀看，未有共同下手、指揮、包圍或助勢之舉，甚曾出聲勸阻，{{actor}}亦自承係一時情緒失控而擅自揮打，其行為已超出共同決意範圍，自難令其餘被告共負其責。`},{k:`cn`,t:`結論`,on:!0,x:`綜上，被告等人之行為固有不當，然尚未達妨害公眾安寧、社會秩序之程度，與刑法第150條之構成要件不符。`}],note:`傷害部分如經撤回告訴，主文另諭知公訴不受理（刑訴303條第3款），並敘明妨害秩序部分既經無罪，二者已無裁判上一罪關係，應分別諭知。`,refs:[[`PCDM,113,原訴,49,20250318,1`,`新北地院113年度原訴字第49號`,`KTV大廳、民眾圍觀鼓掌`],[`PCDM,112,訴,890,20240612,2`,`新北地院112年度訴字第890號`,`深夜公園、突發行為`]]},{id:6,g:`D`,name:`正當防衛（行為不罰）`,tag:`刑法23條前段`,skipUnd:!0,nb:`係對於現在不法之侵害，出於防衛自己〔或他人〕權利之行為，且未逾越必要程度，合於刑法第23條前段正當防衛之規定，得阻卻違法`,steps:[`先肯定構成要件該當，寫出「本應論罪」`,`揭示要件：現在不法侵害、防衛意思、必要性`,`侵害是否結束：客觀第三人、罪疑唯輕`,`不法侵害不以刑罰保護法益或具體傷害為限`,`必要性：理性第三人、不要求唯一手段`,`排除互毆（30年上字第1040號判例）`],fields:[[`act`,`被告防衛行為`,`徒手推倒、壓制雙手`],[`attack`,`告訴人侵害行為`,``],[`injury`,`告訴人傷勢`,``]],law:`按對於現在不法之侵害，而出於防衛自己或他人權利之行為，不罰，刑法第23條前段定有明文。所謂現在不法之侵害，係指侵害業已開始或正在繼續進行中，被害人仍有受侵害之危險而可即時排除者而言，且不以侵害行為已對身體造成具體傷害為必要；侵害是否已經結束，應以客觀第三人之角度，依侵害者攻擊行為之整體歷程判斷，倘侵害者是否放棄攻擊尚屬未明，應作有利於防衛者之認定。又防衛行為是否必要，應就不法侵害之方式、輕重、緩急與危險性，參酌防衛當時可資運用之防衛措施等客觀情狀，以理性第三人處於相同情況是否亦採取相同強度之防衛為準綜合判斷，並不以出於不得已之唯一手段為要件，亦不問防衛者能否以逃避方式取代反擊；行為人基於單一防衛意思接續施以數防衛行為者，應就防衛行為之全部整體觀察，不得割裂。至彼此互毆，必以一方初無傷人之行為，因排除對方不法之侵害而加以還擊，始得以正當防衛論。`,mods:[{k:`tb`,t:`構成要件該當（置於法則前）`,on:!0,pre:!0,x:`被告於〔時間〕，在〔地點〕，以{{act}}之方式對待告訴人，致告訴人受有{{injury}}等情，為被告所不爭執，核與告訴人、證人〔姓名〕之證述相符，並有診斷證明書、本院勘驗筆錄在卷可稽。被告所為客觀上已該當{{law}}之構成要件，主觀上亦知悉其行為可能致告訴人受傷，本應論罪。`},{k:`fs`,t:`告訴人先攻擊、非互毆`,on:!0,x:`依證人〔姓名〕證述及本院勘驗結果，本件係告訴人先{{attack}}（見本院卷第〔　〕頁），被告於此之前並無任何攻擊行為，核非雙方互毆之情形。`},{k:`cu`,t:`侵害尚未結束`,on:!0,x:`告訴人〔於第一次遭推開後仍起身逼近〕，足見其攻擊行為具有接續性及不可預測性，客觀上侵害尚未結束，被告當時仍處於現在不法侵害之中。`},{k:`ne`,t:`防衛手段必要、未過當`,on:!0,x:`衡以告訴人〔酒後持械／身形魁梧〕，被告則〔手無寸鐵／身形瘦小〕，被告僅以{{act}}之方式排除侵害，歷時僅〔數秒〕，於侵害停止後即〔鬆手並報警等候〕，未再續行攻擊；告訴人所受傷勢亦屬輕微。以理性第三人處於相同情境觀之，被告所採取者已屬相對平和之手段，並未逾越必要程度，難認防衛過當。`},{k:`il`,t:`不法侵害不以刑罰程度為限`,on:!1,x:`告訴人未經被告同意而〔對其手部施力抓握／拒不離去被告住處〕，縱未達刑罰之程度，亦屬對被告〔身體／居住安寧〕之現在不法侵害。`},{k:`in`,t:`防衛意思（事後報警未報復）`,on:!1,x:`被告於衝突後隨即報警處理，未趁機報復攻擊，益徵其主觀上係出於防衛之意思，而非傷害之犯意。`},{k:`db`,t:`雙重理由：因果存疑＋縱屬之亦為防衛`,on:!1,x:`況依證人〔姓名〕之證述，告訴人之傷勢不能排除係其〔揮拳揮空撞擊床板〕所致，檢察官未能證明告訴人傷勢確為被告所造成；縱認係被告所致，被告所為亦屬正當防衛，詳如上述。`}],refs:[[`TNHM,114,上訴,681,20250528,1`,`臺南分院114年度上訴字第681號`,`侵害是否結束、整體觀察`],[`KSHM,111,上訴,1006,20230328,1`,`高雄分院111年度上訴字第1006號`,`驅離留滯住宅`],[`TPHM,113,上易,1511,20241129,1`,`臺灣高等法院113年度上易字第1511號`,`不法侵害不以刑罰程度為限`],[`TPHM,113,原上訴,78,20240613,1`,`臺灣高等法院113年度原上訴字第78號`,`雙重理由`]]},{id:12,g:`D`,name:`誹謗：合理查證或合理評論`,tag:`刑法310條第3項、311條第3款、112憲判8`,steps:[`區分事實陳述與意見表達`,`事實陳述：是否涉及公共利益`,`合理查證：取得何資料、有無明知或重大輕率`,`查證義務高低：公眾人物、時效、查證成本`,`意見表達：前提事實非虛捏、適當評論`,`閉門場合、散布力有限`],fields:[[`subject`,`指摘事項`,``],[`pub`,`公共利益關聯`,``],[`mat`,`查證資料`,``],[`target`,`被指摘人身分`,``],[`words`,`評論言詞`,``]],law:`按刑法第310條第3項規定：「對於所誹謗之事，能證明其為真實者，不罰。但涉於私德而與公共利益無關者，不在此限。」所誹謗之事涉及公共利益者，表意人雖無法證明其言論為真實，惟如其於言論發表前確經合理查證程序，依所取得之證據資料，客觀上可合理相信其言論內容為真實者，即屬合於上開規定所定不罰之要件；即使表意人於合理查證程序所取得之證據資料實非真正，如表意人就該不實證據資料之引用，並未有明知或重大輕率之惡意情事者，仍屬不罰之情形。至表意人是否符合合理查證之要求，應充分考量憲法保障名譽權與言論自由之意旨，並依個案情節為適當之利益衡量（司法院釋字第509號解釋、憲法法庭112年憲判字第8號判決意旨參照）。又言論可分為事實陳述及意見表達，意見表達係個人主觀評價之表現，無所謂真實與否，對於可受公評之事為適當之評論者，依刑法第311條第3款規定不罰。`,mods:[{k:`pi`,t:`涉及公共利益`,on:!0,x:`被告所指摘之{{subject}}，涉及{{pub}}，非僅屬私德問題，而與公共利益有關，有刑法第310條第3項真實性抗辯規定之適用。`},{k:`rv`,t:`已盡合理查證`,on:!0,x:`被告於發表言論前，已取得{{mat}}等資料（見〔　〕卷第〔　〕頁），並基於其〔親身經歷〕而為陳述，依上開資料客觀上可合理相信其言論內容為真實；被告縱用語未盡嚴謹，亦難認有明知或重大輕率之惡意，而欠缺誹謗之故意。`},{k:`lv`,t:`查證義務不宜過高`,on:!1,x:`{{target}}為〔機關首長〕，有相當能力澄清，其名譽對言論自由應為較高程度之退讓；且該議題具高度時效性，被告既無調查權限，資訊受限於公開資料，自不宜課予過高之查證義務。`},{k:`op`,t:`意見表達、合理評論`,on:!1,x:`被告所稱「{{words}}」等語，係以〔　〕之前提事實為基礎，依其認知與推理所為之主觀評價，屬意見表達；該前提事實業經證人〔姓名〕證述屬實，並非被告憑空虛捏，依刑法第311條第3款規定，屬對可受公評之事為適當之評論，不罰。`},{k:`ct`,t:`整體脈絡未直接指摘`,on:!1,x:`依被告言論之前後文脈絡，被告係整理〔坊間三種懷疑〕，其中〔第二、三種〕均與告訴人無關，難認被告有直接指摘告訴人〔　〕之意。`},{k:`pl`,t:`閉門場合、散布力有限`,on:!1,x:`被告係於〔閉門會議〕中、在〔特定〕與會者面前發言，其言論之散布力與影響力亦屬有限。`},{k:`cn`,t:`結論`,on:!0,x:`綜上，被告所為言論，依其整體脈絡及查證情形，難認有誹謗之故意及真實惡意，核屬言論自由保障之範疇，自難以誹謗罪相繩。`}],refs:[[`TPDM,113,易,646,20240913,1`,`臺北地院113年度易字第646號`,`親身經歷＋查證資料（同案另一被告有罪）`],[`TPDM,112,自,57,20250619,1`,`臺北地院112年度自字第57號`,`機關首長、公益、時效`],[`TPDM,113,易,1389,20250707,1`,`臺北地院113年度易字第1389號`,`意見表達、合理評論`]]},{id:7,g:`D`,name:`欠缺責任能力（刑法19條第1項）`,tag:`思覺失調、雙相情感疾患、癲癇`,skipUnd:!0,nb:`被告行為時因精神障礙，致{{ability}}，依刑法第19條第1項規定，其行為不罰`,steps:[`先完整認定客觀犯罪事實`,`生理原因（鑑定）＋心理結果（法院判斷）`,`鑑定報告：機關、方法、診斷、結論，說明可採`,`區分辨識能力與控制能力`,`駁斥：事後應答切題、偵查否認、學歷工作`,`監護：再犯或危害公共安全之虞、比例原則`],fields:[[`hospital`,`鑑定醫院`,``],[`diag`,`診斷`,`思覺失調症`],[`symptom`,`行為時症狀`,`命令式聽幻覺`],[`ability`,`能力欠缺`,`不能辨識其行為違法`]],law:`按行為時因精神障礙或其他心智缺陷，致不能辨識其行為違法或欠缺依其辨識而行為之能力者，不罰，刑法第19條第1項定有明文。判斷行為人有無上開情形，須審究行為人是否有精神障礙或其他心智缺陷之生理原因，及該生理原因是否致其辨識行為違法或依辨識而行為之能力有所欠缺之心理結果；前者得依醫學專家之鑑定結果為據，後者則由法院綜合行為人行為時各種主客觀情狀，本於職權判斷之。`,mods:[{k:`fa`,t:`犯罪事實先行認定（置於法則前）`,on:!0,pre:!0,x:`〔被告於時地為何行為之事實〕，業據證人〔姓名〕證述明確，並有〔監視器畫面、勘驗筆錄、診斷證明書〕在卷可稽，是被告確有上開行為，堪以認定。`},{k:`ap`,t:`鑑定報告`,on:!0,x:`經本院囑託{{hospital}}對被告實施精神鑑定，該院綜合被告之個人生活史、疾病史、本案卷證資料、精神狀態檢查及心理衡鑑結果，認被告罹有{{diag}}，案發時受{{symptom}}影響，{{ability}}，有該院〔日期〕〔字號〕函附精神鑑定報告書在卷可稽（見本院卷第〔　〕頁）。上開鑑定係由精神科專科醫師本於專業知識及臨床經驗綜合判斷所得，鑑定人資格、鑑定方法及論理過程均無瑕疵，應堪採信。`},{k:`cx`,t:`行為時情狀相符`,on:!0,x:`本院審酌被告案發時〔言行異常、喃喃自語、答非所問〕，案發後〔　〕日即因〔　〕經強制住院等情（見〔　〕卷第〔　〕頁），與上開鑑定意見相符。`},{k:`rb`,t:`駁斥反對理由`,on:!1,x:`公訴意旨雖以被告〔偵查中能切題應答／具大學學歷／曾否認犯行〕為由，認其具辨識能力，惟鑑定報告已說明被告之精神症狀係〔間歇性急性發作〕，與智力高低無涉，事後能被動回答年籍或殘留部分記憶，亦不足推認其行為時仍具辨識或控制能力。`},{k:`dc`,t:`區分辨識與控制能力`,on:!1,x:`被告雖能認知〔竊取〕為違法，屬辨識能力未受影響，然其行為完全受妄想症狀操弄，未有掩飾、躲避之舉，已喪失依其辨識而行為之控制能力，二者並無矛盾。`}],refs:[[`TPHM,113,上訴,65,20240328,1`,`臺灣高等法院113年度上訴字第65號`,`先認定事實、監護3年`],[`TNHM,111,上易,3,20220222,1`,`臺南分院111年度上易字第3號`,`辨識與控制能力`],[`TPHM,114,上易,600,20250729,1`,`臺灣高等法院114年度上易字第600號`,`不宣告監護`],[`KSHM,110,上易,493,20220510,1`,`高雄分院110年度上易字第493號`,`漏未審酌監護而撤銷`]]},{id:8,g:`E`,name:`證據排除後不能證明`,tag:`違法搜索、158條之4、毒樹果實`,skipUnd:!0,noAbility:!0,steps:[`勘驗密錄器還原取證經過`,`定性：逾目視檢查即屬搜索`,`逐一排除附帶、逕行、同意搜索、另案扣押`,`158條之4權衡（違法情節、主觀惡意、嚇阻效果）`,`衍生證據一併排除（採尿同意非真摯）`,`排除後自白欠缺補強（156條第2項）`,`違禁物單獨宣告沒收`],fields:[[`item`,`扣案物`,``],[`place`,`搜索處所`,`駕駛座下方`]],law:`按警察依警察職權行使法第8條第2項規定檢查交通工具，僅得以目視方式為一目瞭然之觀察，不得為物理上之翻搜；如進而開啟車門、置物箱或伸手翻動車內物品，即屬刑事訴訟法上之搜索，除經法官核發搜索票外，須符合附帶搜索、逕行搜索、緊急搜索或同意搜索等法定例外要件，始為合法。又同意搜索應經受搜索人出於自願性之同意，並將其同意之意旨於實施搜索前或當時記載於筆錄，不得事後補正。`,mods:[{k:`vd`,t:`勘驗取證經過（置於法則前）`,on:!0,pre:!0,x:`被告於〔時間〕，在〔地點〕駕駛〔車輛〕，因〔未打方向燈〕為警攔停，員警嗣自{{place}}查獲{{item}}等情，有〔搜索扣押筆錄、扣押物品目錄表〕在卷可稽。經本院勘驗員警密錄器錄影畫面，結果略以：〔勘驗要旨，含被告「你不能拿」等語〕（見本院卷第〔　〕頁）。`},{k:`sr`,t:`逾目視檢查即屬搜索`,on:!0,x:`員警以手電筒照射車內未見異狀後，即探身進入車內，伸手至{{place}}取出〔信封袋〕，再度伸手取出〔黑色包包〕，已逾目視檢查之範圍，實質上屬對車輛內部之搜索。`},{k:`ia`,t:`非附帶、逕行搜索`,on:!0,x:`員警搜索時並未先行逮捕被告，被告斯時亦站立車外，車內非其立即可觸及之範圍，與刑事訴訟法第130條附帶搜索之要件不符；第131條逕行搜索以發現應受拘提逮捕之人為目的，本件係為找物，現場亦無急迫情形，與之亦屬有間。`},{k:`cs`,t:`非同意搜索`,on:!0,x:`被告於員警取物時已明確表示〔「你不能拿」「搜索票給我」〕，員警事前未告知其得拒絕搜索，〔自願受搜索同意書〕係於搜索完成後始令被告簽署，本件自非合法之同意搜索。`},{k:`ar`,t:`準現行犯要件不備（違法逮捕）`,on:!1,x:`員警目視所見者僅為〔一般市售透明吸管〕及〔外觀全黑之夾鏈袋〕，客觀上無從推斷與犯罪有關，與刑事訴訟法第88條第3項第2款「持有兇器、贓物或其他物件，顯可疑為犯罪人」之準現行犯要件不符，屬違法逮捕，其後所為之附帶搜索亦失所附麗。`},{k:`wb`,t:`158條之4權衡排除`,on:!0,x:`按除法律另有規定外，實施刑事訴訟程序之公務員因違背法定程序取得之證據，其有無證據能力之認定，應審酌人權保障及公共利益之均衡維護，刑事訴訟法第158條之4定有明文。本院審酌：員警違背法定程序情節重大，係於被告明示拒絕後仍繼續搜索，主觀上具規避令狀原則之意圖；現場並無保全證據之急迫情形，侵害被告隱私權及財產權非輕；被告所涉{{charge}}罪，〔持有數量甚微〕，尚無證據證明已生實害；排除該證據對嚇阻將來違法取證具重要效果，且依法定程序亦無必然發現之可能。經權衡結果，認扣案{{item}}及其衍生之〔鑑定書〕均無證據能力。`},{k:`ur`,t:`採尿同意非真摯`,on:!1,x:`被告遭違法拘束人身自由達〔　〕小時後簽署自願受採尿同意書，其同意僅具形式意義，難認出於真摯，所採尿液及其檢驗報告與先前違法取證前後密切結合，亦應一併排除。`},{k:`cf`,t:`排除後自白欠缺補強`,on:!0,x:`上開證據既經排除，卷內僅餘被告於〔警詢、偵查〕中之自白，此外並無其他證據足資補強，依刑事訴訟法第156條第2項規定，自不得以被告之自白作為有罪判決之唯一證據，被告犯罪不能證明。`}],refs:[[`TPHM,113,上訴,747,20240522,1`,`臺灣高等法院113年度上訴字第747號`,`同意書不得事後補正`],[`TNHM,113,上易,162,20240605,1`,`臺南分院113年度上易字第162號`,`探身翻找屬搜索`],[`TPHM,114,上易,780,20250917,2`,`臺灣高等法院114年度上易字第780號`,`準現行犯不備、採尿`],[`TPHM,113,上易,188,20240425,1`,`臺灣高等法院113年度上易字第188號`,`拍搜規避令狀`]]}];fr.unshift([`G`,`通用型：自選無罪按語`]),pr.unshift({id:0,g:`G`,name:`通用型`,tag:`不屬特定類型時使用；可自選無罪按語版本與補充按語`,generic:!0,steps:[`選擇主按語版本（標準、判例引註、精簡、白話、無罪推定）`,`依爭點勾選補充按語（間接證據、罪疑唯輕、補強法則等）`,`列明爭點`,`逐一說明各項證據何以不足`,`處理被告辯解：不可採不得反推有罪`,`必要時說明未再調查證據之理由`],fields:[[`issue`,`爭點`,``],[`witness`,`證人`,``],[`item`,`客觀證據`,``],[`alt`,`其他合理可能`,``]],law:``,mods:[{k:`is`,t:`列明爭點`,on:!0,x:`本件應審究者，厥為{{issue}}，茲分述如下。`},{k:`wi`,t:`證人證述前後不一、欠缺補強`,on:!0,x:`證人{{witness}}雖於〔偵查中〕證稱：〔　〕等語，然其於本院審理時改稱：〔　〕等語（見本院卷第〔　〕頁），就〔　〕之重要情節前後所述不一，且無其他證據足資補強，自難遽採為不利於被告之認定。`},{k:`ob`,t:`客觀證據無法連結被告`,on:!0,x:`卷附{{item}}，至多僅能證明〔　〕之事實，尚不足以證明被告有〔　〕之行為，與公訴意旨所指犯罪事實之間，欠缺直接而必然之關聯。`},{k:`ci`,t:`間接事實推論非唯一結論`,on:!1,x:`公訴意旨以〔　〕、〔　〕等間接事實，推論被告〔　〕，然上開間接事實縱屬真實，依經驗法則仍可能係因〔　〕所致，其推論尚非唯一合理之結論，自不得以此推測之詞為不利被告之認定。`},{k:`al`,t:`無法排除其他合理可能`,on:!1,x:`又依卷內證據，尚無從排除{{alt}}之可能，則公訴意旨所指被告〔　〕之事實，仍存有合理懷疑。`},{k:`de`,t:`辯解不可採不得反推有罪`,on:!0,x:`被告所辯固非全然無疑，惟被告否認犯罪所持辯解縱不足採，仍須有積極證據足以證明其犯罪，始得為有罪之認定，尚不能以被告之辯解不可採，即反推其有罪。`},{k:`iv`,t:`未再調查證據之理由`,on:!1,x:`至檢察官聲請〔傳喚證人〇〇〕，經本院〔傳拘無著／認待證事實已臻明瞭〕，依刑事訴訟法第163條之2第2項第〔　〕款規定，認無調查之必要，附此敘明。`}],refs:[]});var mr=[[`std`,`標準版（154、301、161＋確信程度）`,null],[`cite`,`判例引註版（40台上86、30上816、76台上4986、92台上128）`,`按犯罪事實應依證據認定之，無證據不得認定犯罪事實；又不能證明被告犯罪者，應諭知無罪之判決，刑事訴訟法第154條第2項、第301條第1項分別定有明文。又事實之認定，應憑證據，如未能發現相當證據，或證據不足以證明，自不能以推測或擬制之方法，以為裁判基礎（最高法院40年台上字第86號判例意旨參照）。認定不利於被告之事實，須依積極證據，苟積極證據不足為不利於被告事實之認定時，即應為有利於被告之認定，更不必有何有利之證據（最高法院30年上字第816號判例意旨參照）。再認定犯罪事實所憑之證據，雖不以直接證據為限，間接證據亦包括在內，然而無論直接證據或間接證據，其為訴訟上之證明，須於通常一般之人均不致有所懷疑，而得確信其為真實之程度者，始得據為有罪之認定；倘其證明尚未達到此一程度，而有合理之懷疑存在時，即無從為有罪之認定（最高法院76年台上字第4986號判例意旨參照）。另刑事訴訟法第161條第1項規定檢察官就被告犯罪事實，應負舉證責任，並指出證明之方法，是檢察官對於起訴之犯罪事實，應負提出證據及說服之實質舉證責任；倘其所提出之證據，不足為被告有罪之積極證明，或其指出證明之方法，無從說服法院以形成被告有罪之心證，基於無罪推定之原則，自應為被告無罪判決之諭知（最高法院92年台上字第128號判例意旨參照）。`],[`short`,`精簡版`,`按犯罪事實應依證據認定之，無證據不得認定犯罪事實；不能證明被告犯罪者，應諭知無罪之判決，刑事訴訟法第154條第2項、第301條第1項分別定有明文。又檢察官就被告犯罪事實，應負舉證責任，並指出證明之方法，同法第161條第1項亦有明定。是檢察官所舉證據倘不足使法院形成被告有罪之確信，而仍有合理懷疑存在時，即應為有利於被告之認定，而諭知無罪。`],[`plain`,`白話版`,`依照刑事訴訟法第154條第2項、第301條第1項規定，犯罪事實應該依照證據認定，沒有證據就不能認定犯罪事實；不能證明被告犯罪的時候，應該判決被告無罪。而且檢察官對於被告犯罪的事實，應該負舉證責任，並指出證明的方法（刑事訴訟法第161條第1項）。所以檢察官提出的證據，必須讓法院確信被告犯罪，達到一般人都不會有所懷疑的程度，才能判決被告有罪；如果檢察官提出的證據還不能使法院確信，仍然有合理懷疑存在，就應該作有利於被告的認定，判決被告無罪。`],[`presume`,`無罪推定版（154條第1項）`,`按被告未經審判證明有罪確定前，推定其為無罪，刑事訴訟法第154條第1項定有明文，此即無罪推定原則。其主要內涵，在要求負責國家刑罰權追訴之檢察官，擔負證明被告犯罪之責任；倘其所提出之證據，不足為被告有罪之積極證明，或其指出證明之方法，無法說服法院形成被告有罪之心證，縱使被告之辯解疑點重重，法院仍應予被告無罪之諭知。又犯罪事實應依證據認定之，無證據不得認定犯罪事實；不能證明被告犯罪者，應諭知無罪之判決，同法第154條第2項、第301條第1項亦有明文。`]],hr=[[`circum`,`間接證據綜合判斷`,`又法院認定犯罪事實所憑之證據，固不以直接證據為限，間接證據亦包括在內，然以間接證據推論待證事實者，須各間接證據本身已經證明，且經綜合判斷後，依經驗法則及論理法則足以推得待證事實之存在，始足當之；倘各間接證據相互間及其與待證事實間之推論，尚存有其他合理之可能，即不得遽以推測之詞為不利於被告之認定。`],[`reason`,`合理懷疑之意義`,`所謂合理懷疑，係指依通常一般人之理性判斷，就卷內證據所得之推論，存有足以動搖有罪心證之疑問而言，並非出於臆測或想像之懷疑。`],[`doubt`,`罪疑唯輕：辯解不可採不得反推有罪`,`再被告否認犯罪所持辯解縱屬不能成立，仍非有積極證據足以證明其犯罪行為，不能遽為有罪之認定；亦即不能因被告之辯解不可採，或被告未能提出證據證明其無罪，即反推其犯罪事實為真實。`],[`defb`,`被告無自證無罪義務（形式舉證）`,`又被告於刑事訴訟程序中，並無自證無罪之義務；被告對於有利於己之事實，至多僅負形式上之舉證責任，只須提出證據使法院對其有罪之心證產生合理懷疑即足，無須證明至使法院確信之程度，檢察官仍應就該有利事實之不存在負說服責任。`],[`victim`,`被害人指述須補強`,`又被害人之陳述，與一般證人不同，其與被告處於絕對相反之立場，陳述之目的在使被告受刑事訴追處罰，其證明力自較一般無利害關係之證人陳述薄弱；故被害人縱立於證人地位而為指證及陳述，且其指證、陳述無瑕疵可指，仍不得作為有罪判決之唯一證據，應調查其他補強證據以擔保其指證、陳述確有相當之真實性，始得採為論罪科刑之依據。`],[`accom`,`自白、共犯自白須補強（156條第2項）`,`又被告或共犯之自白，不得作為有罪判決之唯一證據，仍應調查其他必要之證據，以察其是否與事實相符，刑事訴訟法第156條第2項定有明文。所謂其他必要之證據，係指除該自白本身外，其他足資以證明自白之犯罪事實確具有相當程度真實性之證據而言；共同被告或共犯間之自白，縱所述內容一致，仍屬自白之範疇，不能互為補強。`],[`logic`,`自由心證不得違背經驗、論理法則（155條第1項）`,`又證據之證明力，固由法院本於確信自由判斷，然此項自由判斷職權之行使，不得違背經驗法則及論理法則，刑事訴訟法第155條第1項定有明文；所謂經驗法則，係指本於日常生活經驗所得之定則，並非個人主觀上之推測。`],[`duty`,`法院職權調查之補充性（163條第2項）`,`又刑事訴訟法第163條第2項前段所稱法院得依職權調查證據，係指法院於當事人主導之證據調查完畢後，認事實猶未臻明白，仍有待澄清時，得斟酌具體個案之情形，無待聲請，主動依職權調查之謂；同條項但書所定公平正義之維護，則專指利益被告而攸關公平正義之事項而言（最高法院101年度第2次刑事庭會議決議參照）。是法院之職權調查僅具補充性，檢察官仍應就被告犯罪事實負實質舉證責任，法院並無接續檢察官應盡之舉證責任而為不利於被告之調查之義務。`]],gr=`上開舉證責任之規定，於自訴程序亦準用之（刑事訴訟法第343條），是自訴人應就所訴之犯罪事實負實質舉證責任。`,_r={courtName:`法院`,procType:`起訴方式`,year:`年度`,word:`字別`,no:`案號`,prosNo:`起訴案號`,defendants:`被告姓名`,counsel:`辯護人`,cause:`案由`,charge:`罪名`,law:`起訴法條`,facts:`公訴事實`,evidence:`公訴所憑證據`,admit:`被告坦承之事實`,defense:`被告辯解`,counselArg:`辯護意旨`,undisputed:`不爭執事實`,undEv:`不爭執事實之證據`,prosecutor:`起訴檢察官`,trialPros:`到庭檢察官`,division:`庭別`,judge:`法官`,clerk:`書記官`,jdate:`判決日期`,mergeNo:`移送併辦案號`,contra:`扣案違禁物`,guardYears:`監護期間`,relation:`裁判上一罪關係`,partTitle:`無罪部分標題`,custCourt:`法院名稱`},vr={臺北:[`臺灣臺北地方法院`,`臺灣臺北地方檢察署`],士林:[`臺灣士林地方法院`,`臺灣士林地方檢察署`],新北:[`臺灣新北地方法院`,`臺灣新北地方檢察署`]},yr=[`一`,`二`,`三`,`四`,`五`,`六`,`七`,`八`,`九`,`十`,`十一`,`十二`,`十三`,`十四`,`十五`,`十六`,`十七`,`十八`,`十九`,`二十`],br=null,xr=null,Sr={};function Cr(e){for(var t=0;t<pr.length;t++)if(pr[t].id==e)return pr[t];return null}function wr(e){if(!br)return``;if(e===`anyuLayout`)return String(br.anyuLayout||`merge`).trim();if(e.startsWith(`f_`)){let t=e.slice(2);return String((br.common&&br.common[t])??``).trim()}if(e.startsWith(`o_`)){let t=e.slice(2);return String((br.opts&&br.opts[t])??``).trim()}ret 115年度毒聲字第123號
聲　請　人　臺灣新北地方檢察署檢察官
被　　　告　王小明

上列聲請人因被告違反毒品危害防制條例案件，聲請令入戒治處所強制戒治，本院裁定如下：

主　文
王小明令入戒治處所強制戒治，其期間為六個月以上，至無繼續強制戒治之必要為止，但最長不得逾一年。

理　由
一、聲請意旨略以：被告王小明前因施用第二級毒品案件，經本院以115年度毒聲字第50號裁定令入勒戒處所觀察、勒戒，於民國115年4月1日入所執行，將於115年5月30日期滿。茲經法務部矯正署新店戒治所附設勒戒處所於115年5月10日陳報評估結果，認被告有繼續施用毒品傾向，爰依毒品危害防制條例第20條第2項聲請強制戒治等語。
二、經查，本院已將聲請書繕本送達被告並函詢其表示意見。核閱勒戒處所檢附之有無繼續施用毒品傾向評估標準紀錄表，靜態因子合計65分（已達60分門檻），評定有繼續施用毒品傾向，並無違法或不當情事。爰依毒品危害防制條例第20條第2項裁定如主文。

中華民國115年5月25日
刑事庭法　官　○○○
以上正本證明與原本無異。
如不服本裁定，應於收受送達後10日內向本院提出抗告狀。

      <script id="embedded-snippets" type="application/json">[{"id":"snip_stat_339_4","tag":"刑§339-4Ⅰ② 三人以上詐欺","kind":"statute","category":"詐欺洗錢","content":"刑法第339條之4第1項第2款","builtIn":true},{"id":"snip_stat_ml19","tag":"洗錢§19Ⅰ後段 一般洗錢","kind":"statute","category":"詐欺洗錢","content":"洗錢防制法第19條第1項後段","builtIn":true},{"id":"snip_stat_216_210","tag":"刑§216、§210 行使偽造私文書","kind":"statute","category":"財產／文書","content":"刑法第216條、第210條","builtIn":true},{"id":"snip_stat_305","tag":"刑§305 恐嚇危害安全","kind":"statute","category":"其他刑法","content":"刑法第305條","builtIn":true},{"id":"snip_rsn_775","tag":"釋字775 累犯不予加重","kind":"reason","category":"加減刑","content":"按司法院釋字第775號解釋意旨及最高法院110年度台上大字第5660號裁定見解，被告雖構成累犯，惟本院審酌其前案與本案之罪質、情節及所生危害，認尚無特別惡性或對刑罰反應力薄弱之情，為避免其所受刑罰超過其所應負擔罪責，爰裁量不依刑法第47條第1項規定加重其刑，僅將其前科素行列入刑法第57條量刑審酌事項。","builtIn":true},{"id":"snip_rsn_159_5","tag":"刑訴§159-5 傳聞同意證據能力","kind":"reason","category":"證據能力","content":"按被告以外之人於審判外之陳述，雖不符刑事訴訟法第159條之1至第159條之4之規定，而經當事人於審判程序同意作為證據，法院審酌該言詞陳述或書面陳述作成時之情況，認為適當者，亦得為證據；當事人、代理人或辯護人於法院調查證據時，知有第159條第1項不得為證據之情形，而未於言詞辯論終結前聲明異議者，視為有前項之同意，刑事訴訟法第159條之5第1項、第2項定有明文。本案下列供述證據，檢察官、被告及辯護人於本院審理時均未爭執其證據能力，本院審酌其作成時之情況，並無不當取供或顯不可信之情形，認以之作為證據應屬適當，均具證據能力。","builtIn":true},{"id":"snip_rsn_aside","tag":"不另為無罪之諭知（想像競合）","kind":"reason","category":"無罪／競合","content":"公訴意旨另認被告就此部分亦涉犯〔罪名〕罪嫌云云。惟查卷內尚無積極證據足資證明被告確有此部分犯行，本應為無罪之諭知，然因公訴人認此部分與前開論罪科刑部分具有想像競合犯之裁判上一罪關係，爰不另為無罪之諭知，附此敘明。","builtIn":true},{"id":"snip_rsn_nofine","tag":"想像競合不併科輕罪罰金","kind":"reason","category":"量刑","content":"又本案既依刑法第55條前段規定從一重處斷，審酌輕罪所定併科罰金刑之立法目的及被告本案犯罪所得與資力狀況，認無封鎖作用適用之必要，爰不併科輕罪之罰金，併予敘明。","builtIn":true}]</script>
